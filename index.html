  { id: "L16-57", type: "kana", prompt: "figure", answer: "[フィ]ギャー", lesson: 16, hint: "FIG-ure", note: "「fixture」と聞こえた", tag: "Work Document", priority: 2 },
  { id: "L16-58", type: "kana", prompt: "action items", answer: "[ア]クション [ア]イテムズ", lesson: 16, hint: "複数の s", note: "「actual item」「auction item」と聞こえた", tag: "Work Document", priority: 2 },
  { id: "L16-59", type: "kana", prompt: "provided by the client", answer: "プロ[ヴァ]イディッド バイ ザ [クラ]イアント", lesson: 16, hint: "pro-VID-ed", note: "「Read that」と聞こえた", tag: "Work Document", priority: 2 },
  { id: "L16-60", type: "kana", prompt: "written in green", answer: "[リ]トゥン イン [グリー]ン", lesson: 16, hint: "green＝グリーン（長いイー＋n）", note: "「written in GURI」と聞こえた。語尾の n が落ちた", tag: "Work Document", priority: 3 },
  { id: "L16-61", type: "kana", prompt: "meeting minutes", answer: "[ミー]ティング [ミ]ニッツ", lesson: 16, hint: "minutes＝ミニッツ", tag: "Work Document", priority: 2 },
  // Lesson 17: 誤文訂正
  { id: "L17-01", type: "correct", prompt: "I still at work office.", answer: "I'm still at the office.", lesson: 17, hint: "be動詞が抜けている", note: "work office は不自然", tag: "雑談", priority: 1 },
  // Lesson 17: 和文英訳
  { id: "L17-02", type: "trans", prompt: "この後は仕事はないけど、別の英会話レッスンがある。", answer: "I don't have any more work after this, but I have another English lesson.", lesson: 17, hint: "any more work", note: "\"I don't really mind my work\" と言ってしまった", tag: "雑談", priority: 2 },
  // Lesson 17: 誤文訂正
  { id: "L17-03", type: "correct", prompt: "I haven't eat dinner yet.", answer: "I haven't eaten dinner yet.", lesson: 17, hint: "haven't＋過去分詞", note: "講師のフィードバック", tag: "文法", priority: 1 },
  // Lesson 17: 和文英訳
  { id: "L17-04", type: "trans", prompt: "夜11時に夕食を食べるつもり。", answer: "I'm going to have dinner at 11 p.m.", lesson: 17, hint: "be going to", note: "trying to eat だと「頑張って食べる」", tag: "雑談", priority: 2 },
  // Lesson 17: 誤文訂正
  { id: "L17-05", type: "correct", prompt: "Did I said the word movies?", answer: "Did I say \"movies\"? / What did I say?", lesson: 17, hint: "did＋原形", note: "質問のときに出た", tag: "文法", priority: 1 },
  { id: "L17-06", type: "correct", prompt: "I can hear screen clearly.", answer: "I can see the screen clearly.", lesson: 17, hint: "画面は「見る」", tag: "雑談", priority: 3 },
  // Lesson 17: 穴埋め
  { id: "L17-07", type: "blank", prompt: "The movie was so exciting (   ) I forgot about everything else.", answer: "that", lesson: 17, hint: "so＋形容詞＋___", note: "so ~ that 構文", tag: "so-that", priority: 2 },
  { id: "L17-08", type: "blank", prompt: "The movie was so sad that I (   ) crying.（2語）", answer: "ended up", lesson: 17, hint: "結局〜する", note: "意味を質問した表現。ended up＝結局〜する。発音は「エンディダップ」と1語のようにつなげる", tag: "so-that", priority: 1 },
  // Lesson 17: 和文英訳
  { id: "L17-09", type: "trans", prompt: "その映画は怖すぎて、その夜は眠れなかった。", answer: "The movie was so scary that I couldn't sleep that night.", lesson: 17, hint: "tonight ではない", note: "that night と tonight を混同", tag: "so-that", priority: 1 },
  { id: "L17-10", type: "trans", prompt: "その映画はとても複雑で、理解するために2回見なければならなかった。", answer: "The movie was so complex that I had to watch it twice to understand it.", lesson: 17, hint: "had to", note: "途中で言い直し", tag: "so-that", priority: 2 },
  // Lesson 17: 穴埋め
  { id: "L17-11", type: "blank", prompt: "The beautiful songs keep me (   ).", answer: "relaxed", lesson: 17, hint: "-ed の形容詞", note: "keep＋人＋形容詞", tag: "keep me", priority: 2 },
  // Lesson 17: 誤文訂正
  { id: "L17-12", type: "correct", prompt: "The long conversation keep me bored.", answer: "Long conversations keep me bored.", lesson: 17, hint: "単数・複数と動詞", tag: "keep me", priority: 2 },
  { id: "L17-13", type: "correct", prompt: "The fast-paced action scenes keep me serious.", answer: "The fast-paced action scenes keep me excited. / The fast-paced action scenes keep me on the edge of my seat.", lesson: 17, hint: "serious は「深刻」", tag: "keep me", priority: 2 },
  // Lesson 17: 穴埋め
  { id: "L17-14", type: "blank", prompt: "The loud and sudden sounds keep me (   ).", answer: "scared", lesson: 17, hint: "怖がっている", note: "詰まった箇所", tag: "keep me", priority: 2 },
  // Lesson 17: 和文英訳
  { id: "L17-15", type: "trans", prompt: "コメディ映画はとても面白いので、嫌な気分を忘れられる。", answer: "Comedy movies are so funny that I forget my bad feelings.", lesson: 17, hint: "so funny that", note: "Let's Try で詰まった", tag: "Let's Try", priority: 1 },
  // Lesson 17: 穴埋め
  { id: "L17-16", type: "blank", prompt: "…I can't stop laughing, even on (   ) bad day.", answer: "a", lesson: 17, hint: "冠詞", note: "the と言っていた", tag: "Let's Try", priority: 2 },
  // Lesson 17: 誤文訂正
  { id: "L17-17", type: "correct", prompt: "Watching movie is a great way to relax.", answer: "Watching movies is a great way to relax.", lesson: 17, hint: "一般論は複数形", note: "音読で2回とも単数", tag: "Let's Try", priority: 2 },
  { id: "L17-18", type: "correct", prompt: "The action scene in The Matrix made me a big impression on me.", answer: "The action scenes in The Matrix made a big impression on me.", lesson: 17, hint: "make a big impression on 人", note: "講師のフィードバック", tag: "Matrix", priority: 1 },
  { id: "L17-19", type: "correct", prompt: "I watched the movie when I about 12.", answer: "I watched the movie when I was about 12.", lesson: 17, hint: "be動詞が抜けている", tag: "Matrix", priority: 1 },
  // Lesson 17: 和文英訳
  { id: "L17-20", type: "trans", prompt: "その映画は、未来の人間とAIの戦いを描いている。", answer: "The movie is about a war between humans and AI in the future.", lesson: 17, hint: "be about", note: "言いかけて止まった", tag: "Matrix", priority: 1 },
  { id: "L17-21", type: "trans", prompt: "2050年ごろが舞台の話です。", answer: "It's set around the year 2050.", lesson: 17, hint: "be set in / around", tag: "Matrix", priority: 2 },
  { id: "L17-22", type: "trans", prompt: "映画の中では、AIが人間を支配している。", answer: "In the movie, AI has taken over the world and controls humans.", lesson: 17, hint: "take over", note: "言えずに諦めた部分。taken over は「テイクノウヴァ」、controls は「カントロウルズ」とつなげて言う。どちらも tro に強勢", tag: "Matrix", priority: 1 },
  { id: "L17-23", type: "trans", prompt: "ストレスを感じている友達には、アクション映画をすすめる。見ている間は他のことを全部忘れられるから。", answer: "I'd recommend an action movie to a friend who feels stressed, because you can forget about everything else while you're watching it.", lesson: 17, hint: "while you're watching", note: "when I watching と言っていた", tag: "おすすめ", priority: 1 },
  { id: "L17-24", type: "trans", prompt: "（声かけで）頑張って！", answer: "Good luck! / You've got this!", lesson: 17, hint: "Fighting! は使わない", tag: "雑談", priority: 3 },
  // Lesson 17: カタカナ発音
  { id: "L17-25", type: "kana", prompt: "movies", answer: "ムーヴィーズ", lesson: 17, hint: "/ˈmuːviz/ 語尾は濁る", note: "単数に聞こえた", tag: "発音", priority: 1 },
  { id: "L17-26", type: "kana", prompt: "loud", answer: "ラウドゥ", lesson: 17, hint: "/laʊd/ 「ロウ」ではない", note: "Lower と聞こえた", tag: "発音", priority: 1 },
  { id: "L17-27", type: "kana", prompt: "fun", answer: "ファン", lesson: 17, hint: "/fʌn/ 短く、rなし", note: "Farm と聞こえた", tag: "発音", priority: 1 },
  { id: "L17-28", type: "kana", prompt: "complex", answer: "[カ]ンプレックス", lesson: 17, hint: "/ˈkɑːmpleks/ 第1音節が強い", note: "Conference と聞こえた", tag: "発音", priority: 1 },
  { id: "L17-29", type: "kana", prompt: "interested", answer: "[イ]ントゥレスティッド", lesson: 17, hint: "/ˈɪntrəstɪd/ 3音節", note: "Enter set と聞こえた", tag: "発音", priority: 1 },
  { id: "L17-30", type: "kana", prompt: "laughing", answer: "[ラ]フィング", lesson: 17, hint: "/ˈlæfɪŋ/ 語尾は「ング」", note: "Luffy と聞こえた", tag: "発音", priority: 1 },
  { id: "L17-31", type: "kana", prompt: "bored", answer: "ボーアドゥ", lesson: 17, hint: "/bɔːrd/ 唇を閉じて B", note: "Lord と聞こえた", tag: "発音", priority: 1 },
  { id: "L17-32", type: "kana", prompt: "scared", answer: "スケアードゥ", lesson: 17, hint: "/skerd/ 1音節", tag: "発音", priority: 2 },
  { id: "L17-33", type: "kana", prompt: "eaten", answer: "イートゥン", lesson: 17, hint: "/ˈiːtn/ t は喉で止める", note: "03番と一緒に", tag: "発音", priority: 2 },
  { id: "L17-34", type: "kana", prompt: "impression", answer: "インプ[レ]ッション", lesson: 17, hint: "/ɪmˈpreʃən/ pre が強い", note: "18番と一緒に", tag: "発音", priority: 2 },
  { id: "L17-35", type: "kana", prompt: "conversations", answer: "カンヴァ[セ]イションズ", lesson: 17, hint: "/ˌkɑːnvərˈseɪʃənz/ se が強い、語尾ズ", tag: "発音", priority: 3 },
  { id: "L17-36", type: "kana", prompt: "ended up", answer: "[エ]ンディダップ", lesson: 17, hint: "1語のようにつなげる", note: "ended up は「エンディダップ」とつなげて言うと自然。d と up が連結", tag: "発音", priority: 1 },
  { id: "L17-37", type: "kana", prompt: "taken over", answer: "テイク[ノ]ウヴァ", lesson: 17, hint: "音をつなげる", note: "taken over は「テイクノウヴァ」。n と over が連結。tro に強勢", tag: "発音", priority: 1 },
  { id: "L17-38", type: "kana", prompt: "controls", answer: "カン[ト]ロウルズ", lesson: 17, hint: "tro に強勢", note: "controls は「カントロウルズ」。tro に強勢を置く", tag: "発音", priority: 1 },
  // Lesson 18: 和文英訳
  { id: "L18-01", type: "trans", prompt: "さっきプリンターに何があったか気づきましたか？", answer: "Did you notice what happened with the printer earlier?", lesson: 18, hint: "notice what happened / earlier", note: "earlier＝今より少し前（さっき）。レッスン中に意味を質問した", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-02", type: "trans", prompt: "いいえ、気づきませんでした。何があったんですか？", answer: "No, I didn't. What happened?", lesson: 18, note: "ロールプレイで「Oh, I did it!」と聞こえた箇所あり。didn't の n't をはっきり", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-03", type: "trans", prompt: "ジョンが何かを印刷しようとするのを見ましたが、プリンターが動かなくなりました。", answer: "I saw John try to print something, but the printer stopped working.", lesson: 18, hint: "see＋人＋動詞の原形", note: "「his printer」と言った。知覚動詞（see/hear/notice など）＋人＋原形で「人が～するのを見る」", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-04", type: "trans", prompt: "彼はとてもイライラしているように見えました。", answer: "He looked really frustrated.", lesson: 18, hint: "look＋形容詞（過去形）", note: "「He looks really frustrated」と現在形で言った。過去の話なので looked", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-05", type: "trans", prompt: "えっ、彼はそれを直しましたか？", answer: "Oh no, did he fix it?", lesson: 18, hint: "did he", note: "「didn't you fix it?」と言った。主語は he、否定にしない", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-06", type: "trans", prompt: "彼がITに助けを求めるのを聞きましたが、少し時間がかかるかもしれません。", answer: "I heard him ask IT for help, but it might take some time.", lesson: 18, hint: "hear＋人＋原形 / ask ～ for help", note: "「I hardly even ask」「I have him ask」と聞こえた。heard の発音に注意。IT を「it」と読んだ箇所もあり", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-07", type: "trans", prompt: "それは困りますね。早く直してくれるといいのですが。", answer: "That's annoying. I hope they fix it soon.", lesson: 18, hint: "I hope＋主語＋動詞", note: "「I hope them fix it」と言った。hope の後は they（主格）", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-08", type: "trans", prompt: "私も書類を印刷する必要があります。", answer: "I need to print some documents, too.", lesson: 18, hint: "need to", note: "正しく言えていた", tag: "Troubles at the Workplace", priority: 3 },
  { id: "L18-09", type: "trans", prompt: "アンナが窓を開けるのを見ました。", answer: "I saw Anna open the window.", lesson: 18, hint: "saw＋人＋原形", note: "「over the window」「an up the window」と聞こえた。open をはっきり", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-10", type: "trans", prompt: "電話が鳴るのが聞こえました。", answer: "I heard the phone ring.", lesson: 18, hint: "heard＋物＋原形", note: "「I have the phone links」と聞こえた。heard と ring の発音", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-11", type: "trans", prompt: "トムが静かに部屋を出るのに気づきました。", answer: "I noticed Tom leave the room quietly.", lesson: 18, hint: "noticed＋人＋原形", note: "「I know these storm leaves」「read the group」と聞こえた。leave は原形（leaves にしない）", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-12", type: "trans", prompt: "猫がボールを追いかけるのを見ました。", answer: "I watched the cat chase the ball.", lesson: 18, hint: "watched＋動物＋原形", note: "「the car chase a bull」と聞こえた。the ball（a ではない）", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-13", type: "trans", prompt: "風が顔に当たるのを感じました。", answer: "I felt the wind blow on my face.", lesson: 18, hint: "felt＋物＋原形", note: "正しく言えていた", tag: "Troubles at the Workplace", priority: 3 },
  { id: "L18-14", type: "trans", prompt: "学生たちがプレゼンの練習をするのを観察しました。", answer: "I observed the students practice their presentations.", lesson: 18, hint: "observed＋人＋原形", note: "「Observe the students…」と I が抜け、現在形になった。presentations は複数形", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-15", type: "trans", prompt: "電話が鳴るのが聞こえましたか？", answer: "Did you hear the phone ring?", lesson: 18, hint: "Did you hear ～", note: "「Did you have a phone link」と言い、講師に直された。疑問文では hear（原形）", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-16", type: "trans", prompt: "トムが静かに部屋を出るのに気づきましたか？", answer: "Did you notice Tom leave the room quietly?", lesson: 18, hint: "notice＋人＋原形", note: "「Did you notice that Tom leaves…」と言い、講師に「leave」と直された。that も s も不要", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-17", type: "trans", prompt: "猫がボールを追いかけるのを見ましたか？", answer: "Did you watch the cat chase the ball?", lesson: 18, note: "「the Cat Chasable」と聞こえた。chase と the ball を区切る", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-18", type: "trans", prompt: "風が顔に当たるのを感じましたか？", answer: "Did you feel the wind blow on your face?", lesson: 18, hint: "my → your", note: "「roll on your face」と聞こえた。blow の b", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-19", type: "trans", prompt: "オフィスのWi-Fiに何があったか見ましたか？", answer: "Did you see what happened to the office Wi-Fi?", lesson: 18, hint: "happened to", note: "自分の番では「what happened about my laptop computer」と言った。happened to / with を使う", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-20", type: "trans", prompt: "ジョンがサーバーに再接続しようとしているのを見ましたが、パソコン全体がクラッシュしました。", answer: "I saw John trying to reconnect to the server, but his entire computer crashed.", lesson: 18, hint: "saw＋人＋～ing", note: "講師のセリフ。～ing は「している最中」を見た、原形は「一部始終」を見た", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-21", type: "trans", prompt: "彼がITサポートチームと話しているのが聞こえました。", answer: "I heard him talking to the IT support team.", lesson: 18, hint: "heard＋人＋～ing", note: "講師のセリフ", tag: "Troubles at the Workplace", priority: 3 },
  { id: "L18-22", type: "trans", prompt: "ジョンがパソコンをアップデートしようとするのを見ましたが、できませんでした。", answer: "I saw John try to update his computer, but he couldn't.", lesson: 18, hint: "can の過去形", note: "「but he can't update it」と言った。過去の話なので couldn't（講師の訂正ではなく補足）", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-23", type: "trans", prompt: "確認のためにスケジュールをチェックする必要があります。", answer: "I need to check the schedule to confirm it.", lesson: 18, hint: "check ～ to confirm", note: "「I need to browse for confirmed schedules」と言い、講師に直された", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-24", type: "trans", prompt: "同僚と誤解（行き違い）がありました。", answer: "I had a misunderstanding with a colleague.", lesson: 18, hint: "have a misunderstanding with", note: "「I have… I had missed…」と言い直しが多かった。一息で言う", tag: "Speaking", priority: 1 },
  { id: "L18-25", type: "trans", prompt: "彼女はお客様に過大請求してしまいました。", answer: "She overcharged a customer.", lesson: 18, hint: "overcharge＋人", note: "「overcharged to customer」と言った。to は不要、a が必要", tag: "Speaking", priority: 1 },
  { id: "L18-26", type: "trans", prompt: "私たちは正しい金額を計算し、翌日お客様に差額を返金しました。", answer: "We calculated the correct price and refunded the customer the difference the following day.", lesson: 18, hint: "refund＋人＋the difference", note: "「we repay」「we pay it」と言った。返金は refund、差額は the difference。過去形 calculated にする", tag: "Speaking", priority: 1 },
  { id: "L18-27", type: "trans", prompt: "私は普段あまり怒りません。", answer: "I don't usually get angry.", lesson: 18, hint: "get＋形容詞", note: "「I don't usually angry」と言った。angry は形容詞なので get が必要（講師フィードバック）", tag: "Speaking", priority: 1 },
  { id: "L18-28", type: "trans", prompt: "そういう状況に対処するとき、私はたいてい落ち着いています。", answer: "I'm usually calm when dealing with those situations.", lesson: 18, hint: "calm / deal with", note: "「I'm usually called when dating」と聞こえた。講師がチャットに書いた文", tag: "Speaking", priority: 1 },
  { id: "L18-29", type: "trans", prompt: "今日はもう仕事はありません。", answer: "I don't have any more work today.", lesson: 18, hint: "any more", note: "「I don't have any… any more work」と言い直した", tag: "Small Talk", priority: 2 },
  { id: "L18-30", type: "trans", prompt: "このあと、もう一つ英語のレッスンがあります。", answer: "I have another English lesson after this.", lesson: 18, hint: "これからの予定は現在形", note: "「I had another English lesson after this」と過去形で言った", tag: "Small Talk", priority: 1 },
  { id: "L18-31", type: "trans", prompt: "そのレッスンのあと、テニスをします。", answer: "I'll be playing tennis after taking that lesson.", lesson: 18, hint: "I'll be ～ing", note: "「I have pray tennis after that reason」と聞こえた。講師フィードバックで訂正", tag: "Small Talk", priority: 1 },
  { id: "L18-32", type: "trans", prompt: "税理士との打ち合わせがありました。", answer: "I had a meeting with my tax accountants.", lesson: 18, hint: "have a meeting with", note: "ほぼ正しく言えていた（my を付けると自然）", tag: "Small Talk", priority: 3 },
  { id: "L18-33", type: "trans", prompt: "ちょうど終わったところです。", answer: "I just finished it.", lesson: 18, hint: "just finished", note: "正しく言えていた", tag: "Small Talk", priority: 3 },
  { id: "L18-34", type: "trans", prompt: "いいえ、違います。今日はレッスン18です。", answer: "No, that's not correct. Today is Lesson 18.", lesson: 18, hint: "Lesson＋番号", note: "「it's not correct. today's 18 program」と言った", tag: "Small Talk", priority: 2 },
  { id: "L18-35", type: "trans", prompt: "すみません、間違えました。", answer: "Sorry, I made a mistake.", lesson: 18, hint: "make a mistake", note: "「Sorry, I have mistaken」と言った。My mistake. でも可", tag: "Small Talk", priority: 1 },
  { id: "L18-36", type: "trans", prompt: "「earlier」という単語はどういう意味ですか？", answer: "What does the word 'earlier' mean?", lesson: 18, hint: "What does ～ mean?", note: "正しく言えていた", tag: "Small Talk", priority: 3 },
  { id: "L18-37", type: "trans", prompt: "説明してくれてありがとうございます。", answer: "Thank you for explaining.", lesson: 18, hint: "Thank you for ～ing", note: "「Thank you for referring」と聞こえた", tag: "Small Talk", priority: 2 },
  { id: "L18-38", type: "trans", prompt: "フィードバックをありがとうございます。", answer: "Thank you for the feedback.", lesson: 18, hint: "the", note: "「thank you for feedback」と the が抜けた", tag: "Small Talk", priority: 2 },
  { id: "L18-39", type: "trans", prompt: "前のページを見せてもらえますか？", answer: "Could you show me the previous page?", lesson: 18, hint: "the previous page", note: "「Let me see… previous page」と言った。L16でも同じ指摘。the を付ける", tag: "Small Talk", priority: 1 },
  { id: "L18-40", type: "trans", prompt: "「過大請求する」を英語で言うと？", answer: "overcharge", lesson: 18, hint: "over＋charge", note: "overcharge a customer で「客に多く請求する」", tag: "Vocabulary", priority: 1 },
  { id: "L18-41", type: "trans", prompt: "「返金する／返金」を英語で言うと？", answer: "refund", lesson: 18, hint: "re-", note: "repay は「借りた金を返す」。払いすぎた分を返すのは refund", tag: "Vocabulary", priority: 1 },
  { id: "L18-42", type: "trans", prompt: "「差額」を英語で言うと？", answer: "the difference", lesson: 18, note: "「different」と聞こえた。名詞は difference", tag: "Vocabulary", priority: 1 },
  { id: "L18-43", type: "trans", prompt: "「締め切りを守れない」を英語で言うと？", answer: "miss a deadline", lesson: 18, hint: "miss", note: "質問文 a coworker missed a deadline の意味が取りにくかった", tag: "Vocabulary", priority: 2 },
  { id: "L18-44", type: "trans", prompt: "「イライラさせる・困った（物事が）」を英語で言うと？", answer: "annoying", lesson: 18, note: "人がイライラしているのは frustrated / annoyed", tag: "Vocabulary", priority: 2 },
  { id: "L18-45", type: "trans", prompt: "「落ち着いている」を英語で言うと？", answer: "calm", lesson: 18, hint: "l は発音しない", tag: "Vocabulary", priority: 2 },
  // Lesson 18: 穴埋め
  { id: "L18-46", type: "blank", prompt: "Did you notice what happened with the printer ___? (さっき)", answer: "earlier", lesson: 18, tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-47", type: "blank", prompt: "I saw John ___ to print something. (try)", answer: "try", lesson: 18, hint: "原形", note: "tried / tries にしない", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-48", type: "blank", prompt: "He ___ really frustrated. (look・過去)", answer: "looked", lesson: 18, tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-49", type: "blank", prompt: "I heard him ___ IT for help.", answer: "ask", lesson: 18, hint: "原形", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-50", type: "blank", prompt: "I hope ___ fix it soon. (彼らが)", answer: "they", lesson: 18, hint: "主格", note: "them ではない", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-51", type: "blank", prompt: "It ___ take some time. (かもしれない)", answer: "might", lesson: 18, tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-52", type: "blank", prompt: "I noticed Tom ___ the room quietly. (leave)", answer: "leave", lesson: 18, hint: "原形", note: "leaves にしない", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-53", type: "blank", prompt: "Did you ___ the phone ring?", answer: "hear", lesson: 18, hint: "Did の後は原形", note: "have ではない", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-54", type: "blank", prompt: "I watched the cat ___ the ball.", answer: "chase", lesson: 18, hint: "追いかける", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-55", type: "blank", prompt: "I felt the wind ___ on my face.", answer: "blow", lesson: 18, tag: "Troubles at the Workplace", priority: 3 },
  { id: "L18-56", type: "blank", prompt: "I need to check the schedule to ___ it.", answer: "confirm", lesson: 18, hint: "確認する", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-57", type: "blank", prompt: "I had a misunderstanding ___ a colleague.", answer: "with", lesson: 18, tag: "Speaking", priority: 2 },
  { id: "L18-58", type: "blank", prompt: "She ___ a customer. (過大請求した)", answer: "overcharged", lesson: 18, tag: "Speaking", priority: 1 },
  { id: "L18-59", type: "blank", prompt: "We ___ the customer the difference the following day. (返金した)", answer: "refunded", lesson: 18, tag: "Speaking", priority: 1 },
  { id: "L18-60", type: "blank", prompt: "I don't usually ___ angry.", answer: "get", lesson: 18, tag: "Speaking", priority: 1 },
  { id: "L18-61", type: "blank", prompt: "I'm usually calm when ___ with those situations.", answer: "dealing", lesson: 18, hint: "deal with", tag: "Speaking", priority: 1 },
  { id: "L18-62", type: "blank", prompt: "I'll ___ playing tennis after taking that lesson.", answer: "be", lesson: 18, hint: "will be ～ing", tag: "Small Talk", priority: 2 },
  // Lesson 18: 誤文訂正
  { id: "L18-63", type: "correct", prompt: "I don't usually angry.", answer: "I don't usually get angry.", lesson: 18, hint: "get", note: "講師フィードバック", tag: "Speaking", priority: 1 },
  { id: "L18-64", type: "correct", prompt: "I have play tennis after that lesson.", answer: "I'll be playing tennis after taking that lesson.", lesson: 18, hint: "未来の予定", note: "講師フィードバック", tag: "Small Talk", priority: 1 },
  { id: "L18-65", type: "correct", prompt: "I hope them fix it soon.", answer: "I hope they fix it soon.", lesson: 18, hint: "主格", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-66", type: "correct", prompt: "Oh no, didn't you fix it?", answer: "Oh no, did he fix it?", lesson: 18, hint: "主語／肯定の疑問", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-67", type: "correct", prompt: "He looks really frustrated. (さっきの話)", answer: "He looked really frustrated.", lesson: 18, hint: "過去形", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-68", type: "correct", prompt: "Did you notice that Tom leaves the room quietly?", answer: "Did you notice Tom leave the room quietly?", lesson: 18, hint: "notice＋人＋原形", note: "講師に直された文", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-69", type: "correct", prompt: "Did you have a phone ring?", answer: "Did you hear the phone ring?", lesson: 18, hint: "hear / the", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-70", type: "correct", prompt: "I need to browse for confirmed schedules.", answer: "I need to check the schedule to confirm it.", lesson: 18, hint: "check ～ to confirm", note: "講師に直された文", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-71", type: "correct", prompt: "She overcharged to customer.", answer: "She overcharged a customer.", lesson: 18, hint: "to 不要／a", note: "講師に直された文", tag: "Speaking", priority: 1 },
  { id: "L18-72", type: "correct", prompt: "We calculate correct price and we repay.", answer: "We calculated the correct price and refunded the customer the difference.", lesson: 18, hint: "過去形／the／refund", note: "講師に直された文", tag: "Speaking", priority: 1 },
  { id: "L18-73", type: "correct", prompt: "I had another English lesson after this. (これからの予定)", answer: "I have another English lesson after this.", lesson: 18, hint: "現在形", tag: "Small Talk", priority: 1 },
  { id: "L18-74", type: "correct", prompt: "Sorry, I have mistaken.", answer: "Sorry, I made a mistake.", lesson: 18, hint: "make a mistake", tag: "Small Talk", priority: 1 },
  { id: "L18-75", type: "correct", prompt: "I saw John try to update his computer, but he can't update it.", answer: "I saw John try to update his computer, but he couldn't.", lesson: 18, hint: "過去形", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-76", type: "correct", prompt: "Thank you for feedback.", answer: "Thank you for the feedback.", lesson: 18, hint: "the", tag: "Small Talk", priority: 2 },
  // Lesson 18: カタカナ発音
  { id: "L18-77", type: "kana", prompt: "I heard him ask IT for help", answer: "アイ [ハ]ード ヒム [ア]スク アイ[ティ]ー フォー [ヘ]ルプ", lesson: 18, hint: "heard＝ハード（短く、語尾 d）", note: "「I hardly even ask」「I have him」と聞こえた。IT はアイティー", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-78", type: "kana", prompt: "the phone ring", answer: "ザ [フォ]ウン [リ]ング", lesson: 18, hint: "ring＝リング（語尾は ng）", note: "「phone links」と聞こえた。r で始め、語尾に ks を付けない", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-79", type: "kana", prompt: "I noticed Tom leave the room", answer: "アイ [ノ]ウティスト [ト]ム [リ]ーヴ ザ [ル]ーム", lesson: 18, hint: "leave は l、room は r", note: "「I know these storm」「read the group」「leaves the crew」と聞こえた。l と r の区別", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-80", type: "kana", prompt: "the cat chase the ball", answer: "ザ [キャ]ット [チェ]イス ザ [ボ]ール", lesson: 18, hint: "cat＝キャット、ball＝ボール", note: "「the car chase a bull」と聞こえた。cat の語尾 t、ball は口を縦に開けてオー", tag: "Troubles at the Workplace", priority: 1 },
  { id: "L18-81", type: "kana", prompt: "open the window", answer: "[オ]ウプン ザ [ウィ]ンドウ", lesson: 18, hint: "O-pen", note: "「over the window」「up the window」と聞こえた。p をはっきり", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-82", type: "kana", prompt: "blow on your face", answer: "[ブロ]ウ オン ユア [フェ]イス", lesson: 18, hint: "bl-", note: "「roll on your face」と聞こえた。語頭の b を落とさない", tag: "Troubles at the Workplace", priority: 2 },
  { id: "L18-83", type: "kana", prompt: "play tennis", answer: "[プレ]イ [テ]ニス", lesson: 18, hint: "play は l", note: "「pray tennis」と聞こえた。pray（祈る）にならないよう舌先を上の歯ぐきに付ける", tag: "Small Talk", priority: 1 },
  { id: "L18-84", type: "kana", prompt: "lesson", answer: "[レ]ッスン", lesson: 18, hint: "l で始める", note: "「reason」と聞こえた", tag: "Small Talk", priority: 1 },
  { id: "L18-85", type: "kana", prompt: "calm", answer: "[カ]ーム", lesson: 18, hint: "l は発音しない", note: "「called」と聞こえた。講師が2回言い直した", tag: "Speaking", priority: 1 },
  { id: "L18-86", type: "kana", prompt: "get angry", answer: "ゲット [ア]ングリー", lesson: 18, hint: "ANG-gry", note: "「get agree」と聞こえた。n をはっきり", tag: "Speaking", priority: 1 },
  { id: "L18-87", type: "kana", prompt: "dealing with those situations", answer: "[ディ]ーリング ウィズ [ゾ]ウズ シチュ[エ]イションズ", lesson: 18, hint: "DEAL-ing", note: "「dating」「jeering」と聞こえた。d＋長いイー＋l", tag: "Speaking", priority: 1 },
  { id: "L18-88", type: "kana", prompt: "refunded the customer", answer: "リ[ファ]ンディッド ザ [カ]スタマー", lesson: 18, hint: "re-FUND-ed", note: "「leap on to the customer」と聞こえた。r で始め、f をはっきり", tag: "Speaking", priority: 1 },
  { id: "L18-89", type: "kana", prompt: "the difference", answer: "ザ [ディ]ファレンス", lesson: 18, hint: "語尾は -ence（ス）", note: "「the different」と聞こえた", tag: "Speaking", priority: 2 },
  { id: "L18-90", type: "kana", prompt: "observed", answer: "オブ[ザ]ーヴド", lesson: 18, hint: "ob-SERVED", note: "語尾の d が落ちて「observe」と聞こえた", tag: "Troubles at the Workplace", priority: 3 },
  // Lesson C1: 和文英訳
  { id: "C1-01", type: "trans", prompt: "パソコンのことで助けが必要です。フリーズし続けるんです。", answer: "I need help with my computer. It keeps freezing.", lesson: "C1", hint: "need help with / keep ～ing", note: "暗唱で「I need for help」「I need with help」と言った。need help with ～ の語順で固定", tag: "IT Support", priority: 1 },
  { id: "C1-02", type: "trans", prompt: "注文を効率的に処理する能力に影響が出ています。", answer: "It's affecting my ability to process orders efficiently.", lesson: "C1", hint: "affect my ability to ～ / process orders", note: "ability と process orders の意味が取れなかった。暗唱で efficiently を「effectively」と言った。process orders は1語のつもりで覚える（講師）", tag: "IT Support", priority: 1 },
  { id: "C1-03", type: "trans", prompt: "代わりのものを手配してもらうことは可能ですか？", answer: "Is it possible to arrange a replacement?", lesson: "C1", hint: "arrange a replacement", note: "暗唱で「to arrange their… arranging」と言い直した。最初のリスニングでは冒頭から replacement の話が出ていることに気づかなかった", tag: "IT Support", priority: 1 },
  { id: "C1-04", type: "trans", prompt: "それはお気の毒です（それは大変ですね）。", answer: "I'm sorry to hear that.", lesson: "C1", hint: "I'm sorry to ～", note: "暗唱で「It's sorry to hear that」と言った。主語は I", tag: "IT Support", priority: 2 },
  { id: "C1-05", type: "trans", prompt: "再起動するか、ソフトウェアのアップデートを確認するかは試しましたか？", answer: "Have you tried rebooting it or checking for software updates?", lesson: "C1", hint: "try ～ing / A or B は同じ形", note: "暗唱で「Have you rebooting it?」と tried が抜け、後半を「or check」と言った。or は rebooting と checking をつなぐので両方 -ing（講師）", tag: "IT Support", priority: 1 },
  { id: "C1-06", type: "trans", prompt: "両方試しましたが、問題は続いています。", answer: "I've tried both, but the problem has persisted.", lesson: "C1", hint: "persist＝しつこく続く", note: "persist を知らなかった。has been persisting では？と質問→現在完了だけで「今も続いている」は十分伝わる。-ing は今まさに続いていることを強調したいとき（講師）", tag: "IT Support", priority: 1 },
  { id: "C1-07", type: "trans", prompt: "わかりました。代わりのものをあなたに送るよう、IT部門に話します。", answer: "Understood. I'll speak with the IT department to send a replacement to you.", lesson: "C1", hint: "speak with / send A to 人", note: "音読で「IT development」と読んだ。暗唱で「to arrange」と言いかけた（ここは send）", tag: "IT Support", priority: 1 },
  { id: "C1-08", type: "trans", prompt: "シリアルナンバーと機種の詳細を送ってもらえますか？", answer: "Can you send me the serial number and the model details?", lesson: "C1", hint: "send＋人＋物", note: "暗唱で「Could you send me」と言い、Can you に直された。the model details の the が落ちた回もあり", tag: "IT Support", priority: 2 },
  { id: "C1-09", type: "trans", prompt: "もちろんです。この電話のすぐ後にメールで送ります。", answer: "Sure, I'll email those to you right after this call.", lesson: "C1", hint: "email＋物＋to 人 / right after", note: "暗唱で「after right this call」と語順が逆になった。right after の順", tag: "IT Support", priority: 1 },
  { id: "C1-10", type: "trans", prompt: "代わりのものが届くまで、どのくらいかかると思いますか？", answer: "How long do you think it will take to get the replacement?", lesson: "C1", hint: "How long do you think it will take to ～", note: "do you think を挟んだ後は it will take の語順（will it にしない）", tag: "IT Support", priority: 1 },
  { id: "C1-11", type: "trans", prompt: "詳細をいただいたら、2日ほどかかるはずです。", answer: "Once I have the details, it should take about two days.", lesson: "C1", hint: "once＝いったん～したら（接続詞）", note: "once を「一度」と取った。暗唱で「Once I get / receive the details」と言い、have に直された。when より「～したらすぐ／～さえすれば」の感じが強い（講師）", tag: "IT Support", priority: 1 },
  { id: "C1-12", type: "trans", prompt: "準備ができたらお知らせします。", answer: "I'll let you know when it's ready.", lesson: "C1", hint: "let＋人＋know", note: "リピートで「I had a journal」「Original」と聞こえた", tag: "IT Support", priority: 1 },
  { id: "C1-13", type: "trans", prompt: "彼は再起動と、ソフトウェアのアップデートの確認を試しました。", answer: "He has tried rebooting it and checking for software updates.", lesson: "C1", hint: "check for ～", note: "質問 What two things has the man already tried? への答え。「checking software updates」と for が抜け、講師に直された", tag: "IT Support", priority: 1 },
  { id: "C1-14", type: "trans", prompt: "代わりのものは2日以内に届きます。", answer: "He will get the replacement within two days.", lesson: "C1", hint: "in / within two days", note: "質問 How long …? に「It will take replacement for two days」と言った。get the replacement in (within) two days と直された。It will take about two days. でも可", tag: "IT Support", priority: 1 },
  { id: "C1-15", type: "trans", prompt: "私は外食のほうが好きです。料理が得意ではないからです。", answer: "I prefer eating out because I'm not good at cooking.", lesson: "C1", hint: "prefer ～ing / be good at", note: "「I prefer eating outside」と言った。eating outside は「屋外で食べる」。質問は eating out（講師の訂正ではなく補足）", tag: "Part F Opinion", priority: 1 },
  { id: "C1-16", type: "trans", prompt: "家で料理をすると、とても時間がかかります。", answer: "If I cook at home, it takes a lot of time.", lesson: "C1", hint: "it takes＋時間", note: "「If I'm cooking at home, it will take… too much… a lot of time」と言い直しが多かった。一般的な話なので現在形で言い切る", tag: "Part F Opinion", priority: 1 },
  { id: "C1-17", type: "trans", prompt: "そうすると、家でくつろぐ時間がありません。", answer: "Then I don't have time to relax at home.", lesson: "C1", hint: "have time to ～", note: "「I don't have much time」「I can't relax at home」と2文で言えた。講師の誘導（時間がなくなるとどうなる？）で出た内容", tag: "Part F Opinion", priority: 1 },
  { id: "C1-18", type: "trans", prompt: "だから私は外食のほうが好きです。", answer: "That's why I prefer eating out.", lesson: "C1", hint: "That's why", note: "締めの定番。So はカジュアルすぎて締まらない（講師）", tag: "Part F Opinion", priority: 1 },
  { id: "C1-19", type: "trans", prompt: "私はいつも急いでいます。", answer: "I'm always in a rush.", lesson: "C1", hint: "in a rush", note: "正しく言えていた（1回目の2つ目の理由）", tag: "Part F Opinion", priority: 3 },
  { id: "C1-20", type: "trans", prompt: "急いで食べなければなりません。", answer: "I have to eat quickly.", lesson: "C1", hint: "quickly", note: "「I had to eat speedily」と言って止まった。過去形にしない。speedily より quickly が自然（講師の訂正ではなく補足）", tag: "Part F Opinion", priority: 2 },
  { id: "C1-21", type: "trans", prompt: "第一に、料理をする必要がありません。第二に、皿を洗う必要もありません。", answer: "First, I don't have to cook. Second, I don't have to wash the dishes.", lesson: "C1", hint: "First, ～. Second, ～.", note: "理由を2つ言うときは First / Second が一般的（講師）。文は講師の日本語例から作った補足文", tag: "Part F Opinion", priority: 1 },
  { id: "C1-22", type: "trans", prompt: "外食は時間の節約になります。", answer: "Eating out saves me time.", lesson: "C1", hint: "無生物主語＋save", note: "講師の提案 save time を使った文。主語を I 以外にするとスマートにつながる", tag: "Why Game", priority: 1 },
  { id: "C1-23", type: "trans", prompt: "そのおかげで、家でくつろぐことができます。", answer: "It allows me to relax at home.", lesson: "C1", hint: "allow＋人＋to do", note: "講師の日本語説明から作った補足文。allow / enable / make / lead to / cause の5つを使えるようにする", tag: "Why Game", priority: 1 },
  { id: "C1-24", type: "trans", prompt: "家で食べるほうが安く済みます。", answer: "Eating at home is cheaper.", lesson: "C1", hint: "比較級", note: "講師の例（家で食べる派）。日本語例から作った補足文", tag: "Why Game", priority: 2 },
  { id: "C1-25", type: "trans", prompt: "そのおかげで、お金を貯めてほかのものをたくさん買えます。", answer: "It enables me to save money and buy many other things.", lesson: "C1", hint: "enable＋人＋to do", note: "講師の例（安い→お金が貯まる→ほかの物が買える→生活が豊かに）から作った補足文", tag: "Why Game", priority: 2 },
  { id: "C1-26", type: "trans", prompt: "家で食べると、家族と過ごす時間が増えます。", answer: "Eating at home gives me more time with my family.", lesson: "C1", hint: "give＋人＋more time", note: "講師の例（家族の時間→仲が良くなる→みんな幸せ）から作った補足文", tag: "Why Game", priority: 2 },
  { id: "C1-27", type: "trans", prompt: "それはみんなを幸せにします。", answer: "It makes everyone happy.", lesson: "C1", hint: "make＋人＋形容詞", note: "「Eating out makes me…」で止まった。make の後は 人＋形容詞", tag: "Why Game", priority: 1 },
  { id: "C1-28", type: "trans", prompt: "家で料理をすると、疲れてしまいます。（cause を使って）", answer: "Cooking at home causes me to feel tired.", lesson: "C1", hint: "cause＋人＋to do", note: "悪い影響には cause を使う（講師）。日本語説明から作った補足文", tag: "Why Game", priority: 2 },
  { id: "C1-29", type: "trans", prompt: "一方で、家で料理をすると時間がたくさんかかります。", answer: "On the other hand, cooking at home takes a lot of time.", lesson: "C1", hint: "On the other hand", note: "反対側の意見（counterargument）に触れると説得力が増す。「On other side of the…」と言いかけた。However / While も可", tag: "Part F Opinion", priority: 2 },
  { id: "C1-30", type: "trans", prompt: "「（悪い状態が）しつこく続く」を英語で言うと？", answer: "persist", lesson: "C1", note: "continue でも通じるが、persist は嫌なことがずるずる続く感じ（講師）", tag: "Vocabulary", priority: 1 },
  { id: "C1-31", type: "trans", prompt: "「注文を処理する」を英語で言うと？", answer: "process orders", lesson: "C1", note: "会社で受けた注文を処理すること。セットで覚える", tag: "Vocabulary", priority: 1 },
  { id: "C1-32", type: "trans", prompt: "「交換品・代わりのもの」を英語で言うと？", answer: "a replacement", lesson: "C1", hint: "replace＋ment", tag: "Vocabulary", priority: 1 },
  { id: "C1-33", type: "trans", prompt: "「再起動する」を英語で言うと？", answer: "reboot", lesson: "C1", hint: "re＋boot", note: "リスニングで聞き取れなかった語。restart でも可", tag: "Vocabulary", priority: 2 },
  { id: "C1-34", type: "trans", prompt: "「効率的に」を英語で言うと？", answer: "efficiently", lesson: "C1", note: "effectively（効果的に）と混同した", tag: "Vocabulary", priority: 1 },
  { id: "C1-35", type: "trans", prompt: "「避難させる」を英語で言うと？", answer: "evacuate", lesson: "C1", note: "単語テストで意味が出なかった", tag: "Vocabulary", priority: 1 },
  { id: "C1-36", type: "trans", prompt: "「棚・ラック」を英語で言うと？（r で始まる）", answer: "rack", lesson: "C1", note: "単語テストで lack（不足）と答え、luck（幸運）とも迷った", tag: "Vocabulary", priority: 1 },
  { id: "C1-37", type: "trans", prompt: "「文書・書類（一式）」を英語で言うと？", answer: "documentation", lesson: "C1", note: "単語テストで「添付物」と答えて不正解。書類で OK", tag: "Vocabulary", priority: 2 },
  { id: "C1-38", type: "trans", prompt: "「そういうわけで」を英語で言うと？（意見の締め・3通り）", answer: "That's why / Therefore / In conclusion", lesson: "C1", hint: "言いやすいのは That's why", note: "Therefore と In conclusion は硬め。So はカジュアル", tag: "Vocabulary", priority: 1 },
  { id: "C1-39", type: "trans", prompt: "「反対意見・反論」を英語で言うと？", answer: "counterargument", lesson: "C1", hint: "counter＋argument", tag: "Vocabulary", priority: 3 },
  // Lesson C1: 穴埋め
  { id: "C1-40", type: "blank", prompt: "I need help ___ my computer.", answer: "with", lesson: "C1", note: "for ではない", tag: "IT Support", priority: 1 },
  { id: "C1-41", type: "blank", prompt: "It keeps ___. (freeze)", answer: "freezing", lesson: "C1", hint: "keep ～ing", tag: "IT Support", priority: 2 },
  { id: "C1-42", type: "blank", prompt: "It's affecting my ___ to process orders efficiently.", answer: "ability", lesson: "C1", hint: "能力", tag: "IT Support", priority: 1 },
  { id: "C1-43", type: "blank", prompt: "It's affecting my ability to ___ orders efficiently.", answer: "process", lesson: "C1", hint: "処理する", tag: "IT Support", priority: 1 },
  { id: "C1-44", type: "blank", prompt: "Is it possible to ___ a replacement? (手配する)", answer: "arrange", lesson: "C1", tag: "IT Support", priority: 2 },
  { id: "C1-45", type: "blank", prompt: "Have you ___ rebooting it?", answer: "tried", lesson: "C1", hint: "try ～ing", note: "tried が抜けた", tag: "IT Support", priority: 1 },
  { id: "C1-46", type: "blank", prompt: "Have you tried rebooting it or ___ for software updates? (check)", answer: "checking", lesson: "C1", hint: "or の前後は同じ形", tag: "IT Support", priority: 1 },
  { id: "C1-47", type: "blank", prompt: "I've tried both, but the problem has ___.", answer: "persisted", lesson: "C1", tag: "IT Support", priority: 1 },
  { id: "C1-48", type: "blank", prompt: "I'll speak with the IT ___ to send a replacement to you.", answer: "department", lesson: "C1", hint: "部門", note: "development ではない", tag: "IT Support", priority: 2 },
  { id: "C1-49", type: "blank", prompt: "I'll email those to you ___ ___ this call. (すぐ後に)", answer: "right after", lesson: "C1", note: "after right ではない", tag: "IT Support", priority: 1 },
  { id: "C1-50", type: "blank", prompt: "How long do you think ___ ___ take to get the replacement?", answer: "it will", lesson: "C1", tag: "IT Support", priority: 1 },
  { id: "C1-51", type: "blank", prompt: "___ I have the details, it should take about two days. (いったん～したら)", answer: "Once", lesson: "C1", tag: "IT Support", priority: 1 },
  { id: "C1-52", type: "blank", prompt: "Once I ___ the details, it should take about two days.", answer: "have", lesson: "C1", note: "get / receive と言った", tag: "IT Support", priority: 2 },
  { id: "C1-53", type: "blank", prompt: "I'll ___ you know when it's ready.", answer: "let", lesson: "C1", tag: "IT Support", priority: 2 },
  { id: "C1-54", type: "blank", prompt: "He will get the replacement ___ two days. (2日以内に)", answer: "within", lesson: "C1", hint: "in も可", note: "for ではない", tag: "IT Support", priority: 1 },
  { id: "C1-55", type: "blank", prompt: "I'm not good ___ cooking.", answer: "at", lesson: "C1", tag: "Part F Opinion", priority: 2 },
  { id: "C1-56", type: "blank", prompt: "___ ___ I prefer eating out. (だから)", answer: "That's why", lesson: "C1", tag: "Part F Opinion", priority: 1 },
  { id: "C1-57", type: "blank", prompt: "Eating out ___ me time. (節約する)", answer: "saves", lesson: "C1", tag: "Why Game", priority: 1 },
  { id: "C1-58", type: "blank", prompt: "It ___ me to relax at home. (可能にする)", answer: "allows", lesson: "C1", hint: "enables も可", tag: "Why Game", priority: 1 },
  { id: "C1-59", type: "blank", prompt: "It ___ everyone happy.", answer: "makes", lesson: "C1", tag: "Why Game", priority: 1 },
  // Lesson C1: 誤文訂正
  { id: "C1-60", type: "correct", prompt: "I need for help my computer.", answer: "I need help with my computer.", lesson: "C1", hint: "need help with", tag: "IT Support", priority: 1 },
  { id: "C1-61", type: "correct", prompt: "It's sorry to hear that.", answer: "I'm sorry to hear that.", lesson: "C1", hint: "主語", tag: "IT Support", priority: 2 },
  { id: "C1-62", type: "correct", prompt: "Have you rebooting it or check for software updates?", answer: "Have you tried rebooting it or checking for software updates?", lesson: "C1", hint: "tried / -ing をそろえる", note: "講師に直された文", tag: "IT Support", priority: 1 },
  { id: "C1-63", type: "correct", prompt: "He tried rebooting it and checking software updates.", answer: "He tried rebooting it and checking for software updates.", lesson: "C1", hint: "check for", note: "講師に直された文", tag: "IT Support", priority: 1 },
  { id: "C1-64", type: "correct", prompt: "I'll email those to you after right this call.", answer: "I'll email those to you right after this call.", lesson: "C1", hint: "語順", note: "講師に「逆」と指摘された", tag: "IT Support", priority: 1 },
  { id: "C1-65", type: "correct", prompt: "Once I get the details, it should take about two days. (本文どおりに)", answer: "Once I have the details, it should take about two days.", lesson: "C1", hint: "have", note: "意味は通じるが本文は have（講師「ここ get じゃないです」）", tag: "IT Support", priority: 2 },
  { id: "C1-66", type: "correct", prompt: "It will take replacement for two days.", answer: "He will get the replacement in two days.", lesson: "C1", hint: "get ～ in / within", note: "講師に直された文", tag: "IT Support", priority: 1 },
  { id: "C1-67", type: "correct", prompt: "It's affecting my ability to process orders effectively. (本文どおりに)", answer: "It's affecting my ability to process orders efficiently.", lesson: "C1", hint: "効率的に", tag: "IT Support", priority: 2 },
  { id: "C1-68", type: "correct", prompt: "I prefer eating outside. (外食の意味で)", answer: "I prefer eating out.", lesson: "C1", hint: "eat out＝外食する", note: "講師の訂正ではなく補足", tag: "Part F Opinion", priority: 1 },
  { id: "C1-69", type: "correct", prompt: "I had to eat speedily. (いつもの習慣)", answer: "I have to eat quickly.", lesson: "C1", hint: "現在形 / quickly", note: "講師の訂正ではなく補足", tag: "Part F Opinion", priority: 2 },
  { id: "C1-70", type: "correct", prompt: "If I'm cooking at home, it will take too much a lot of time.", answer: "If I cook at home, it takes a lot of time.", lesson: "C1", hint: "現在形で言い切る", note: "言い直しをせず1回で", tag: "Part F Opinion", priority: 1 },
  // Lesson C1: カタカナ発音
  { id: "C1-71", type: "kana", prompt: "replacement", answer: "リ[プレ]イスメント", lesson: "C1", hint: "re-PLACE-ment", note: "「Elizabeth」「new president」「depressant」と聞こえた。r で始め、pl をはっきり", tag: "IT Support", priority: 1 },
  { id: "C1-72", type: "kana", prompt: "rebooting it", answer: "リ[ブ]ーティング イット", lesson: "C1", hint: "re-BOOT-ing", note: "「beaver tuning」「debuting」「recording」と聞こえた。r で始め、b をはっきり", tag: "IT Support", priority: 1 },
  { id: "C1-73", type: "kana", prompt: "efficiently", answer: "イ[フィ]シェントリー", lesson: "C1", hint: "e-FI-cient-ly", note: "「FS entry」「if it's entry」と聞こえた。fi にアクセント、語尾は -ly", tag: "IT Support", priority: 1 },
  { id: "C1-74", type: "kana", prompt: "It keeps freezing", answer: "イット [キ]ープス [フリ]ーズィング", lesson: "C1", hint: "fr-", note: "「ringing」「freebie」と聞こえた。語頭の f を落とさない", tag: "IT Support", priority: 1 },
  { id: "C1-75", type: "kana", prompt: "I'll let you know", answer: "アイル [レ]ット ユー [ノ]ウ", lesson: "C1", hint: "let は l", note: "「I had a journal」「Original」と聞こえた。I'll と let をはっきり", tag: "IT Support", priority: 1 },
  { id: "C1-76", type: "kana", prompt: "or checking for", answer: "オア [チェ]キング フォー", lesson: "C1", hint: "CHECK-ing", note: "「Watching King」と聞こえた。or を弱く、che は短いエ", tag: "IT Support", priority: 2 },
  { id: "C1-77", type: "kana", prompt: "the model details", answer: "ザ [モ]ドル [ディ]ーテイルズ", lesson: "C1", hint: "DEE-tails", note: "「the model it is」と聞こえた。語頭の d を落とさない", tag: "IT Support", priority: 2 },
  { id: "C1-78", type: "kana", prompt: "process orders", answer: "[プラ]セス [オ]ーダーズ", lesson: "C1", hint: "PRO-cess", note: "「process all the」と聞こえた。orders の語尾 z まで言う", tag: "IT Support", priority: 1 },
  { id: "C1-79", type: "kana", prompt: "department", answer: "ディ[パ]ートメント", lesson: "C1", hint: "de-PART-ment", note: "「development」と読んだ", tag: "IT Support", priority: 2 },
  { id: "C1-80", type: "kana", prompt: "persisted", answer: "パー[シ]スティッド", lesson: "C1", hint: "per-SIST-ed", note: "「Passed it」「assisted」と聞こえた", tag: "IT Support", priority: 2 },
  // Lesson T1: 文の変形
  { id: "T1-01", type: "transform", prompt: "He plays baseball every Sunday. ⇒ yesterday", answer: "He played baseball yesterday.", lesson: "T1", hint: "過去形に", note: "every Sunday → yesterday で時制が変わる", tag: "時制", priority: 1 },
  { id: "T1-02", type: "transform", prompt: "He played baseball yesterday. ⇒ watch", answer: "He watched baseball yesterday.", lesson: "T1", hint: "動詞を置き換え", note: "play → watch。時制はそのまま", tag: "動詞", priority: 1 },
  { id: "T1-03", type: "transform", prompt: "He watched baseball yesterday. ⇒ will + tomorrow", answer: "He will watch baseball tomorrow.", lesson: "T1", hint: "未来形に", note: "will＋動詞の原形", tag: "未来", priority: 1 },
  { id: "T1-04", type: "transform", prompt: "He will watch baseball tomorrow. ⇒ tonight（予定）", answer: "He is going to watch baseball tonight.", lesson: "T1", hint: "予定は be going to", note: "tonight の予定 → is going to", tag: "未来", priority: 1 },
  { id: "T1-05", type: "transform", prompt: "He is going to watch baseball tonight. ⇒ last night", answer: "He was going to watch baseball last night.", lesson: "T1", hint: "過去の予定", note: "was going to＝〜するつもりだった", tag: "過去", priority: 1 },
  { id: "T1-06", type: "transform", prompt: "I play baseball every Sunday. ⇒ he", answer: "He plays baseball every Sunday.", lesson: "T1", hint: "三単現", note: "主語が he なので plays", tag: "三単現", priority: 1 },
  { id: "T1-07", type: "transform", prompt: "He doesn't read newspaper every day. ⇒ you + 疑問文", answer: "Do you read newspaper every day?", lesson: "T1", hint: "Do you 〜?", note: "否定文 → you の疑問文。doesn't は消える", tag: "疑問文", priority: 1 },
  { id: "T1-08", type: "transform", prompt: "Do you read newspaper every day? ⇒ I + right now（動作の途中）", answer: "I am reading newspaper right now.", lesson: "T1", hint: "現在進行形", note: "right now → be + -ing", tag: "進行形", priority: 1 },
  { id: "T1-09", type: "transform", prompt: "I am reading newspaper right now. ⇒ play the piano", answer: "I am playing the piano right now.", lesson: "T1", hint: "動詞句を置き換え", note: "時制はそのまま。playing the piano", tag: "動詞", priority: 1 },
  { id: "T1-10", type: "transform", prompt: "I am playing the piano right now. ⇒ a few hours ago（動作の途中）", answer: "I was playing the piano a few hours ago.", lesson: "T1", hint: "過去進行形", note: "a few hours ago の途中の動作 → was + -ing", tag: "進行形", priority: 1 },
  { id: "T1-11", type: "transform", prompt: "He reads newspaper every day. ⇒ 否定文", answer: "He doesn't read newspaper every day.", lesson: "T1", hint: "doesn't + 原形", note: "三単現の否定は doesn't。reads → read に戻る", tag: "否定文", priority: 1 },
  { id: "T1-12", type: "transform", prompt: "John studies Japanese every day. ⇒ 代名詞 + read newspaper", answer: "He reads newspaper every day.", lesson: "T1", hint: "John → he", note: "主語を代名詞に。動詞句も置き換え（reads）", tag: "三単現", priority: 1 },
  { id: "T1-13", type: "transform", prompt: "I study English every day. ⇒ John + Japanese", answer: "John studies Japanese every day.", lesson: "T1", hint: "三単現", note: "主語が John なので studies（y → ies）", tag: "三単現", priority: 1 },
  { id: "T1-14", type: "transform", prompt: "I studied English last night. ⇒ every day", answer: "I study English every day.", lesson: "T1", hint: "現在形に", note: "last night → every day で習慣の現在形に戻る", tag: "時制", priority: 1 },
  { id: "T1-15", type: "transform", prompt: "I'm making pasta now. ⇒ Tom + 否定文", answer: "Tom isn't making pasta now.", lesson: "T1", hint: "isn't + -ing", note: "主語 Tom → is。否定は isn't making", tag: "否定文", priority: 1 },
  { id: "T1-16", type: "transform", prompt: "I make pasta every Sunday. ⇒ now", answer: "I'm making pasta now.", lesson: "T1", hint: "現在進行形", note: "now → be + -ing。習慣の現在形から今の動作に", tag: "進行形", priority: 1 },
  { id: "T1-17", type: "transform", prompt: "I made pasta last night. ⇒ every Sunday", answer: "I make pasta every Sunday.", lesson: "T1", hint: "現在形に", note: "last night → every Sunday で習慣の現在形に戻る", tag: "時制", priority: 1 },
  { id: "T1-18", type: "transform", prompt: "I saw her last night. ⇒ make pasta", answer: "I made pasta last night.", lesson: "T1", hint: "動詞句を置き換え", note: "saw her → made pasta。過去形はそのまま", tag: "動詞", priority: 1 },
  { id: "T1-19", type: "transform", prompt: "I saw Amy last night. ⇒ 代名詞", answer: "I saw her last night.", lesson: "T1", hint: "目的語を代名詞に", note: "Amy → her（目的格）", tag: "代名詞", priority: 1 },
  { id: "T1-20", type: "transform", prompt: "Did you see Amy last night? ⇒ I + 肯定文", answer: "I saw Amy last night.", lesson: "T1", hint: "過去形の肯定文", note: "Did you see → I saw。疑問文から肯定文に戻す", tag: "肯定文", priority: 1 },
  { id: "T1-21", type: "transform", prompt: "Did you see Amy this morning? ⇒ last night", answer: "Did you see Amy last night?", lesson: "T1", hint: "時を置き換え", note: "this morning → last night。疑問文の形はそのまま", tag: "時制", priority: 1 },
  { id: "T1-22", type: "transform", prompt: "She has been to Korea once. ⇒ 疑問文", answer: "Has she ever been to Korea?", lesson: "T1", hint: "Has she ever 〜?", note: "現在完了の疑問文。once は ever に変わる", tag: "疑問文", priority: 1 },
  { id: "T1-23", type: "transform", prompt: "She went to Korea in March. ⇒ 現在完了形 + once", answer: "She has been to Korea once.", lesson: "T1", hint: "has been to", note: "went to → has been to（行ったことがある）", tag: "現在完了", priority: 1 },
  { id: "T1-24", type: "transform", prompt: "The project has already started. ⇒ just", answer: "The project has just started.", lesson: "T1", hint: "already → just", note: "just＝ちょうど〜したところ", tag: "現在完了", priority: 1 },
  { id: "T1-25", type: "transform", prompt: "The project started last week. ⇒ 現在完了形 + already", answer: "The project has already started.", lesson: "T1", hint: "has already + 過去分詞", note: "過去形 → 現在完了。already は has と過去分詞の間", tag: "現在完了", priority: 1 },
  { id: "T1-26", type: "transform", prompt: "I've been studying English since this morning. ⇒ 疑問文 + you", answer: "Have you been studying English since this morning?", lesson: "T1", hint: "Have you been 〜ing?", note: "現在完了進行形の疑問文。Have を前に", tag: "疑問文", priority: 1 },
  { id: "T1-27", type: "transform", prompt: "I'm studying English. ⇒ since this morning", answer: "I've been studying English since this morning.", lesson: "T1", hint: "現在完了進行形", note: "since 〜 がつくと have been + -ing（ずっと〜している）", tag: "現在完了進行形", priority: 1 },
  { id: "T1-28", type: "transform", prompt: "He's lived in New York for seven years. ⇒ 疑問文", answer: "Has he lived in New York for seven years?", lesson: "T1", hint: "Has he 〜?", note: "現在完了の疑問文。He's = He has", tag: "疑問文", priority: 1 },
  { id: "T1-29", type: "transform", prompt: "He has lived in New York since 2015. ⇒ for seven years", answer: "He's lived in New York for seven years.", lesson: "T1", hint: "since → for", note: "since＋起点、for＋期間。短縮形 He's", tag: "現在完了", priority: 1 },
  { id: "T1-30", type: "transform", prompt: "He lives in New York. ⇒ since 2015", answer: "He has lived in New York since 2015.", lesson: "T1", hint: "現在完了に", note: "since 2015 で「2015年からずっと」→ has lived", tag: "現在完了", priority: 1 },
  { id: "T1-31", type: "transform", prompt: "Was he able to buy that car today? ⇒ what", answer: "What was he able to buy today?", lesson: "T1", hint: "疑問詞を先頭に", note: "what が that car の代わりになるので that car は消える", tag: "疑問詞", priority: 1 },
  { id: "T1-32", type: "transform", prompt: "Can he buy that car today? ⇒ 過去形 + be able to", answer: "Was he able to buy that car today?", lesson: "T1", hint: "Was he able to 〜?", note: "can の過去の疑問文は Was he able to", tag: "過去", priority: 1 },
  { id: "T1-33", type: "transform", prompt: "He can buy that car tomorrow. ⇒ 疑問文 + today", answer: "Can he buy that car today?", lesson: "T1", hint: "Can he 〜?", note: "can を前に出す。tomorrow → today", tag: "疑問文", priority: 1 },
  { id: "T1-34", type: "transform", prompt: "He is going to buy that book tomorrow. ⇒ can + that car", answer: "He can buy that car tomorrow.", lesson: "T1", hint: "can + 原形", note: "is going to → can。that book → that car", tag: "助動詞", priority: 1 },
  { id: "T1-35", type: "transform", prompt: "He will buy that book today. ⇒ tomorrow（予定）", answer: "He is going to buy that book tomorrow.", lesson: "T1", hint: "be going to", note: "予定は be going to。today → tomorrow", tag: "未来", priority: 1 },
  { id: "T1-36", type: "transform", prompt: "He bought that book last week. ⇒ will + today", answer: "He will buy that book today.", lesson: "T1", hint: "will + 原形", note: "bought → will buy。last week → today", tag: "未来", priority: 1 },
  { id: "T1-37", type: "transform", prompt: "I read that book last week. ⇒ he + buy", answer: "He bought that book last week.", lesson: "T1", hint: "buy の過去形", note: "主語 he、read → bought（不規則）", tag: "過去", priority: 1 },
  { id: "T1-38", type: "transform", prompt: "Is she able to swim well? ⇒ 過去形 + when she was a child", answer: "Was she able to swim well when she was a child?", lesson: "T1", hint: "Was she able to 〜?", note: "is → was。文末に when she was a child", tag: "過去", priority: 1 },
  { id: "T1-39", type: "transform", prompt: "Can she swim well? ⇒ be able to", answer: "Is she able to swim well?", lesson: "T1", hint: "Is she able to 〜?", note: "can → be able to。疑問文なので Is を前に", tag: "助動詞", priority: 1 },
  { id: "T1-40", type: "transform", prompt: "She can speak English well. ⇒ 疑問文 + swim", answer: "Can she swim well?", lesson: "T1", hint: "Can she 〜?", note: "can を前に出す。speak English → swim", tag: "疑問文", priority: 1 },
  { id: "T1-41", type: "transform", prompt: "Mary speaks English well. ⇒ 代名詞 + can", answer: "She can speak English well.", lesson: "T1", hint: "can + 原形", note: "Mary → She。can の後は原形 speak", tag: "助動詞", priority: 1 },
  { id: "T1-42", type: "transform", prompt: "Mary sings every day. ⇒ speak English well", answer: "Mary speaks English well.", lesson: "T1", hint: "動詞句を置き換え", note: "三単現 speaks", tag: "動詞", priority: 1 },
  { id: "T1-43", type: "transform", prompt: "Mary sang last night. ⇒ every day", answer: "Mary sings every day.", lesson: "T1", hint: "現在形に", note: "every day で習慣 → sings", tag: "時制", priority: 1 },
  { id: "T1-44", type: "transform", prompt: "Mary was singing then. ⇒ last night（過去の出来事）", answer: "Mary sang last night.", lesson: "T1", hint: "過去形に", note: "過去進行形 → 過去形 sang", tag: "過去", priority: 1 },
  { id: "T1-45", type: "transform", prompt: "Mary is singing. ⇒ 過去形 + then", answer: "Mary was singing then.", lesson: "T1", hint: "過去進行形", note: "is → was。文末に then", tag: "進行形", priority: 1 },
  { id: "T1-46", type: "transform", prompt: "Cindy can cook dinner today. ⇒ 否定文 + tonight", answer: "Cindy can't cook dinner tonight.", lesson: "T1", hint: "can't", note: "can の否定は can't。today → tonight", tag: "否定文", priority: 1 },
  { id: "T1-47", type: "transform", prompt: "We can send the letter today. ⇒ Cindy + cook dinner", answer: "Cindy can cook dinner today.", lesson: "T1", hint: "主語と動詞句を置き換え", note: "can の後は原形 cook", tag: "助動詞", priority: 1 },
  { id: "T1-48", type: "transform", prompt: "We could send the letter yesterday. ⇒ can + today", answer: "We can send the letter today.", lesson: "T1", hint: "現在形に", note: "could → can。yesterday → today", tag: "助動詞", priority: 1 },
  { id: "T1-49", type: "transform", prompt: "We sent the documents yesterday. ⇒ could + the letter", answer: "We could send the letter yesterday.", lesson: "T1", hint: "could + 原形", note: "sent → could send。the documents → the letter", tag: "助動詞", priority: 1 },
  { id: "T1-50", type: "transform", prompt: "Did we send the documents yesterday? ⇒ 肯定文", answer: "We sent the documents yesterday.", lesson: "T1", hint: "過去形の肯定文", note: "Did 〜 send → sent", tag: "肯定文", priority: 1 },
  { id: "T1-51", type: "transform", prompt: "Did he send the documents? ⇒ we + yesterday", answer: "Did we send the documents yesterday?", lesson: "T1", hint: "主語と時を追加", note: "he → we。文末に yesterday", tag: "疑問文", priority: 1 },
  { id: "T1-52", type: "transform", prompt: "Was he able to read a book in French? ⇒ 否定文", answer: "He wasn't able to read a book in French.", lesson: "T1", hint: "wasn't able to", note: "疑問文 → 否定文。He wasn't", tag: "否定文", priority: 1 },
  { id: "T1-53", type: "transform", prompt: "Sam was able to read a book in French. ⇒ 代名詞 + 疑問文", answer: "Was he able to read a book in French?", lesson: "T1", hint: "Was he able to 〜?", note: "Sam → he。was を前に出す", tag: "疑問文", priority: 1 },
  { id: "T1-54", type: "transform", prompt: "She was able to speak German. ⇒ Sam + read a book in French", answer: "Sam was able to read a book in French.", lesson: "T1", hint: "主語と動詞句を置き換え", note: "was able to はそのまま", tag: "動詞", priority: 1 },
  { id: "T1-55", type: "transform", prompt: "She could speak German. ⇒ be able to", answer: "She was able to speak German.", lesson: "T1", hint: "was able to", note: "could → was able to（過去）", tag: "助動詞", priority: 1 },
  { id: "T1-56", type: "transform", prompt: "She can speak German. ⇒ 過去形", answer: "She could speak German.", lesson: "T1", hint: "can の過去", note: "can → could", tag: "過去", priority: 1 },
  { id: "T1-57", type: "transform", prompt: "She speaks German. ⇒ can", answer: "She can speak German.", lesson: "T1", hint: "can + 原形", note: "speaks → can speak（三単現の s は消える）", tag: "助動詞", priority: 1 },
  { id: "T1-58", type: "transform", prompt: "I speak German. ⇒ she", answer: "She speaks German.", lesson: "T1", hint: "三単現", note: "主語が she なので speaks", tag: "三単現", priority: 1 },
  { id: "T1-59", type: "transform", prompt: "The dish was bad. ⇒ 最上級 + of the three", answer: "The dish was the worst of the three.", lesson: "T1", hint: "bad → the worst", note: "bad の最上級は worst（不規則）", tag: "最上級", priority: 1 },
  { id: "T1-60", type: "transform", prompt: "The movie was good. ⇒ 最上級 + of this year", answer: "The movie was the best of this year.", lesson: "T1", hint: "good → the best", note: "good の最上級は best（不規則）", tag: "最上級", priority: 1 },
  { id: "T1-61", type: "transform", prompt: "The pen was more expensive than I thought. ⇒ as mine", answer: "The pen was as expensive as mine.", lesson: "T1", hint: "as 〜 as", note: "比較級 → as expensive as（同じくらい）", tag: "比較", priority: 1 },
  { id: "T1-62", type: "transform", prompt: "The pen was expensive. ⇒ than I thought", answer: "The pen was more expensive than I thought.", lesson: "T1", hint: "more 〜 than", note: "expensive は長い語なので more expensive", tag: "比較級", priority: 1 },
  { id: "T1-63", type: "transform", prompt: "We are as busy as them. ⇒ 比較級", answer: "We are busier than them.", lesson: "T1", hint: "busier than", note: "as 〜 as → 比較級。busy → busier（y → ier）", tag: "比較級", priority: 1 },
  { id: "T1-64", type: "transform", prompt: "We are busy. They are busy. ⇒ as busy", answer: "We are as busy as them.", lesson: "T1", hint: "as 〜 as", note: "2文を as busy as で1文に。them（目的格）", tag: "比較", priority: 1 },
  { id: "T1-65", type: "transform", prompt: "My son bakes cupcakes. ⇒ I want で始める", answer: "I want my son to bake cupcakes.", lesson: "T1", hint: "want + 人 + to 〜", note: "bakes → to bake（原形）", tag: "不定詞", priority: 1 },
  { id: "T1-66", type: "transform", prompt: "My bag was stolen. ⇒ I got で始める", answer: "I got my bag stolen.", lesson: "T1", hint: "get + 物 + 過去分詞", note: "受け身 → I got 〜 stolen（〜された）", tag: "使役", priority: 1 },
  { id: "T1-67", type: "transform", prompt: "They didn't show me anything yesterday. ⇒ 疑問文 + you", answer: "Did they show you anything yesterday?", lesson: "T1", hint: "Did they 〜?", note: "否定文 → 疑問文。me → you", tag: "疑問文", priority: 1 },
  { id: "T1-68", type: "transform", prompt: "I'm happy. ⇒ The news made で始める", answer: "The news made me happy.", lesson: "T1", hint: "make + 人 + 形容詞", note: "I → me（目的格）。made me happy", tag: "使役", priority: 1 },
  { id: "T1-69", type: "transform", prompt: "They didn't tell me anything. ⇒ show + yesterday", answer: "They didn't show me anything yesterday.", lesson: "T1", hint: "動詞を置き換え", note: "tell → show。文末に yesterday", tag: "動詞", priority: 1 },
  { id: "T1-70", type: "transform", prompt: "They told me everything. ⇒ 否定文 + anything", answer: "They didn't tell me anything.", lesson: "T1", hint: "didn't + 原形", note: "told → didn't tell。everything → anything", tag: "否定文", priority: 1 },
  { id: "T1-71", type: "transform", prompt: "I lent her my bike. ⇒ will + laptop", answer: "I will lend her my laptop.", lesson: "T1", hint: "will + 原形", note: "lent → will lend。bike → laptop", tag: "未来", priority: 1 },
  { id: "T1-72", type: "transform", prompt: "I will lend her my laptop. ⇒ 否定文", answer: "I won't lend her my laptop.", lesson: "T1", hint: "won't", note: "will not = won't", tag: "否定文", priority: 1 },
  { id: "T1-73", type: "transform", prompt: "He was very hungry. He bought three hamburgers. ⇒ Being で始める（分詞構文）", answer: "Being very hungry, he bought three hamburgers.", lesson: "T1", hint: "分詞構文", note: "He was → Being。理由を表す分詞構文", tag: "分詞構文", priority: 1 },
  { id: "T1-74", type: "transform", prompt: "She felt tired. She went to bed early. ⇒ Feeling で始める（分詞構文）", answer: "Feeling tired, she went to bed early.", lesson: "T1", hint: "分詞構文", note: "She felt → Feeling。理由を表す分詞構文", tag: "分詞構文", priority: 1 },
  { id: "T1-75", type: "transform", prompt: "When the house is seen from the outside, it looks nice. ⇒ Seen で始める（分詞構文）", answer: "Seen from the outside, the house looks nice.", lesson: "T1", hint: "過去分詞の分詞構文", note: "過去分詞は「受身・完了」。When the house is seen → Seen", tag: "分詞構文", priority: 1 },
  // Lesson V1: 和文英訳
  { id: "V1-01", type: "trans", prompt: "普段、何時に帰宅しますか？", answer: "What time do you usually get home?", lesson: "V1", hint: "do you / get home", note: "「What time usually get a home?」と言った。do と you が抜けた。home は副詞なので a は不要", tag: "Part B Repeat", priority: 1 },
  { id: "V1-02", type: "trans", prompt: "姉は小さな洋服店で働いています。", answer: "My sister works at a small clothing store.", lesson: "V1", hint: "work at / clothing store", note: "「My sister works and closes the store」と言った。clothing を closes と聞き違えた", tag: "Part B Repeat", priority: 1 },
  { id: "V1-03", type: "trans", prompt: "散歩に行きたかったのですが、雨が降っていました。", answer: "I wanted to go for a walk, but it was raining.", lesson: "V1", hint: "[I wanted to] [go for a walk], [but it was raining]", note: "「I want to… for work」と言った。go が落ち、walk を work と混同。チャンクで区切って覚える", tag: "Part B Repeat", priority: 1 },
  { id: "V1-04", type: "trans", prompt: "ベンとマイクは一緒に昼食をとりました。", answer: "Ben and Mike had lunch together.", lesson: "V1", hint: "過去形 had / ate", note: "「Ben and Mike, um… eating lunch」と言った。be動詞のない -ing だけでは文にならない", tag: "Part E Retell", priority: 1 },
  { id: "V1-05", type: "trans", prompt: "彼は電車が遅れたので遅刻しました。", answer: "He was late because his train was delayed.", lesson: "V1", hint: "be late / be delayed", note: "あらすじ（約束→電車遅延で遅刻→合流して食事）から作った補足文。講師の文ではない。誰が・どうした・なぜなら、の骨組みで言う", tag: "Part E Retell", priority: 2 },
  { id: "V1-06", type: "trans", prompt: "二人はレストランで会って、楽しく食事をしました。", answer: "They met at the restaurant and enjoyed their meal.", lesson: "V1", hint: "met / enjoyed", note: "あらすじから作った補足文。講師の文ではない。restaurant が「lesser」と聞こえた", tag: "Part E Retell", priority: 2 },
  { id: "V1-07", type: "trans", prompt: "私はオンラインで買い物をするほうが好きです。", answer: "I prefer shopping online.", lesson: "V1", hint: "prefer ～ing", note: "Point。「I like online shopping」は言えていた", tag: "Part F Opinion", priority: 2 },
  { id: "V1-08", type: "trans", prompt: "まず、とても便利です。", answer: "First, it is very convenient.", lesson: "V1", hint: "convenient", note: "Reason。理由に迷ったら convenient / cheap / easy のどれかで即答する", tag: "Part F Opinion", priority: 1 },
  { id: "V1-09", type: "trans", prompt: "時間をかけて、商品を簡単に選べます。", answer: "I can take time and choose products easily.", lesson: "V1", hint: "take time / products", note: "「Because… I need to think about the goods」で止まった。言いたかった内容を中学文法で言い切る形", tag: "Part F Opinion", priority: 1 },
  { id: "V1-10", type: "trans", prompt: "たとえば、いつでもネットで価格を比較できます。", answer: "For example, I can compare prices on the internet anytime.", lesson: "V1", hint: "compare prices", note: "Example。「For example, uh...」で具体例が出ずに時間切れになった", tag: "Part F Opinion", priority: 1 },
  { id: "V1-11", type: "trans", prompt: "だから私はオンラインショッピングが好きです。", answer: "That is why I like online shopping.", lesson: "V1", hint: "That is why", note: "まとめ（PREP の最後の P）", tag: "Part F Opinion", priority: 2 },
  { id: "V1-12", type: "trans", prompt: "便利だからです。／安いからです。", answer: "Because it is convenient. / Because it is cheap.", lesson: "V1", hint: "Because it is ～", note: "次回のアクションプラン。短い文をピリオドで区切って言い切る", tag: "Part F Opinion", priority: 1 },
  { id: "V1-13", type: "trans", prompt: "間違いなくオンラインのほうが好きで、主な理由は2つあります。", answer: "I definitely prefer shopping online for two main reasons.", lesson: "V1", hint: "for two main reasons", note: "高得点版（B2〜C1目標）", tag: "Part F Opinion", priority: 3 },
  { id: "V1-14", type: "trans", prompt: "第一に、購入前にいろいろな商品を比較し、購入者レビューを読む時間が十分に取れます。", answer: "Primarily, it gives me enough time to compare different products and read customer reviews before making a purchase.", lesson: "V1", hint: "it gives me enough time to ～", note: "高得点版", tag: "Part F Opinion", priority: 3 },
  { id: "V1-15", type: "trans", prompt: "さらに、営業時間を気にしなくてよいので、時間を大きく節約できます。", answer: "In addition, I don't have to worry about store hours, which saves a lot of time.", lesson: "V1", hint: "worry about / which saves", note: "高得点版", tag: "Part F Opinion", priority: 3 },
  { id: "V1-16", type: "trans", prompt: "したがって、私にとってオンラインショッピングははるかに効率的な選択です。", answer: "Therefore, online shopping is a far more efficient choice for me.", lesson: "V1", hint: "far more efficient", note: "高得点版", tag: "Part F Opinion", priority: 3 },
  { id: "V1-17", type: "trans", prompt: "歯を磨くのに使う道具は？（英語で答える）", answer: "a toothbrush", lesson: "V1", hint: "tooth＋brush", note: "「Cheese」と答えた。toothpaste（歯磨き粉）でも正解", tag: "Part A/C", priority: 1 },
  { id: "V1-18", type: "trans", prompt: "6個あって2個使いました。残りはいくつ？（英語で答える）", answer: "Four.", lesson: "V1", hint: "6 − 2", note: "「Or two」と答えた", tag: "Part A/C", priority: 1 },
  { id: "V1-19", type: "trans", prompt: "飛行機と自転車、どちらが速い？（英語で答える）", answer: "A plane.", lesson: "V1", hint: "質問文に出た語から選ぶ", note: "「bicycle」と答えた。問題文の細部は再現（速いほうは plane）", tag: "Part A/C", priority: 2 },
  { id: "V1-20", type: "trans", prompt: "「価格を比較する」を英語で言うと？", answer: "compare prices", lesson: "V1", note: "think about より具体的になる", tag: "Vocabulary", priority: 1 },
  { id: "V1-21", type: "trans", prompt: "「時間をかけて選ぶ」を英語で言うと？", answer: "take my time to choose", lesson: "V1", hint: "take one's time", tag: "Vocabulary", priority: 1 },
  { id: "V1-22", type: "trans", prompt: "「商品」を英語で言うと？（買い物の話題で自然な語）", answer: "products / items", lesson: "V1", note: "「the goods」と言った。goods より products や items が自然", tag: "Vocabulary", priority: 1 },
  { id: "V1-23", type: "trans", prompt: "「散歩に行く」を英語で言うと？", answer: "go for a walk", lesson: "V1", note: "for work（仕事へ）と混同した", tag: "Vocabulary", priority: 1 },
  { id: "V1-24", type: "trans", prompt: "「便利な／安い／簡単な」を英語で言うと？", answer: "convenient / cheap / easy", lesson: "V1", hint: "即答用の形容詞3つ", note: "Part F の理由はこの3つに固定して練習する", tag: "Vocabulary", priority: 1 },
  { id: "V1-25", type: "trans", prompt: "「購入する」を英語で言うと？（make を使って）", answer: "make a purchase", lesson: "V1", tag: "Vocabulary", priority: 3 },
  { id: "V1-26", type: "trans", prompt: "「購入者レビュー」を英語で言うと？", answer: "customer reviews", lesson: "V1", tag: "Vocabulary", priority: 3 },
  { id: "V1-27", type: "trans", prompt: "「営業時間」を英語で言うと？", answer: "store hours", lesson: "V1", tag: "Vocabulary", priority: 3 },
  // Lesson V1: 穴埋め
  { id: "V1-28", type: "blank", prompt: "What time ___ ___ usually get home?", answer: "do you", lesson: "V1", hint: "助動詞＋主語", tag: "Part B Repeat", priority: 1 },
  { id: "V1-29", type: "blank", prompt: "My sister works ___ a small clothing store.", answer: "at", lesson: "V1", note: "and ではない", tag: "Part B Repeat", priority: 1 },
  { id: "V1-30", type: "blank", prompt: "I wanted to ___ for a walk, but it was raining.", answer: "go", lesson: "V1", note: "go が落ちた", tag: "Part B Repeat", priority: 1 },
  { id: "V1-31", type: "blank", prompt: "I wanted to go for a ___, but it was raining. (散歩)", answer: "walk", lesson: "V1", note: "work ではない", tag: "Part B Repeat", priority: 1 },
  { id: "V1-32", type: "blank", prompt: "I wanted to go for a walk, ___ it was raining.", answer: "but", lesson: "V1", note: "後半が脱落しやすい", tag: "Part B Repeat", priority: 2 },
  { id: "V1-33", type: "blank", prompt: "Ben and Mike ___ lunch together. (過去)", answer: "had", lesson: "V1", hint: "ate も可", note: "eating だけにしない", tag: "Part E Retell", priority: 1 },
  { id: "V1-34", type: "blank", prompt: "First, it is very ___. (便利)", answer: "convenient", lesson: "V1", tag: "Part F Opinion", priority: 1 },
  { id: "V1-35", type: "blank", prompt: "I can take ___ and choose products easily.", answer: "time", lesson: "V1", tag: "Part F Opinion", priority: 2 },
  { id: "V1-36", type: "blank", prompt: "I can ___ prices on the internet anytime.", answer: "compare", lesson: "V1", tag: "Part F Opinion", priority: 1 },
  { id: "V1-37", type: "blank", prompt: "That is ___ I like online shopping.", answer: "why", lesson: "V1", tag: "Part F Opinion", priority: 2 },
  { id: "V1-38", type: "blank", prompt: "I can read customer reviews before ___ a purchase.", answer: "making", lesson: "V1", hint: "before ～ing", tag: "Part F Opinion", priority: 3 },
  { id: "V1-39", type: "blank", prompt: "I don't have to worry ___ store hours.", answer: "about", lesson: "V1", tag: "Part F Opinion", priority: 3 },
  // Lesson V1: 誤文訂正
  { id: "V1-40", type: "correct", prompt: "What time usually get a home?", answer: "What time do you usually get home?", lesson: "V1", hint: "do you／a 不要", note: "講師フィードバック", tag: "Part B Repeat", priority: 1 },
  { id: "V1-41", type: "correct", prompt: "My sister works and closes the store.", answer: "My sister works at a small clothing store.", lesson: "V1", hint: "at / clothing", note: "講師フィードバック", tag: "Part B Repeat", priority: 1 },
  { id: "V1-42", type: "correct", prompt: "I want to for work.", answer: "I wanted to go for a walk, but it was raining.", lesson: "V1", hint: "過去形／go／walk", note: "講師フィードバック", tag: "Part B Repeat", priority: 1 },
  { id: "V1-43", type: "correct", prompt: "Ben and Mike eating lunch.", answer: "Ben and Mike had lunch together.", lesson: "V1", hint: "過去形にする", note: "講師フィードバック。were eating でも文にはなる", tag: "Part E Retell", priority: 1 },
  { id: "V1-44", type: "correct", prompt: "Because I need to think about the goods.", answer: "I can take my time to choose products.", lesson: "V1", hint: "take my time / products", note: "Because だけで始めて主節につながらなかった。講師提案のコロケーションを使った一例", tag: "Part F Opinion", priority: 1 },
  // Lesson V1: カタカナ発音
  { id: "V1-45", type: "kana", prompt: "go for a walk", answer: "ゴウ フォー ア [ウォ]ーク", lesson: "V1", hint: "walk＝ウォーク（l は発音しない）", note: "work（ワーク）と混同した。walk は口を縦に開けてオー", tag: "Part B Repeat", priority: 1 },
  { id: "V1-46", type: "kana", prompt: "clothing store", answer: "[クロ]ウズィング ストア", lesson: "V1", hint: "CLOTH-ing", note: "closes（クロウズィズ）と聞き違えた", tag: "Part B Repeat", priority: 1 },
  { id: "V1-47", type: "kana", prompt: "shoes", answer: "[シュ]ーズ", lesson: "V1", hint: "語尾は z", note: "「shoot」と発音したと指摘された", tag: "Part A/C", priority: 1 },
  { id: "V1-48", type: "kana", prompt: "restaurant", answer: "[レ]ストラント", lesson: "V1", hint: "r で始める", note: "「lesser」と聞こえた", tag: "Part E Retell", priority: 1 },
  { id: "V1-49", type: "kana", prompt: "convenient", answer: "コン[ヴィ]ーニエント", lesson: "V1", hint: "con-VEE-nient", note: "即答用の最重要語。v をはっきり", tag: "Part F Opinion", priority: 2 },
  { id: "V1-50", type: "kana", prompt: "compare prices", answer: "コン[ペ]ア [プラ]イスィズ", lesson: "V1", hint: "com-PARE", note: "prices は r、語尾 -iz", tag: "Part F Opinion", priority: 2 },
  // Lesson E10: 誤文訂正
  { id: "E10-01", type: "correct", prompt: "Is my video is freezing?", answer: "Is my video freezing?", lesson: "E10", hint: "be動詞は1つだけ", note: "疑問文ではisを前に出すだけ", tag: "あいさつ", priority: 1 },

  { id: "E11-13", type: "correct", prompt: "My feeling is coming back.", answer: "The feeling in my mouth is coming back.", lesson: "E11", hint: "麻酔が切れてきた", note: "my feeling だと「私の気持ち」。感覚は the feeling (in 〜)。numb＝しびれた", tag: "体調・近況", priority: 2 },

  // Lesson PH1: 和文英訳
  { id: "PH1-13", type: "trans", prompt: "私は毎朝、駅まで歩いています。", answer: "I walk to the station every morning.", lesson: "PH1", hint: "walk：大きく口を開ける", note: "al を見たら「ウォー」と口を縦に開ける。L の音は消える", tag: "walk vs work", priority: 1 },
  { id: "PH1-14", type: "trans", prompt: "私は今、新しいプロジェクトに取り組んでいます（働いています）。", answer: "I am working on a new project now.", lesson: "PH1", hint: "work：舌を巻いてこもる音", note: "or を見たら舌先を浮かせて「ワーキング」。working on a は「ワーキンゴナ」とつなげる。ng（ŋ）が on につながり、ゴは鼻に抜く柔らかい音。「ワーキンノン」は ŋ が n になっていてズレ", tag: "walk vs work", priority: 1 },
  { id: "PH1-15", type: "trans", prompt: "私たちは来週の旅行の計画を立てる必要があります。", answer: "We need to make a plan for next week's trip.", lesson: "PH1", hint: "plan：短く「ア」と「エ」の中間", note: "語尾に e がないときは短く「プラン」と切る", tag: "plan vs plane", priority: 1 },

  { id: "PH1-19", type: "trans", prompt: "あなたの意見は完全に正しいと思います。", answer: "I think your idea is completely right.", lesson: "PH1", hint: "right：舌をどこにもつけない", note: "think は舌を軽く歯で挟み、right は舌を奥に引いて発音", tag: "right vs light vs think", priority: 1 },

  // Lesson PH1: カタカナ発音
  { id: "PH1-23", type: "kana", prompt: "working on", answer: "[ワ]ーキンゴン", lesson: "PH1", hint: "ng が on につながる。ゴは鼻濁音で弱く", note: "working の最後は ng（ŋ）。舌先は下げたまま舌の奥を上あごにつけて鼻から出す。その ŋ が on につながり「キン・ゴン」。g を破裂させず弱める。「ワーキンノン」は ŋ が n に変わっていてズレ。くだけた workin' なら「ワーキノン」", tag: "発音", priority: 1 },

  { id: "EC1027-14", type: "trans", prompt: "英語で？：（変化などを）経験する・受ける", answer: "undergo", lesson: "EC1027", hint: "under-", note: "本人申告で忘れかけていた語", tag: "単語", priority: 1 },
  { id: "EC1027-15", type: "trans", prompt: "英語で？：強く勧める・促す", answer: "urge", lesson: "EC1027", hint: "u-で始まる4文字", note: "「駆り立てる」の意味しか覚えていなかった", tag: "単語", priority: 1 },
  { id: "EC1027-16", type: "trans", prompt: "英語で？：約束・献身", answer: "commitment", lesson: "EC1027", note: "本人申告で忘れかけていた語", tag: "単語", priority: 1 },
  { id: "EC1027-17", type: "trans", prompt: "英語で？：それに応じて・適切に", answer: "accordingly", lesson: "EC1027", hint: "= in a suitable manner", note: "設問で迷って保留にした", tag: "単語", priority: 1 },
  { id: "EC1027-18", type: "trans", prompt: "英語で？：適した", answer: "suitable", lesson: "EC1027", hint: "s-で始まる", note: "suitable manner＝適したやり方。manner はここでは「方法」", tag: "単語", priority: 1 },
  { id: "EC1027-19", type: "trans", prompt: "英語で？：かなりの・重大な", answer: "significant", lesson: "EC1027", tag: "単語", priority: 2 },
  { id: "EC1027-20", type: "trans", prompt: "英語で？：不可欠な・とても大事な", answer: "essential", lesson: "EC1027", note: "「本質的な」と訳しがち。ここは「欠かせない」", tag: "単語", priority: 2 },
  { id: "EC1027-21", type: "trans", prompt: "英語で？：頻度・（バスの）本数", answer: "frequency", lesson: "EC1027", tag: "単語", priority: 2 },
