  { id: "L12-02", type: "trans", prompt: "麻酔をしたので、まだ口がしびれています。", answer: "I had a local anesthetic, so my mouth is still numb.", lesson: 12, hint: "local anesthetic / numb", note: "mouse（ネズミ）ではなく mouth。しびれる＝numb", tag: "Household Chores", priority: 1 },
  { id: "L12-03", type: "trans", prompt: "今はレンタルオフィスにいます。", answer: "I'm in a rental office right now.", lesson: 12, hint: "I'm in ～", note: "I'm a rental office だと「私はレンタルオフィスです」になる", tag: "Household Chores", priority: 1 },
  { id: "L12-04", type: "trans", prompt: "このあと、別の英会話レッスンがあります。", answer: "I have another English conversation lesson after this one.", lesson: 12, hint: "English conversation / this one", note: "英会話＝English conversation（company ではない）。lesson の繰り返しは this one に", tag: "Household Chores", priority: 1 },
  { id: "L12-05", type: "trans", prompt: "ナオヤと呼んでください。", answer: "Please call me Naoya.", lesson: 12, hint: "call me ～", note: "I'm called Naoya より Please call me / You can call me が自然", tag: "Household Chores", priority: 2 },
  { id: "L12-06", type: "trans", prompt: "「chores」は家事という意味ですか？", answer: "Does \"chores\" mean housework?", lesson: 12, hint: "housework", note: "house job とは言わない。housework / household tasks", tag: "Household Chores", priority: 2 },
  { id: "L12-07", type: "trans", prompt: "料理は皿洗いより時間がかかる。", answer: "Cooking is more time-consuming than washing dishes.", lesson: 12, hint: "time-consuming", note: "Cooking takes more time than washing dishes. も可", tag: "Household Chores", priority: 1 },
  { id: "L12-08", type: "trans", prompt: "私にとっては、皿洗いのほうが満足感がある。", answer: "For me, washing dishes is more satisfying.", lesson: 12, hint: "satisfying", note: "物事が主語なら satisfying（satisfied は人が主語）", tag: "Household Chores", priority: 2 },
  { id: "L12-09", type: "trans", prompt: "皿洗いをしていると、それに集中できて、ほかのことを全部忘れられる。", answer: "When I'm washing dishes, I can focus on it and forget about everything else.", lesson: 12, hint: "focus on / forget about", note: "When I'm ～ing で「～しているとき」", tag: "Household Chores", priority: 1 },
  { id: "L12-10", type: "trans", prompt: "料理はたくさんのアイデアと計画が必要で、私は料理が得意ではない。", answer: "Cooking needs a lot of ideas and planning, and I'm not good at it.", lesson: 12, hint: "a lot of / be good at", note: "many ideas より a lot of ideas and planning が自然", tag: "Household Chores", priority: 2 },
  { id: "L12-11", type: "trans", prompt: "実は、家ではあまり料理をしません。", answer: "Actually, I don't cook at home very often.", lesson: 12, hint: "don't ～ very often", note: "at home の at を忘れない。I rarely cook at home. も可", tag: "Household Chores", priority: 1 },
  { id: "L12-12", type: "trans", prompt: "料理はほとんどいつも妻がしてくれます。", answer: "My wife does most of the cooking.", lesson: 12, hint: "most of the cooking", note: "My wife cooks for me most of the time. も可。「ほとんど」に almost は使わない", tag: "Household Chores", priority: 1 },
  { id: "L12-13", type: "trans", prompt: "洗濯は掃除より楽だと思います。", answer: "I think doing laundry is easier than cleaning.", lesson: 12, hint: "doing laundry / easier", note: "cleaning が drinking と聞こえていた。more easier にしない", tag: "Household Chores", priority: 1 },
  { id: "L12-14", type: "trans", prompt: "うちの洗濯機は乾燥もしてくれるので、服を入れてボタンを押すだけです。", answer: "My washing machine also dries the clothes, so I only have to put the clothes in and press the button.", lesson: 12, hint: "also dries / only have to", note: "乾燥機能付き＝It also dries the clothes.", tag: "Household Chores", priority: 1 },
  { id: "L12-15", type: "trans", prompt: "洗濯は1日に1～2回します。", answer: "I do the laundry once or twice a day.", lesson: 12, hint: "once or twice", note: "one to two times ではなく once or twice", tag: "Household Chores", priority: 1 },
  { id: "L12-16", type: "trans", prompt: "娘の服はすぐ汚れるので。", answer: "Because my daughter's clothes get dirty quickly.", lesson: 12, hint: "get dirty", note: "汚れる＝get dirty", tag: "Household Chores", priority: 1 },
  { id: "L12-17", type: "trans", prompt: "料理が一番大切だと思います。おいしい食べ物は私を幸せにし、健康に保ってくれるからです。", answer: "I think cooking is the most important, because good food makes me happy and keeps me healthy.", lesson: 12, hint: "the most / makes / keeps", note: "最上級は the most。is make ではなく makes", tag: "Household Chores", priority: 1 },
  // Lesson 12: 穴埋め
  { id: "L12-18", type: "blank", prompt: "Doing laundry is (　　) than cooking.（洗濯は料理より簡単だ）", answer: "easier", lesson: 12, hint: "簡単な→比較級", note: "more easier は二重比較で誤り", tag: "Household Chores", priority: 1 },
  { id: "L12-19", type: "blank", prompt: "Ironing clothes is more (　　) than vacuuming.（アイロンがけは掃除機がけより満足感がある）", answer: "satisfying", lesson: 12, hint: "satisf-", note: "satisfied は人が主語のとき", tag: "Household Chores", priority: 1 },
  { id: "L12-20", type: "blank", prompt: "I don't cook (　　) home very often.", answer: "at", lesson: 12, hint: "前置詞", note: "cook my home は「家を料理する」になってしまう", tag: "Household Chores", priority: 1 },
  { id: "L12-21", type: "blank", prompt: "Cooking (　　) more time than washing dishes.（料理は皿洗いより時間がかかる）", answer: "takes", lesson: 12, hint: "時間がかかる", note: "is more takes は誤り", tag: "Household Chores", priority: 1 },
  { id: "L12-22", type: "blank", prompt: "Sometimes I need to clean the (　　) filter.（ときどき糸くずフィルターを掃除する必要がある）", answer: "lint", lesson: 12, hint: "糸くず", note: "洗濯機の糸くず＝lint", tag: "Household Chores", priority: 2 },
  { id: "L12-23", type: "blank", prompt: "Some chores are more difficult than (　　).（家事には他より難しいものもある）", answer: "others", lesson: 12, hint: "ほかのもの", note: "例文の表現", tag: "Household Chores", priority: 3 },
  // Lesson 12: 誤文訂正
  { id: "L12-24", type: "correct", prompt: "I'm a rental office now.", answer: "I'm in a rental office now.", lesson: 12, hint: "前置詞が抜けている", note: "場所は I'm in / at ～", tag: "Household Chores", priority: 1 },
  { id: "L12-25", type: "correct", prompt: "My mouth isn't move very well.", answer: "My mouth doesn't move very well.", lesson: 12, hint: "be動詞と一般動詞", note: "I can't move my mouth very well. も可", tag: "Household Chores", priority: 1 },
  { id: "L12-26", type: "correct", prompt: "Laundry is more easier than cooking.", answer: "Doing laundry is easier than cooking.", lesson: 12, hint: "比較級の重複", note: "easier はすでに比較級", tag: "Household Chores", priority: 1 },
  { id: "L12-27", type: "correct", prompt: "Cooking is more takes time.", answer: "Cooking is more time-consuming.", lesson: 12, hint: "形容詞を使う", note: "Cooking takes more time. も可", tag: "Household Chores", priority: 1 },
  { id: "L12-28", type: "correct", prompt: "I think cooking is most important because good food is make me happy.", answer: "I think cooking is the most important because good food makes me happy.", lesson: 12, hint: "2か所", note: "the most／makes", tag: "Household Chores", priority: 1 },
  { id: "L12-29", type: "correct", prompt: "I do laundry one to two times a day.", answer: "I do the laundry once or twice a day.", lesson: 12, hint: "回数の言い方", note: "1～2回＝once or twice", tag: "Household Chores", priority: 1 },
  { id: "L12-30", type: "correct", prompt: "Almost my wife cooks for me.", answer: "My wife cooks for me most of the time.", lesson: 12, hint: "「ほとんど」の位置と語", note: "almost は単独で名詞を修飾できない", tag: "Household Chores", priority: 1 },
  // Lesson 12: カタカナ発音
  { id: "L12-31", type: "kana", prompt: "clothes", answer: "クロウズ", lesson: 12, hint: "closes ではない", note: "[kloʊðz]。th を濁らせる。closes（クロウズィズ）と言っていた", tag: "Household Chores", priority: 1 },
  { id: "L12-32", type: "kana", prompt: "clean", answer: "クリーン", lesson: 12, hint: "r ではなく l", note: "cream / Korean と聞こえていた。舌先を上の歯の裏につける", tag: "Household Chores", priority: 1 },
  { id: "L12-33", type: "kana", prompt: "cleaning", answer: "クリーニング", lesson: 12, hint: "cl- の音", note: "drinking / framing と聞こえていた", tag: "Household Chores", priority: 1 },
  { id: "L12-34", type: "kana", prompt: "ironing", answer: "アイアニング", lesson: 12, hint: "r はほぼ読まない", note: "[áɪərnɪŋ]。Halloween と聞こえていた", tag: "Household Chores", priority: 1 },
  { id: "L12-35", type: "kana", prompt: "mouth", answer: "マウス（最後は舌を噛む th）", lesson: 12, hint: "mouse との違い", note: "mouse は s、mouth は th", tag: "Household Chores", priority: 1 },
  { id: "L12-36", type: "kana", prompt: "time-consuming", answer: "タイムコンスーミング", lesson: 12, hint: "sum にアクセント", note: "more than consuming と聞こえていた", tag: "Household Chores", priority: 2 },
  { id: "L12-37", type: "kana", prompt: "enjoyable", answer: "エンジョイアブル", lesson: 12, hint: "joy にアクセント", note: "講師から指摘あり", tag: "Household Chores", priority: 2 },
  { id: "L12-38", type: "kana", prompt: "vacuuming", answer: "ヴァキューミング", lesson: 12, hint: "va にアクセント", note: "vacuum＝ヴァキューム", tag: "Household Chores", priority: 3 },
  // Lesson 13: 和文英訳
  { id: "L13-01", type: "trans", prompt: "スペイン語が少し話せます。", answer: "I can speak a little Spanish.", lesson: 13, hint: "can / a little", note: "can は「実際にやるかは別として、能力・可能性がある」", tag: "Modal Verbs", priority: 2 },
  { id: "L13-02", type: "trans", prompt: "料理の仕方を教えられます。", answer: "I can teach you how to cook.", lesson: 13, hint: "how to ～", tag: "Modal Verbs", priority: 3 },
  { id: "L13-03", type: "trans", prompt: "パーティーに友達を連れてきてもいいですよ。", answer: "You can bring your friends to the party.", lesson: 13, hint: "can=許可 / bring", note: "invite your friend でも意味は通るが、原文は bring。can は許可にも使う", tag: "Modal Verbs", priority: 3 },
  { id: "L13-04", type: "trans", prompt: "あなたの電話を使ってもいいですか？", answer: "Can I use your phone?", lesson: 13, hint: "Can I ～?", note: "phone を home と言い間違えた。phone /foʊn/ と home /hoʊm/ に注意", tag: "Modal Verbs", priority: 2 },
  { id: "L13-05", type: "trans", prompt: "私の父は10か国語を話せました。", answer: "My father could speak 10 languages.", lesson: 13, hint: "could / 過去", note: "could は can の過去（過去の潜在能力）。主語を My phone と取り違えた", tag: "Modal Verbs", priority: 2 },
  { id: "L13-06", type: "trans", prompt: "彼は読み書きができます。", answer: "He is able to read and write.", lesson: 13, hint: "be able to", note: "「He's ready to ～」（準備ができている）と聞き間違え。ready ≠ able", tag: "Modal Verbs", priority: 1 },
  { id: "L13-07", type: "trans", prompt: "一週間以内に配達できます。", answer: "We are able to deliver within a week.", lesson: 13, hint: "within / deliver", note: "「in a week」でなく within a week（～以内）", tag: "Modal Verbs", priority: 2 },
  { id: "L13-08", type: "trans", prompt: "昨夜はよく眠れました。", answer: "I was able to sleep well last night.", lesson: 13, hint: "was able to / sleep", note: "sleep /sliːp/ を slip（すべる）と発音していた。長い「イー」", tag: "Modal Verbs", priority: 1 },
  { id: "L13-09", type: "trans", prompt: "ジョンは目標を達成できました。", answer: "John was able to achieve the goal.", lesson: 13, hint: "過去に実際に成功 → was able to", note: "過去に実際にできた話は could でなく was able to。否定形（Do not able）にしないよう注意", tag: "Modal Verbs", priority: 1 },
  { id: "L13-10", type: "trans", prompt: "その赤ちゃんはもうすぐ歩けるようになります。", answer: "The baby will be able to walk soon.", lesson: 13, hint: "will be able to", note: "will can は不可。未来の「できる」は will be able to", tag: "Modal Verbs", priority: 1 },
  { id: "L13-11", type: "trans", prompt: "英語が話せるようになりたいです。", answer: "I want to be able to speak English.", lesson: 13, hint: "want to be able to", note: "want to can は不可。want to be able to で表す", tag: "Modal Verbs", priority: 2 },
  { id: "L13-12", type: "trans", prompt: "今週末、あなたは部屋を掃除しなければいけません。", answer: "You must clean up your room this weekend.", lesson: 13, hint: "must", note: "must は話し手の主観的な「しなくちゃ」", tag: "Modal Verbs", priority: 2 },
  { id: "L13-13", type: "trans", prompt: "ガス代を払うのを忘れてはいけません。", answer: "I must not forget to pay the gas bill.", lesson: 13, hint: "must not / forget to ～", note: "must not＝禁止", tag: "Modal Verbs", priority: 2 },
  { id: "L13-14", type: "trans", prompt: "新入社員はミーティングに参加した方がいいです。", answer: "The new employees should attend the meeting.", lesson: 13, hint: "should", note: "should は「するべき／した方がいい」。must より弱い", tag: "Modal Verbs", priority: 2 },
  { id: "L13-15", type: "trans", prompt: "このことは誰にも言わない方がいいです。", answer: "You should not tell this to anyone.", lesson: 13, hint: "should not / anyone", tag: "Modal Verbs", priority: 2 },
  { id: "L13-16", type: "trans", prompt: "誰もが車のシートベルトを着用しなければいけません。", answer: "Everybody has to wear a car seatbelt.", lesson: 13, hint: "has to / seatbelt", note: "Everybody は三人称単数なので has to。seatbelt を corset / concealer と発音していた。客観的な必要（ルール）は have to", tag: "Modal Verbs", priority: 1 },
  { id: "L13-17", type: "trans", prompt: "彼女は一生懸命働かなければなりませんでした。", answer: "She had to work hard.", lesson: 13, hint: "had to", note: "have to の過去は had to（must に過去形がないため）", tag: "Modal Verbs", priority: 2 },
  { id: "L13-18", type: "trans", prompt: "このメッセージに返信しなくてもいいです。", answer: "You don't have to reply to this message.", lesson: 13, hint: "don't have to", note: "don't have to＝不必要。must not＝禁止。意味が正反対", tag: "Modal Verbs", priority: 1 },
  { id: "L13-19", type: "trans", prompt: "日曜日は早く起きなくてもいいです。", answer: "I don't have to get up early on Sunday.", lesson: 13, hint: "don't have to / get up", tag: "Modal Verbs", priority: 2 },
  { id: "L13-20", type: "trans", prompt: "約束の時間に遅れてはいけません。", answer: "You must not be late for the appointment.", lesson: 13, hint: "must not / be late", note: "「You don't must wait」と言った。don't + must は不可。禁止は must not、遅れる＝be late（wait ではない）", tag: "Modal Verbs", priority: 1 },
  { id: "L13-21", type: "trans", prompt: "10時までに起きなければいけません。", answer: "I have to get up by 10 o'clock.", lesson: 13, hint: "have to / by", note: "「until」を使っていた。期限（～までに）は by、継続（～までずっと）は until", tag: "Modal Verbs", priority: 1 },
  { id: "L13-22", type: "trans", prompt: "来年の1月にグアムに行く予定です。", answer: "I'm planning to go to Guam in January next year.", lesson: 13, hint: "plan to / in January", note: "「in next year」と言っていた。next year の前に in は付けない", tag: "Modal Verbs", priority: 2 },
  { id: "L13-23", type: "trans", prompt: "娘は初めて海外に行きます。", answer: "My daughter will go abroad for the first time.", lesson: 13, hint: "abroad / for the first time", note: "abroad の前に to は不要。「first time」でなく for the first time。予定は will go", tag: "Modal Verbs", priority: 2 },
  { id: "L13-24", type: "trans", prompt: "娘は私より英語を頻繁に話せます。", answer: "She can speak English more often than I do.", lesson: 13, hint: "more often than ～", note: "「her speak」と目的格を主語に使った。主語は she", tag: "Modal Verbs", priority: 2 },
  { id: "L13-25", type: "trans", prompt: "青い海を見て、イルカやウミガメと泳ぎたいです。", answer: "I want to see the blue ocean and swim with dolphins and turtles.", lesson: 13, hint: "the blue ocean / dolphins / turtles", note: "the が抜けていた。dolphins→drifting、turtles→tadpoles のように聞こえた", tag: "Modal Verbs", priority: 2 },
  { id: "L13-26", type: "trans", prompt: "ハワイには2回行ったことがあります。", answer: "I've been to Hawaii twice.", lesson: 13, hint: "have been to / twice", note: "「I've been to there」は不可。there の前に to は付けない（I've been there）", tag: "Modal Verbs", priority: 1 },
  { id: "L13-27", type: "trans", prompt: "1回目は小学生の時で、あまりよく覚えていません。", answer: "The first time was when I was in elementary school, so I don't remember it very well.", lesson: 13, hint: "The first time was ～", note: "「First time is」と現在形にしていた。過去の話は was。冠詞 The も必要", tag: "Modal Verbs", priority: 2 },
  { id: "L13-28", type: "trans", prompt: "2回目は結婚した時で、約10年前です。", answer: "The second time was when I got married, about 10 years ago.", lesson: 13, hint: "got married / ago", note: "「when I get married」は現在形。過去の出来事なので got married", tag: "Modal Verbs", priority: 1 },
  { id: "L13-29", type: "trans", prompt: "「圧倒的な」を英語で言うと？", answer: "overwhelming", lesson: 13, hint: "over ～", note: "オーバーウェルミング。単語テスト（レベル4）で意味が出なかった", tag: "Vocabulary", priority: 3 },
  { id: "L13-30", type: "trans", prompt: "「(遺産などの)受取人」を英語で言うと？", answer: "beneficiary", lesson: 13, hint: "benefit の仲間", note: "benefit（利益）から「儲かる」と連想したが、意味は受取人", tag: "Vocabulary", priority: 2 },
  { id: "L13-31", type: "trans", prompt: "「貨物船」を英語で言うと？", answer: "freighter", lesson: 13, hint: "freight=貨物", note: "フリーター（freeter）と混同", tag: "Vocabulary", priority: 3 },
  { id: "L13-32", type: "trans", prompt: "「雑多な」を英語で言うと？", answer: "miscellaneous", lesson: 13, note: "まだ未学習", tag: "Vocabulary", priority: 3 },
  { id: "L13-33", type: "trans", prompt: "「送迎バス」を英語で言うと？", answer: "courtesy bus", lesson: 13, hint: "courtesy=好意", note: "「大手水バス」と聞こえていた", tag: "Vocabulary", priority: 3 },
  { id: "L13-34", type: "trans", prompt: "「予告なしで」を英語で言うと？", answer: "without notice", lesson: 13, hint: "with / without", note: "学習済み。「ウィズアウト」の発音に注意", tag: "Vocabulary", priority: 3 },
  // Lesson 13: 穴埋め
  { id: "L13-35", type: "blank", prompt: "My father ___ speak 10 languages when he was young.", answer: "could", lesson: 13, hint: "can の過去", tag: "Modal Verbs", priority: 2 },
  { id: "L13-36", type: "blank", prompt: "John ___ ___ ___ achieve the goal. (過去に実際に達成できた)", answer: "was able to", lesson: 13, hint: "過去の一度きりの成功", note: "could では「達成できた」と言い切れない", tag: "Modal Verbs", priority: 1 },
  { id: "L13-37", type: "blank", prompt: "The baby will ___ ___ ___ walk soon.", answer: "be able to", lesson: 13, hint: "未来の「できる」", note: "will can は不可", tag: "Modal Verbs", priority: 1 },
  { id: "L13-38", type: "blank", prompt: "You ___ ___ ___ reply to this message. (返信しなくてもよい)", answer: "don't have to", lesson: 13, hint: "不必要", note: "must not との意味の違い", tag: "Modal Verbs", priority: 1 },
  { id: "L13-39", type: "blank", prompt: "You ___ ___ be late for the appointment. (遅れてはいけない)", answer: "must not", lesson: 13, hint: "禁止", note: "don't must は不可", tag: "Modal Verbs", priority: 1 },
  { id: "L13-40", type: "blank", prompt: "I have to get up ___ 10 o'clock. (10時までに)", answer: "by", lesson: 13, hint: "期限", note: "until は「ずっと～まで」", tag: "Modal Verbs", priority: 1 },
  { id: "L13-41", type: "blank", prompt: "The new employees ___ attend the meeting. (参加した方がいい)", answer: "should", lesson: 13, tag: "Modal Verbs", priority: 2 },
  { id: "L13-42", type: "blank", prompt: "Everybody ___ ___ wear a car seatbelt.", answer: "has to", lesson: 13, hint: "三人称単数", tag: "Modal Verbs", priority: 2 },
  { id: "L13-43", type: "blank", prompt: "She ___ ___ work hard. (過去)", answer: "had to", lesson: 13, hint: "have to の過去", tag: "Modal Verbs", priority: 2 },
  { id: "L13-44", type: "blank", prompt: "I'm planning to go to Guam ___ January next year.", answer: "in", lesson: 13, note: "next year の前には in を付けない", tag: "Modal Verbs", priority: 2 },
  { id: "L13-45", type: "blank", prompt: "Please contact our department for ___ with cancellations or rescheduling.", answer: "assistance", lesson: 13, hint: "名詞", note: "assistant（助手）と混同。assistance（援助）", tag: "Modal Verbs", priority: 1 },
  { id: "L13-46", type: "blank", prompt: "All business trips to East Asia are currently ___ ___.", answer: "on hold", lesson: 13, hint: "保留", note: "聞き取りでは curatory に聞こえていた", tag: "Modal Verbs", priority: 1 },
  { id: "L13-47", type: "blank", prompt: "We aim to ___ disruptions and assist you in any way we can.", answer: "minimize", lesson: 13, hint: "最小化する", tag: "Modal Verbs", priority: 3 },
  // Lesson 13: 誤文訂正
  { id: "L13-48", type: "correct", prompt: "You don't must wait for the appointment.", answer: "You must not be late for the appointment.", lesson: 13, hint: "禁止＋遅刻", note: "don't + must は不可。「遅れる」は wait でなく be late", tag: "Modal Verbs", priority: 1 },
  { id: "L13-49", type: "correct", prompt: "I have to get up until 10 o'clock.", answer: "I have to get up by 10 o'clock.", lesson: 13, hint: "期限は by", tag: "Modal Verbs", priority: 1 },

  // Lesson 15: 誤文訂正

  // Lesson 15: 和文英訳

  { id: "L15-20", type: "trans", prompt: "レストランに行くときはたいていランチセットを頼みます。", answer: "I usually order a lunch set when I go to a restaurant.", lesson: 15, hint: "usually の位置", note: "a を付ける", tag: "レストラン", priority: 2 },

  { id: "L15-22", type: "trans", prompt: "今までレストランで食べた一番おいしい食事は、北海道のカレーです。", answer: "The best meal I've ever had at a restaurant was curry in Hokkaido.", lesson: 15, hint: "The best ~ I've ever had", note: "語順が崩れた", tag: "レストラン", priority: 1 },
  { id: "L15-23", type: "trans", prompt: "大学生のとき、そのレストランでカレーを食べました。", answer: "When I was a university student, I had curry at that restaurant.", lesson: 15, hint: "When I was ~", note: "be動詞抜け・eat の時制", tag: "レストラン", priority: 1 },
  { id: "L15-24", type: "trans", prompt: "その香りと味が忘れられません。", answer: "I'll never forget the smell and the taste.", lesson: 15, hint: "never forget", note: "I don't forget は習慣に聞こえる", tag: "レストラン", priority: 1 },
  { id: "L15-25", type: "trans", prompt: "そのカレーにはチキン、新鮮なサラダ、柔らかいチーズが付いていました。", answer: "The curry came with chicken, fresh salad, and soft cheese.", lesson: 15, hint: "came with / had", note: "includes は現在形", tag: "レストラン", priority: 2 },

  // Lesson 16: 和文英訳
  { id: "L16-01", type: "trans", prompt: "マネージャーが昨日共有した書類は確認しましたか？", answer: "Have you reviewed the document shared by the manager yesterday?", lesson: 16, hint: "Have you ～? / shared by", note: "「the documents shared by manager」と言った。document は単数、manager の前に the が必要。名詞＋過去分詞（～された…）の形", tag: "Work Document", priority: 1 },
  { id: "L16-02", type: "trans", prompt: "はい、今朝新しい版を見ました。", answer: "Yes, I looked at the new version this morning.", lesson: 16, hint: "look at / version", tag: "Work Document", priority: 3 },
  { id: "L16-03", type: "trans", prompt: "赤で書かれた箇所に気づきましたか？", answer: "Did you notice the section written in red?", lesson: 16, hint: "notice / written in", tag: "Work Document", priority: 2 },
  { id: "L16-04", type: "trans", prompt: "はい、そこはマネージャーが私たちに修正してほしい部分ですよね？", answer: "Yes, that's the part the manager wants us to revise, right?", lesson: 16, hint: "want＋人＋to ～", note: "「that's a part of the…」と言いかけた。the part (that) the manager wants us to revise で「マネージャーが私たちに直してほしい部分」", tag: "Work Document", priority: 1 },
  { id: "L16-05", type: "trans", prompt: "メールに含まれている点について話し合うために会議をしましょう。", answer: "Let's have a meeting to discuss the points included in the email.", lesson: 16, hint: "have a meeting / included in", note: "「included in the emails」と複数形にして講師に直された。「Let's start meeting」とも言った。have a meeting の a を落とさない", tag: "Work Document", priority: 1 },
  { id: "L16-06", type: "trans", prompt: "クライアントから提供されたフィードバックを準備します。", answer: "I'll prepare the feedback provided by the client.", lesson: 16, hint: "I'll / provided by", note: "「I prepare the feedback by the client」と言った。I'll の 'll と provided が抜けた。prepare が prefer / approve になっていた", tag: "Work Document", priority: 1 },
  { id: "L16-07", type: "trans", prompt: "黄色でハイライトされたメモに気づきましたか？", answer: "Did you notice the note highlighted in yellow?", lesson: 16, hint: "highlighted in", note: "「the notes」と複数形にしていた", tag: "Work Document", priority: 2 },
  { id: "L16-08", type: "trans", prompt: "重要と印が付けられた見出しに気づきましたか？", answer: "Did you notice the headline marked as important?", lesson: 16, hint: "marked as", note: "headline が「hair drying」と聞こえていた", tag: "Work Document", priority: 2 },
  { id: "L16-09", type: "trans", prompt: "私が訂正したコメントに気づきましたか？", answer: "Did you notice the comment corrected by me?", lesson: 16, hint: "corrected by", tag: "Work Document", priority: 3 },
  { id: "L16-10", type: "trans", prompt: "訂正のために下線が引かれた段落に気づきましたか？", answer: "Did you notice the paragraph underlined for correction?", lesson: 16, hint: "underlined for", tag: "Work Document", priority: 2 },
  { id: "L16-11", type: "trans", prompt: "クライアントが追加した図に気づきましたか？", answer: "Did you notice the figure added by the client?", lesson: 16, hint: "figure / added by", note: "「fixture figure added by the crier」と聞こえていた。figure は図・数値", tag: "Work Document", priority: 2 },
  { id: "L16-12", type: "trans", prompt: "マネージャーが共有した提案について話し合うために会議をしましょう。", answer: "Let's have a meeting to discuss the suggestions shared by the manager.", lesson: 16, hint: "suggestions / shared by", note: "「have meeting」「the suggestion」と言った。a と複数の s が抜けた", tag: "Work Document", priority: 1 },
  { id: "L16-13", type: "trans", prompt: "先週更新されたアクションアイテムについて話し合うために会議をしましょう。", answer: "Let's have a meeting to discuss the action items updated last week.", lesson: 16, hint: "action items / updated", note: "action items＝会議後にやるべき作業項目", tag: "Work Document", priority: 2 },
  { id: "L16-14", type: "trans", prompt: "プレゼン中に強調された重要なアイデアについて話し合うために会議をしましょう。", answer: "Let's have a meeting to discuss the key ideas highlighted during the presentation.", lesson: 16, hint: "highlighted during", tag: "Work Document", priority: 2 },
  { id: "L16-15", type: "trans", prompt: "報告書で言及されたフィードバックについて話し合うために会議をしましょう。", answer: "Let's have a meeting to discuss the feedback mentioned in the report.", lesson: 16, hint: "mentioned in", note: "feedback は不可算（s を付けない）", tag: "Work Document", priority: 2 },
  { id: "L16-16", type: "trans", prompt: "議事録に記載された議題について話し合うために会議をしましょう。", answer: "Let's have a meeting to discuss the agenda noted in the meeting minutes.", lesson: 16, hint: "noted in / minutes", note: "meeting minutes＝議事録。「minutes は不要では？」と質問したが、minutes が無いと「議事録」の意味にならないので省略不可", tag: "Work Document", priority: 1 },
  { id: "L16-17", type: "trans", prompt: "ちょうど別の英語のレッスンを終えたところです。", answer: "I just finished another English lesson.", lesson: 16, hint: "just finished", note: "正しく言えていた", tag: "Small Talk", priority: 3 },
  { id: "L16-18", type: "trans", prompt: "頑張ります。", answer: "I'll do my best.", lesson: 16, hint: "do my best", note: "「I will do best」（my 抜け）、「I'll fight」と言った。fight は「戦う」で、頑張るの意味では使わない", tag: "Small Talk", priority: 1 },
  { id: "L16-19", type: "trans", prompt: "このレッスンの後は英語を勉強する予定です。", answer: "I'm planning to study English after this lesson.", lesson: 16, hint: "I'm planning to ～", note: "正しく言えていた（session でも可）", tag: "Small Talk", priority: 3 },
  { id: "L16-20", type: "trans", prompt: "そのメールはマネージャーからのものですか？", answer: "Is that email from the manager?", lesson: 16, hint: "Is ～ from …?", note: "「is that email, is that email from…」と言い直しが多かった。一息で言う", tag: "Work Document", priority: 2 },
  { id: "L16-21", type: "trans", prompt: "状況は分かりました。", answer: "I understand the situation.", lesson: 16, note: "正しく言えていた", tag: "Small Talk", priority: 3 },
  { id: "L16-22", type: "trans", prompt: "「minutes」という単語は必要ですか？", answer: "Is the word 'minutes' necessary?", lesson: 16, hint: "the word", note: "「Is the words minutes necessary?」と言った。単語1つなので the word", tag: "Work Document", priority: 2 },
  { id: "L16-23", type: "trans", prompt: "前のページを見せてください。", answer: "Could you show me the previous page?", lesson: 16, hint: "the previous page", note: "「Let me see previous page」と言った。the が必要。依頼は Could you ～? が丁寧", tag: "Small Talk", priority: 2 },
  { id: "L16-24", type: "trans", prompt: "「議事録」を英語で言うと？", answer: "meeting minutes", lesson: 16, hint: "minutes は複数形", note: "会議で話し合い・決定した内容の公式な記録。発音はミニッツ", tag: "Vocabulary", priority: 1 },
  { id: "L16-25", type: "trans", prompt: "「修正する・見直す」を英語で言うと？", answer: "revise", lesson: 16, hint: "re-", note: "review（確認する）と区別。revise は直して書き換える", tag: "Vocabulary", priority: 2 },
  { id: "L16-26", type: "trans", prompt: "「議題」を英語で言うと？", answer: "agenda", lesson: 16, tag: "Vocabulary", priority: 3 },
