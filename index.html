<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>瞬間英作文ドリル</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英作文">
<meta name="theme-color" content="#1c2430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #f3f5f8;
    --sheet: #ffffff;
    --ink: #1c2430;
    --ink-2: #5a6472;
    --ink-3: #9aa3ae;
    --rule: #d9dee5;
    --shu: #c9412f;        /* 朱 — the red-sheet colour */
    --shu-deep: #a5311f;
    --shu-tint: #fbe9e6;
    --ok: #2f7d4f;
    --ok-tint: #e3f2e8;
    --focus: #2b64c8;
    --shadow: 0 1px 2px rgba(28, 36, 48, .06), 0 8px 24px rgba(28, 36, 48, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #151a21;
      --sheet: #1e242d;
      --ink: #eef1f5;
      --ink-2: #aab3bf;
      --ink-3: #6d7784;
      --rule: #333b47;
      --shu: #e2604c;
      --shu-deep: #f08170;
      --shu-tint: #3a2622;
      --ok: #6cc48d;
      --ok-tint: #21332a;
      --focus: #7aa5f0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #151a21;
    --sheet: #1e242d;
    --ink: #eef1f5;
    --ink-2: #aab3bf;
    --ink-3: #6d7784;
    --rule: #333b47;
    --shu: #e2604c;
    --shu-deep: #f08170;
    --shu-tint: #3a2622;
    --ok: #6cc48d;
    --ok-tint: #21332a;
    --focus: #7aa5f0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .jp { font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  .app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 16px 24px;
    gap: 16px;
  }

  /* ---- top bar ---- */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .brand .en {
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .counter {
    font-size: 13px;
    color: var(--ink-2);
  }
  .counter b { color: var(--ink); font-weight: 500; }

  /* ---- status strip: 覚えた / あと1回 / まだ ---- */
  .status {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .status-round {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .status-round b { font-size: 18px; font-weight: 600; color: var(--ink); }
  .status-round > * { white-space: nowrap; }
  .status-round .today { margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--rule); }
  @media (max-width: 440px) { .status-round .mini { display: none; } .status-round .today { margin-left: auto; } }
  .status-round .today em { font-style: normal; margin-left: 6px; color: var(--shu-deep); }
  .status-round .today em b { color: var(--shu-deep); }
  .status-round .mini { margin-left: auto; font-size: 12px; color: var(--ink-3); text-decoration: none; }
  .status-round .mini:hover { color: var(--ink-2); }
  .status-bar {
    display: flex;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    background: var(--rule);
  }
  .status-bar i { display: block; height: 100%; transition: width .3s ease; }
  .status-bar .done { background: var(--ok); }
  .status-bar .half { background: var(--ok); opacity: .35; }
  .status-nums {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--ink-2);
    margin-top: 2px;
  }
  @media (max-height: 720px) { .status-nums b { font-size: 16px; } .status-nums { font-size: 12px; } }
  .status-nums span { display: inline-flex; align-items: baseline; gap: 5px; }
  .status-nums b { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1; }
  .status-nums .done b { color: var(--ok); }
  .status-nums .half b { color: var(--shu-deep); }
  .status-nums .dot { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
  .status-nums .done .dot { background: var(--ok); }
  .status-nums .half .dot { background: var(--shu); opacity: .55; }
  .status-nums .todo .dot { background: var(--rule); }

  /* ---- swipe ---- */
  .card {
    position: relative;
    touch-action: pan-x;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
  }
  .card.dragging { transition: none; }
  .card.fly {
    transition: transform .22s ease-in, opacity .22s ease-in;
    transform: translateY(-40%) rotate(-2deg);
    opacity: 0;
  }
  .card.settle { transition: transform .18s ease-out, opacity .18s ease-out; }
  /* ダブルタップ ＝ 言えた のスタンプ */
  .btn.link.dim, button.link.dim { opacity: .55; }
  /* 画面内のお知らせ（alert が使えない枠の中でも見える） */
  .notice {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50; display: block;
    background: #1c2430; color: #fff; border-radius: 12px; padding: 12px 14px 12px 16px;
    font-size: 13px; line-height: 1.55; box-shadow: 0 10px 30px rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.18);
    max-height: 60vh; overflow-y: auto; text-align: left;
  }
  .notice[hidden] { display: none; }
  .notice span { display: block; white-space: pre-wrap; overflow-wrap: anywhere; color: #fff; }
  .notice button { float: right; margin: -4px -6px 0 10px; padding: 4px 8px; background: rgba(255,255,255,.12); border: 0; border-radius: 8px; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
  .stamp {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .12s;
  }
  .stamp span {
    font-size: 26px; font-weight: 700; letter-spacing: .08em; color: #fff;
    background: var(--k, var(--shu)); padding: 10px 24px; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    transform: scale(.6) rotate(-8deg); transition: transform .16s cubic-bezier(.2,1.4,.4,1);
  }
  .card.stamped .stamp { opacity: 1; }
  .card.stamped .stamp span { transform: scale(1) rotate(-8deg); }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-3);
    padding: 0 20px 14px;
    letter-spacing: .04em;
  }

  /* ---- the card ---- */
  .card {
    display: flex;
    flex-direction: column;
    background: var(--sheet);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: .06em;
  }
  .unit-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .unit-tag::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 2px;
    background: var(--tag, var(--shu));
  }

  .meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px 20px 0;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    color: var(--ink-2);
    background: var(--sheet);
  }
  .badge b { font-weight: 600; color: var(--ink); }
  .badge.first { color: var(--ink-3); }
  .badge.half { background: var(--ok-tint); color: var(--ok); border-color: transparent; }
  .badge.half b { color: var(--ok); }
  .badge.zero { color: var(--ink-3); }
  .badge.hard { background: var(--shu); color: #fff; border-color: transparent; font-weight: 700; }
  .badge.hard b { color: #fff; }
  .card.hard { box-shadow: 0 0 0 2px var(--shu), var(--shadow); }
  .card.hard .card-head { background: var(--shu-tint); }
  .hard-tag {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 10px; padding: 2px 8px; border-radius: 999px;
    background: var(--shu); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  }
  .pill.hard { background: var(--shu); color: #fff; border-color: transparent; }
  .badge .pips { display: inline-flex; gap: 3px; }
  .badge .pip { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; }
  .badge .pip.on { background: currentColor; }

  .timer {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    font-size: 15px;
    color: var(--shu);
    font-weight: 500;
  }
  .timer small { font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
  .gauge {
    height: 8px;
    background: var(--rule);
    overflow: hidden;
  }
  .gauge i {
    display: block;
    height: 100%;
    width: 100%;
    background: var(--shu);
    transform-origin: left;
    transform: scaleX(1);
  }
  .gauge i.run {
    transition: transform linear;
    transform: scaleX(0);
  }
  .card.revealed .gauge i { background: var(--ink-3); }

  .prompt {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 16px 16px 18px;
  }
  .prompt { border-left: 5px solid var(--k, var(--shu)); }
  .prompt .mark {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    padding: 5px 7px;
    border-radius: 5px;
    margin-right: 10px;
    vertical-align: .25em;
    color: #fff;
    background: var(--k, var(--shu));
    white-space: nowrap;
  }
  .prompt .ja {
    margin: 0;
    font-size: clamp(20px, 5.4vw, 28px);
    font-weight: 500;
    line-height: 1.5;
    text-wrap: pretty;
  }
  .prompt .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .prompt .cue {
    display: block;
    margin-top: 8px;
    font-size: .8em;
    font-weight: 700;
    color: var(--focus);
  }
  .answer .note {
    margin: 10px 0 0;
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .answer .note:empty { display: none; }
  .card:not(.revealed) .answer .note { visibility: hidden; }

  /* ---- answer: the red sheet ---- */
  .answer {
    position: relative;
    margin: 0 16px 16px;
    border-radius: 10px;
    min-height: 118px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 16px 14px 16px 16px;
    background: var(--shu-tint);
    border: 1px solid transparent;
  }
  .answer .label {
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--ink-3);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .answer .en {
    margin: 0;
    font-size: clamp(19px, 5vw, 26px);
    font-weight: 500;
    line-height: 1.4;
    text-wrap: pretty;
    min-width: 0;
  }
  .answer .en .chunk { white-space: nowrap; }
  .answer .en { line-height: 1.6; padding-top: .4em; }
  .acc {
    position: relative;
    font-weight: 700;
    color: var(--ink);
  }
  .acc::before {
    content: "";
    position: absolute;
    top: -.38em;
    left: 50%;
    width: .3em; height: .3em;
    border-radius: 50%;
    background: var(--shu);
    transform: translateX(-50%);
  }
  .summary li { padding-top: .3em; }
  .summary .acc::before { width: .34em; height: .34em; top: -.4em; }
  .answer .row {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
  }
  .sheet {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: var(--shu);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
    letter-spacing: .04em;
    cursor: pointer;
    border: 0;
    font: inherit;
    transition: transform .28s cubic-bezier(.2,.7,.2,1), opacity .2s;
    transform-origin: right center;
  }
  .sheet:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .card.revealed .sheet {
    transform: translateX(104%) rotate(1.5deg);
    opacity: 0;
    pointer-events: none;
  }
  .card.revealed .answer {
    border-color: var(--rule);
    background: transparent;
  }
  .card:not(.revealed) .answer .row { visibility: hidden; }
  .card:not(.revealed) .answer .label { visibility: hidden; }

  .speak {
    appearance: none;
    border: 1px solid var(--rule);
    background: var(--sheet);
    color: var(--ink-2);
    border-radius: 999px;
    width: 34px; height: 34px;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font: inherit;
  }
  .speak:hover { color: var(--ink); border-color: var(--ink-3); }
  .speak:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .speak[hidden] { display: none; }
  .speak .ic-speak { display: inline-flex; }
  .speak .ic-pause, .speak .ic-play { display: none; }
  .speak.playing .ic-speak, .speak.paused .ic-speak { display: none; }
  .speak.playing .ic-pause { display: block; }
  .speak.paused .ic-play { display: block; }
  .speak.playing, .speak.paused { color: var(--shu-deep); border-color: var(--shu-deep); }

  /* ---- actions: right under the answer ---- */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 16px;
  }
  .actions[data-state="hidden"] { grid-template-columns: 1fr; }
  .btn {
    appearance: none;
    border: 1px solid var(--rule);
    background: var(--sheet);
    color: var(--ink);
    border-radius: 14px;
    padding: 22px 12px;
    min-height: 72px;
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .15s, border-color .15s, transform .08s;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.ok { background: var(--ok-tint); color: var(--ok); border-color: transparent; }
  .btn.again { background: var(--shu-tint); color: var(--shu-deep); border-color: transparent; }
  .btn .mark {
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
  }
  .btn .key {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    opacity: .55;
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 0 5px;
    line-height: 1.5;
  }
  @media (hover: none) { .btn .key { display: none; } }

  /* ---- footer / settings ---- */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--ink-2);
  }
  .foot label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .foot input[type="checkbox"] { accent-color: var(--shu); width: 16px; height: 16px; margin: 0; }
  .foot select {
    font: inherit;
    font-size: 13px;
    background: var(--sheet);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 3px 6px;
  }
  .score { display: inline-flex; gap: 14px; }
  .cleared { color: var(--ink-3); display: inline-flex; gap: 6px; align-items: baseline; }
  .cleared .mono { color: var(--ink-2); }
  .score .ok-n { color: var(--ok); }
  .score .ng-n { color: var(--shu); }
  .link {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    color: var(--ink-2);
    font: inherit;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---- progress list ---- */
  .progress {
    background: var(--sheet);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .progress-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .progress-head .sum { font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 12px; }
  .progress h3 {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: .06em;
    display: flex; align-items: center; gap: 6px;
  }
  .progress h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--tag, var(--shu)); }
  .progress ul { margin: 0; padding: 0; list-style: none; }
  .progress li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    align-items: baseline;
    padding: 7px 0;
    border-top: 1px solid var(--rule);
    font-size: 14px;
  }
  .progress li .main { grid-column: 1; grid-row: 1; }
  .progress li .sub { grid-column: 1; grid-row: 2; font-size: 12px; color: var(--ink-3); }
  .progress li.done .main { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--rule); }
  .pill {
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: center;
    font-size: 12px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    color: var(--ink-2);
    white-space: nowrap;
  }
  .pill.done { background: var(--ok-tint); color: var(--ok); border-color: transparent; }
  .pill.half { background: var(--shu-tint); color: var(--shu-deep); border-color: transparent; }
  .sync { font-size: 12px; color: var(--ink-3); }

  /* ---- round summary ---- */
  .summary {
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
    justify-content: center;
  }
  .summary h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .summary p { margin: 0; color: var(--ink-2); }
  .summary .big { font-size: 40px; font-weight: 500; color: var(--ink); line-height: 1.1; }
  .summary ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .summary li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
  .summary li .ja { color: var(--ink-2); font-size: 13px; }

  /* ---- 画面サイズ ----
     カードの上は「上にスワイプ」の操作用で縦スクロールできないので、どの画面でも
     ページ全体を画面の高さに収める。収まらない長い文は fitBox() が字を小さくする。
     折りたたみ iPhone: 開いた画面（幅 600px 以上）は文字とボタンを大きく、閉じた外側の細い画面は余白を詰める */
  html, body { height: 100%; }

  .card { flex: 1 1 auto; min-height: 0; }

  .badge { white-space: nowrap; flex: 0 0 auto; }

    .answer .note { font-size: clamp(13px, 1.9vh, 17px); }
    .actions { gap: 16px; padding: 0 24px 16px; }
    .btn { min-height: clamp(60px, 10vh, 96px); padding: clamp(12px, 2.4vh, 26px) 16px; font-size: clamp(18px, 2.8vh, 24px); border-radius: 18px; }

  }

  @media (prefers-reduced-motion: reduce) {

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 class="jp">瞬間英作文ドリル</h1>
      <span class="en">Instant Composition</span>
    </div>
    <div class="counter mono" id="counter"></div>
  </header>

  <div class="status jp" id="status" aria-label="この周の進み">
    <div class="status-round"><span>この周</span><b class="mono"><span id="roundPos">0</span> / <span id="roundTotal">30</span></b><span class="today">今日 <b class="mono" id="nToday">0</b> / <span id="nGoal">100</span><em>あと <b class="mono" id="nLeft">100</b></em></span><span class="mini">全体の進み</span></div>
    <div class="status-bar"><i class="done" id="barDone"></i><i class="half" id="barHalf"></i></div>
    <div class="status-nums" id="statusNums">
      <span class="done"><i class="dot"></i>覚えた <b class="mono" id="nDone">0</b></span>
      <span class="half"><i class="dot"></i>あと1回 <b class="mono" id="nHalf">0</b></span>
      <span class="todo"><i class="dot"></i>まだ <b class="mono" id="nTodo">0</b></span>
    </div>
  </div>

  <main class="card" id="card">
    <div class="gauge" id="gauge" hidden><i id="timerBar"></i></div>
    <div class="stamp jp" aria-hidden="true"><span>言えた ✓</span></div>
    <div class="card-head">
      <span><span class="unit-tag jp" id="unitTag"></span><span class="hard-tag jp" id="hardTag" hidden>苦手</span></span>
      <span class="timer" id="timer" hidden>
        <span class="mono" id="timerText"></span><small>秒</small>
      </span>
    </div>

    <div class="meta jp" id="meta">
      <span class="badge" id="tryBadge"></span>
      <span class="badge" id="clearBadge"></span>
    </div>

    <section class="prompt" id="promptArea">
      <div class="row">
        <p class="ja jp" id="promptText"></p>
        <button class="speak" id="speakBtn2" type="button" title="読み上げ" aria-label="英語を読み上げる" hidden>
          <span class="ic-speak"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></span><svg class="ic-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg class="ic-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
    </section>

    <section class="answer" id="answerArea" aria-live="polite">
      <div class="label" id="answerLabel">Answer</div>
      <div class="row">
        <p class="en" id="answerText"></p>
        <button class="speak" id="speakBtn" type="button" title="読み上げ" aria-label="英語を読み上げる">
          <span class="ic-speak"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></span><svg class="ic-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg class="ic-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <p class="note jp" id="answerNote"></p>
      <button class="sheet jp" id="sheetBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="sheetText">答えを見る</span>
      </button>
    </section>

    <div class="actions jp" id="actions" data-state="hidden">
      <button class="btn primary" id="revealBtn" type="button">答えを見る <span class="key">Space</span></button>
      <button class="btn ok" id="okBtn" type="button" hidden><span class="mark">○</span>言えた <span class="key">1</span></button>
      <button class="btn again" id="againBtn" type="button" hidden><span class="mark">×</span>もう一度 <span class="key">2</span></button>
    </div>
    <div class="hint jp" id="hint">↑ 上にスワイプ ＝ もう一度 ・ ↓ 下にスワイプ ＝ 前の問題に戻る ・ 2回タップ ＝ 言えた</div>
    <section class="summary jp" id="summary" hidden></section>
  </main>

  <section class="progress jp" id="progress" hidden aria-label="進み具合"></section>


  <footer class="foot jp">
    <span class="score mono" id="score"></span>
    <label for="timeLimit">制限時間
      <select id="timeLimit">
        <option value="0">なし</option>
        <option value="2">2秒</option>
        <option value="3">3秒</option>
        <option value="5">5秒</option>
        <option value="10">10秒</option>
      </select>
    </label>
    <button class="link" id="restoreBtn" type="button">覚えた文を戻す</button>
    <label for="autoSpeak"><input type="checkbox" id="autoSpeak" checked> 時間切れで読み上げ</label>
    <button class="link" id="progressBtn" type="button">一覧</button>
    <button class="link" id="resetBtn" type="button">最初から</button>
    <button class="link" id="badgeBtn" type="button">バッジ</button>
    <div class="notice jp" id="notice" hidden><button type="button" id="noticeClose" aria-label="閉じる">×</button><span id="noticeText"></span></div>
    <span class="sync" id="sync">この端末に記憶</span>
  </footer>
</div>

  { id: "L7-J16", type: "trans", prompt: "気づいたら時間が経ってしまうんです。", answer: "I lose track of time.", lesson: 7, hint: "lose track of 〜", note: "「時間の感覚を失う」の定型表現", tag: "定型表現", priority: 1 },
  { id: "L7-J17", type: "trans", prompt: "なんで自分はこれを見てるんだろう、と思います。", answer: "I wonder why I'm watching this.", lesson: 7, hint: "進行形は be + -ing", note: "Why am I watching this? でも可", tag: "進行形", priority: 2 },
  { id: "L7-J18", type: "trans", prompt: "実は友達の更新しか見ていません。", answer: "Actually, I only see my friends' updates.", lesson: 7, hint: "only の位置", note: "friends' のアポストロフィの位置に注意", tag: "所有格", priority: 2 },
  { id: "L7-J19", type: "trans", prompt: "フェイクニュースはめったに見ません。", answer: "I rarely see fake news.", lesson: 7, hint: "めったに〜ない", note: "rarely / seldom。not を使わない", tag: "頻度副詞", priority: 1 },
  { id: "L7-J20", type: "trans", prompt: "SNSに1日30分くらい使います。", answer: "I spend about 30 minutes a day using social media.", lesson: 7, hint: "spend + 時間 + -ing", note: "習慣なので現在形", tag: "時制", priority: 1 },
  { id: "L7-J21", type: "trans", prompt: "局所麻酔を受けました。", answer: "I had a local anesthetic.", lesson: 7, hint: "「受ける」の動詞", note: "have は処置を受ける。get はくだけた言い方", tag: "コロケーション", priority: 3 },
  { id: "L7-J22", type: "trans", prompt: "深呼吸すると痛みます。", answer: "It hurts when I take a deep breath.", lesson: 7, hint: "hurt の使い方", note: "体調説明の定番表現", tag: "体調", priority: 3 },
  { id: "L7-J23", type: "trans", prompt: "気に入ってもらえて嬉しいです。", answer: "I'm glad you liked it.", lesson: 7, hint: "褒められたときの返し", note: "Thanks だけで終わらせない", tag: "あいづち", priority: 2 },
  { id: "L7-J24", type: "trans", prompt: "ちょっと考えさせてください。", answer: "Let me think.", lesson: 7, hint: "詰まったときのつなぎ", note: "沈黙より会話の主導権を保てる", tag: "つなぎ表現", priority: 1 },
  { id: "L7-J25", type: "trans", prompt: "すみません、言い直します。", answer: "Sorry, let me start again.", lesson: 7, hint: "言い直しの合図", note: "途中で区切らず文頭から言い直す", tag: "つなぎ表現", priority: 1 },
  { id: "L7-J26", type: "trans", prompt: "すみません、もう一度言ってもらえますか。", answer: "Sorry, could you say that again?", lesson: 7, hint: "聞き返し", note: "推測で答えるより聞き返すほうが安全", tag: "つなぎ表現", priority: 1 },
  { id: "L7-J27", type: "trans", prompt: "いえ、質問はありません。", answer: "No, I don't.", lesson: 7, hint: "3語で言える", note: "I don't have. とは言わない", tag: "省略", priority: 1 },
  // Lesson 7: 発音・聞き取り
  { id: "L7-P01", type: "qa", prompt: "saw と sold の違いは？", answer: "saw /sɔː/ は舌を動かさず口を丸めて伸ばす。sold /soʊld/ は l で舌先が上につく", lesson: 7, hint: "l の音が入るかどうか", note: "law / draw も同じ /ɔː/", tag: "母音", priority: 1 },
  { id: "L7-P02", type: "qa", prompt: "see と she の違いは？", answer: "see /siː/ はスィー。she /ʃiː/ はシー", lesson: 7, hint: "s と sh", note: "日本語の「シー」だと she になる", tag: "子音", priority: 1 },
  { id: "L7-P03", type: "qa", prompt: "read の過去形の発音は？", answer: "/red/ レッド(red と同音)。現在形は /riːd/ リード", lesson: 7, hint: "綴りは同じ", note: "let /let/ と混同しない", tag: "不規則動詞", priority: 1 },
  { id: "L7-P04", type: "qa", prompt: "playing と praying の違いは？", answer: "playing は l で舌先を上の歯茎につける。praying は r で舌をどこにもつけない", lesson: 7, hint: "l と r", note: "意味が全く変わるので要注意", tag: "L/R", priority: 1 },
  { id: "L7-P05", type: "qa", prompt: "uploaded と approved の聞き分け方は？", answer: "upload はアップロウドで第1音節が強い。approve はアプルーヴで第2音節が強い", lesson: 7, hint: "アクセント位置", note: "音の並びでなく強勢で判断する", tag: "アクセント", priority: 1 },
  { id: "L7-P06", type: "qa", prompt: "send と sent の聞き分けは？", answer: "sent は語尾が /t/ で切れる。文全体の時制から逆算する", lesson: 7, hint: "語尾の子音", note: "文末の子音は弱く落ちやすい", tag: "過去形", priority: 2 },
  { id: "L7-P07", type: "qa", prompt: "Why were you...? の were が聞き取れないときは？", answer: "were は弱く「ワ」程度。文全体が過去形なら were と判断する", lesson: 7, hint: "弱形", note: "are と聞き間違えやすい", tag: "弱形", priority: 1 },
  { id: "L7-P08", type: "qa", prompt: "How old と How often の違いは？", answer: "How old は年齢(She's five.)、How often は頻度(Twice a day.)", lesson: 7, hint: "2語目まで聞く", note: "語頭が同じなので最後まで聞く", tag: "疑問詞", priority: 1 },
  { id: "L7-P09", type: "qa", prompt: "profile のアクセントは？", answer: "/ˈproʊfaɪl/ 第1音節。プロウファイル(フィーではなくファイ)", lesson: 7, hint: "カタカナ語とずれる", note: "mobile も同じパターン", tag: "アクセント", priority: 2 },
  { id: "L7-P10", type: "qa", prompt: "checked / watched / noticed の -ed の発音は？", answer: "すべて /t/。チェックト、ウォッチト、ノウティスト", lesson: 7, hint: "濁らせない", note: "posted / uploaded は /ɪd/", tag: "過去形", priority: 2 },
  { id: "L7-P11", type: "qa", prompt: "posts の発音は？", answer: "/poʊsts/ 。sts の子音連続。難しければ t を軽く飲み込む", lesson: 7, hint: "子音連続", note: "「ポスツ」にならないように", tag: "複数形", priority: 3 },
  { id: "L7-P12", type: "qa", prompt: "anesthesia のアクセントは？", answer: "/ˌænəsˈθiːʒə/ アネスィージャ。第3音節が強い", lesson: 7, hint: "thes をスィーと伸ばす", note: "「アネステジア」では通じにくい", tag: "アクセント", priority: 3 },
  // Lesson 8: 穴埋め
  { id: "L8-B01", type: "blank", prompt: "I will go to the park (   ) relax this weekend.", answer: "to", lesson: 8, tag: "不定詞", priority: 1 },
  { id: "L8-B02", type: "blank", prompt: "Are you going to stay there (   )?", answer: "overnight", lesson: 8, tag: "語彙", priority: 1 },
  { id: "L8-B03", type: "blank", prompt: "I will clean my room to make it (   ).", answer: "tidy", lesson: 8, tag: "語彙", priority: 1 },
  { id: "L8-B04", type: "blank", prompt: "I'm going to go to a hot spring after (   ) tennis.", answer: "playing", lesson: 8, tag: "動名詞", priority: 1 },
  { id: "L8-B05", type: "blank", prompt: "About once (   ) two months.", answer: "every", lesson: 8, tag: "頻度", priority: 1 },
  { id: "L8-B06", type: "blank", prompt: "I need some time to (   ).", answer: "myself", lesson: 8, tag: "代名詞", priority: 1 },
  { id: "L8-B07", type: "blank", prompt: "I go to a café to concentrate (   ) my work.", answer: "on", lesson: 8, tag: "前置詞", priority: 1 },
  { id: "L8-B08", type: "blank", prompt: "My parents (   ) near my house.", answer: "live", lesson: 8, tag: "語彙", priority: 1 },
  { id: "L8-B09", type: "blank", prompt: "Could you say (   ) again?", answer: "that", lesson: 8, tag: "つなぎ表現", priority: 1 },
  { id: "L8-B10", type: "blank", prompt: "I go to my parents' house (   ) weekends.", answer: "on", lesson: 8, tag: "前置詞", priority: 2 },
  { id: "L8-B11", type: "blank", prompt: "I had a meeting with (   ) loan officer at the bank.", answer: "a", lesson: 8, tag: "冠詞", priority: 1 },
  { id: "L8-B12", type: "blank", prompt: "The (   ) is at the end of the month.", answer: "closing", lesson: 8, tag: "語彙", priority: 1 },
  { id: "L8-B13", type: "blank", prompt: "I will (   ) tennis with my friends.", answer: "play", lesson: 8, tag: "コロケーション", priority: 1 },
  { id: "L8-B14", type: "blank", prompt: "(   ) you do anything else?", answer: "Will", lesson: 8, tag: "助動詞", priority: 1 },
  // Lesson 8: 誤文訂正
  { id: "L8-C01", type: "correct", prompt: "What will you do with this weekend?", answer: "What will you do this weekend?", lesson: 8, hint: "with は不要", note: "this weekend や next week に前置詞は付けない", tag: "前置詞", priority: 1 },
  { id: "L8-C02", type: "correct", prompt: "I visit my grandparents to spend time with them.", answer: "I will visit my grandparents to spend time with them.", lesson: 8, hint: "未来のことなので？", note: "リピート時に will が落ちやすい", tag: "未来形", priority: 1 },
  { id: "L8-C03", type: "correct", prompt: "I had a meeting with bank officer.", answer: "I had a meeting with a loan officer at the bank.", lesson: 8, hint: "冠詞が抜けている", note: "人を表す可算名詞には a が必要。融資担当は loan officer", tag: "冠詞", priority: 1 },
  { id: "L8-C04", type: "correct", prompt: "I had a meeting for my home reform loan.", answer: "I had a meeting about my home renovation loan.", lesson: 8, hint: "リフォームは和製英語", note: "改修は renovation。reform は制度改革", tag: "和製英語", priority: 1 },
  { id: "L8-C05", type: "correct", prompt: "I have a crossing at the end of the month.", answer: "The closing is at the end of the month.", lesson: 8, hint: "crossing ではなく？", note: "不動産の決済は closing。L と R で意味が変わる", tag: "語彙", priority: 1 },
  { id: "L8-C06", type: "correct", prompt: "Because today is only on the application.", answer: "Today was just the application.", lesson: 8, hint: "1文で言い切る", note: "Because で始めず、独立した文にする", tag: "文構造", priority: 2 },
  { id: "L8-C07", type: "correct", prompt: "I will clean my loom to make it tidy.", answer: "I will clean my room to make it tidy.", lesson: 8, hint: "room の発音", note: "room は r、clean は l。舌の位置を区別する", tag: "L/R", priority: 2 },
  { id: "L8-C08", type: "correct", prompt: "Are you going to attend the concert this weekend?", answer: "Are you going to attend a concert this weekend?", lesson: 8, hint: "特定のコンサートではない", note: "初出・不特定は a", tag: "冠詞", priority: 2 },
  { id: "L8-C09", type: "correct", prompt: "I will try tennis with my university friend to enjoy this weekend.", answer: "I will play tennis with a university friend to enjoy my time this weekend.", lesson: 8, hint: "テニスは try しない", note: "スポーツは play。enjoy には目的語が必要", tag: "コロケーション", priority: 1 },
  { id: "L8-C10", type: "correct", prompt: "Would you do anything else?", answer: "Will you do anything else?", lesson: 8, hint: "予定を聞くとき", note: "Would だと仮定・依頼の意味になる", tag: "助動詞", priority: 1 },
  { id: "L8-C11", type: "correct", prompt: "I will go to office to hard work.", answer: "I will go to the office to work hard.", lesson: 8, hint: "冠詞と語順", note: "職場は the office。hard は動詞の後ろ", tag: "語順", priority: 1 },
  { id: "L8-C12", type: "correct", prompt: "I'm going to go to restaurant with my friends.", answer: "I'm going to go to a restaurant with my friends.", lesson: 8, hint: "冠詞が抜けている", note: "建物・店には a / the が必要", tag: "冠詞", priority: 1 },
  { id: "L8-C13", type: "correct", prompt: "I'm going to hot spring after play tennis.", answer: "I'm going to go to a hot spring after playing tennis.", lesson: 8, hint: "go to と前置詞の後ろ", note: "be going to の後は動詞。after の後は動名詞", tag: "動名詞", priority: 1 },
  { id: "L8-C14", type: "correct", prompt: "Once or two months.", answer: "Once every two months.", lesson: 8, hint: "2か月に1回", note: "every + 期間 で頻度を表す", tag: "頻度", priority: 1 },
  { id: "L8-C15", type: "correct", prompt: "Could you say more again?", answer: "Could you say that again?", lesson: 8, hint: "more ではなく？", note: "聞き返しの定型表現。Could you repeat that? も可", tag: "つなぎ表現", priority: 1 },
  { id: "L8-C16", type: "correct", prompt: "My parents are nearly my house.", answer: "My parents live near my house.", lesson: 8, hint: "nearly は「ほとんど」", note: "near は前置詞で「〜の近くに」", tag: "語彙", priority: 1 },
  { id: "L8-C17", type: "correct", prompt: "I go to my parents on weekend.", answer: "I go to my parents' house on weekends.", lesson: 8, hint: "習慣の weekend は？", note: "習慣は on weekends と複数形。所有格に注意", tag: "所有格", priority: 2 },
  { id: "L8-C18", type: "correct", prompt: "I like to spend time both.", answer: "I like doing both.", lesson: 8, hint: "both の使い方", note: "「どちらも好き」は I like both. / I like doing both.", tag: "語法", priority: 2 },
  { id: "L8-C19", type: "correct", prompt: "I need own time.", answer: "I need some time to myself.", lesson: 8, hint: "own の前に必要な語", note: "my own time でも可。to myself が自然", tag: "代名詞", priority: 1 },
  { id: "L8-C20", type: "correct", prompt: "My relaxing time is going to hot spring.", answer: "To relax, I go to a hot spring.", lesson: 8, hint: "主語を自分にする", note: "名詞で始めず、動詞中心の文にすると崩れにくい", tag: "文構造", priority: 2 },
  { id: "L8-C21", type: "correct", prompt: "I'm going to coffee to relax.", answer: "I go to a café to relax.", lesson: 8, hint: "coffee は飲み物", note: "店は café / coffee shop", tag: "語彙", priority: 1 },
  { id: "L8-C22", type: "correct", prompt: "I go there to concentrate for my work.", answer: "I go there to concentrate on my work.", lesson: 8, hint: "concentrate の後は？", note: "concentrate on 〜 が固定", tag: "前置詞", priority: 1 },
  { id: "L8-C23", type: "correct", prompt: "What songs are these?", answer: "What song is it?", lesson: 8, hint: "曲は1つ", note: "相手が挙げた1曲を指すので単数", tag: "単数複数", priority: 2 },
  { id: "L8-C24", type: "correct", prompt: "Psychology is very interesting, but sometimes difficult.", answer: "Psychiatry is very interesting, but sometimes it's difficult.", lesson: 8, hint: "自分の専門は？", note: "psychology は心理学、psychiatry は精神医学", tag: "語彙", priority: 2 },
  { id: "L8-C26", type: "correct", prompt: "No, I don't have.", answer: "No, I don't.", lesson: 8, hint: "have は目的語が必要", note: "動詞を繰り返さず助動詞で止める（前回からの継続項目）", tag: "省略", priority: 1 },
  // Lesson 8: 和文英訳
  { id: "L8-J01", type: "trans", prompt: "今週末は何をしますか。", answer: "What will you do this weekend?", lesson: 8, hint: "with を付けない", note: "レッスンの基本文。即答できるようにする", tag: "未来形", priority: 1 },
  { id: "L8-J02", type: "trans", prompt: "今週末はリラックスするために公園に行きます。", answer: "I will go to the park to relax this weekend.", lesson: 8, hint: "to + 動詞の原形", note: "目的は to 不定詞で表す", tag: "不定詞", priority: 1 },
  { id: "L8-J03", type: "trans", prompt: "祖父母を訪ねて一緒に過ごすつもりです。", answer: "I will visit my grandparents to spend time with them.", lesson: 8, hint: "visit の後に前置詞は不要", note: "visit は他動詞", tag: "他動詞", priority: 1 },
  { id: "L8-J04", type: "trans", prompt: "そこに一泊するのですか。", answer: "Are you going to stay there overnight?", lesson: 8, hint: "一晩泊まる", note: "overnight = 翌日まで滞在する", tag: "語彙", priority: 1 },
  { id: "L8-J05", type: "trans", prompt: "彼らに夕食を作るつもりです。", answer: "I'm going to cook dinner for them.", lesson: 8, hint: "cook + 料理 + for 人", note: "作る相手は for", tag: "前置詞", priority: 2 },
  { id: "L8-J06", type: "trans", prompt: "部屋を片づけるために掃除します。", answer: "I will clean my room to make it tidy.", lesson: 8, hint: "tidy = 片づいた", note: "make it tidy で「片づける」", tag: "語彙", priority: 1 },
  { id: "L8-J07", type: "trans", prompt: "今朝、銀行のローン担当者と面談がありました。", answer: "I had a meeting with a loan officer at the bank this morning.", lesson: 8, hint: "a を忘れない", note: "have a meeting with 人", tag: "冠詞", priority: 1 },
  { id: "L8-J08", type: "trans", prompt: "今日は申し込みだけで、決済は月末です。", answer: "Today was just the application, and the closing is at the end of the month.", lesson: 8, hint: "決済は？", note: "closing。crossing にならないよう注意", tag: "語彙", priority: 1 },
  { id: "L8-J09", type: "trans", prompt: "自宅のリフォームローンの件です。", answer: "It's about my home renovation loan.", lesson: 8, hint: "リフォームは？", note: "renovation を使う", tag: "和製英語", priority: 1 },
  { id: "L8-J10", type: "trans", prompt: "手続きには時間がかかります。", answer: "It will take time to be processed.", lesson: 8, hint: "take time", note: "講師が使っていた表現", tag: "定型表現", priority: 2 },
  { id: "L8-J11", type: "trans", prompt: "テニスをしたあとに温泉に行きます。", answer: "I go to a hot spring after playing tennis.", lesson: 8, hint: "after + 動名詞", note: "温泉は hot spring", tag: "動名詞", priority: 1 },
  { id: "L8-J12", type: "trans", prompt: "2か月に1回くらいです。", answer: "About once every two months.", lesson: 8, hint: "every + 期間", note: "once / twice / three times", tag: "頻度", priority: 1 },
  { id: "L8-J13", type: "trans", prompt: "大学の友人とテニスをします。", answer: "I play tennis with my university friends.", lesson: 8, hint: "スポーツは play", note: "do や try は使わない", tag: "コロケーション", priority: 1 },
  { id: "L8-J14", type: "trans", prompt: "友人の家には行きません。", answer: "I don't visit my friends' houses.", lesson: 8, hint: "所有格の位置", note: "friends' のアポストロフィに注意", tag: "所有格", priority: 2 },
  { id: "L8-J15", type: "trans", prompt: "両親の家には週末に行きます。", answer: "I go to my parents' house on weekends.", lesson: 8, hint: "習慣は複数形", note: "on weekends", tag: "頻度", priority: 2 },
  { id: "L8-J16", type: "trans", prompt: "車で30分くらいかかります。", answer: "It takes about 30 minutes by car.", lesson: 8, hint: "It takes 〜", note: "交通手段は by car", tag: "定型表現", priority: 1 },
  { id: "L8-J17", type: "trans", prompt: "正直に言うと、どちらも好きです。", answer: "Honestly, I like both.", lesson: 8, hint: "both を後ろに置く", note: "I like doing both. も可", tag: "語法", priority: 2 },
  { id: "L8-J18", type: "trans", prompt: "昼間は出かけたいですが、夜は一人の時間が必要です。", answer: "I want to go out during the day, but I need some time to myself at night.", lesson: 8, hint: "during the day", note: "time to myself = 自分の時間", tag: "代名詞", priority: 1 },
  { id: "L8-J19", type: "trans", prompt: "カラオケで日本のポップスをよく歌います。", answer: "I usually sing Japanese pop songs at karaoke.", lesson: 8, hint: "場所は at", note: "pop songs と複数形", tag: "単数複数", priority: 2 },
  { id: "L8-J20", type: "trans", prompt: "アニメの曲を歌うこともあります。", answer: "Sometimes I sing anime songs.", lesson: 8, hint: "文頭の Sometimes", note: "anime songs でそのまま通じる", tag: "頻度副詞", priority: 2 },
  { id: "L8-J21", type: "trans", prompt: "仕事に集中するためにカフェに行きます。", answer: "I go to a café to concentrate on my work.", lesson: 8, hint: "concentrate on", note: "coffee ではなく café", tag: "前置詞", priority: 1 },
  { id: "L8-J22", type: "trans", prompt: "私は精神科医です。", answer: "I'm a psychiatrist.", lesson: 8, hint: "a を忘れない", note: "職業には冠詞が必要", tag: "冠詞", priority: 1 },
  { id: "L8-J23", type: "trans", prompt: "精神医学は興味深いですが、難しいこともあります。", answer: "Psychiatry is interesting, but sometimes it's difficult.", lesson: 8, hint: "精神医学は？", note: "psychology（心理学）と区別する", tag: "語彙", priority: 2 },
  { id: "L8-J25", type: "trans", prompt: "いえ、ほかに予定はありません。", answer: "No, I don't have any other plans.", lesson: 8, hint: "not + any", note: "No, I don't. だけでも可", tag: "否定", priority: 1 },
  { id: "L8-J26", type: "trans", prompt: "ただゆっくりしたいだけです。", answer: "I just want to relax.", lesson: 8, hint: "just の位置", note: "want の前に置く", tag: "語順", priority: 1 },
  // Lesson 8: 発音・聞き取り
  { id: "L8-P01", type: "qa", prompt: "loan と role の違いは？", answer: "loan /loʊn/ は語頭が l で舌先が上につく。role /roʊl/ は語頭が r で舌をどこにもつけない", lesson: 8, tag: "L/R", priority: 1 },
  { id: "L8-P02", type: "qa", prompt: "closing と crossing の違いは？", answer: "closing /ˈkloʊzɪŋ/ クロウズィング、crossing /ˈkrɔːsɪŋ/ クロースィング。cl と cr で意味が全く変わる", lesson: 8, tag: "L/R", priority: 1 },
  { id: "L8-P03", type: "qa", prompt: "room と loom の違いは？", answer: "room /ruːm/ は r で舌を浮かせる。loom /luːm/ は l で舌先を歯茎につける", lesson: 8, tag: "L/R", priority: 1 },
  { id: "L8-P04", type: "qa", prompt: "relax の発音は？", answer: "/rɪˈlæks/ 第2音節が強い。語頭は r", lesson: 8, tag: "アクセント", priority: 1 },
  { id: "L8-P05", type: "qa", prompt: "hot spring の発音は？", answer: "/ˌhɑːt ˈsprɪŋ/ spr の子音連続。hot stream では通じない", lesson: 8, tag: "子音連続", priority: 1 },
  { id: "L8-P06", type: "qa", prompt: "psychiatrist のアクセントは？", answer: "/saɪˈkaɪətrɪst/ 第2音節が強い。冒頭の p は無音", lesson: 8, tag: "アクセント", priority: 1 },
  { id: "L8-P07", type: "qa", prompt: "overnight のアクセントは？", answer: "/ˌoʊvərˈnaɪt/ 第3音節が強い", lesson: 8, tag: "アクセント", priority: 2 },
  { id: "L8-P08", type: "qa", prompt: "tidy の発音は？", answer: "/ˈtaɪdi/ タイディ。i は二重母音 /aɪ/", lesson: 8, tag: "母音", priority: 2 },
  { id: "L8-P09", type: "qa", prompt: "concert のアクセントは？", answer: "/ˈkɑːnsərt/ 名詞は第1音節", lesson: 8, tag: "アクセント", priority: 2 },
  { id: "L8-P10", type: "qa", prompt: "amusement park のアクセントは？", answer: "/əˈmjuːzmənt pɑːrk/ amusement は第2音節が強い", lesson: 8, tag: "アクセント", priority: 2 },
  { id: "L8-P11", type: "qa", prompt: "grandparents の発音は？", answer: "/ˈɡrænperənts/ 第1音節が強く、d はほとんど聞こえない", lesson: 8, tag: "アクセント", priority: 2 },
  { id: "L8-P12", type: "qa", prompt: "renovation のアクセントは？", answer: "/ˌrenəˈveɪʃn/ 第3音節が強い", lesson: 8, tag: "アクセント", priority: 2 },
  // Lesson 9: 穴埋め
  { id: "L9-B01", type: "blank", prompt: "I have (   ) the Eiffel Tower, but I have never gone up to the top.", answer: "visited", lesson: 9, hint: "visit の過去分詞", note: "規則動詞", priority: 1 },
  { id: "L9-B02", type: "blank", prompt: "I have never (   ) up to the top.", answer: "gone", lesson: 9, hint: "go の過去分詞", note: "go - went - gone", priority: 1 },
  { id: "L9-B03", type: "blank", prompt: "I have (   ) to the Great Wall of China.", answer: "been", lesson: 9, hint: "「行ったことがある」", note: "have been to 〜", priority: 1 },
  { id: "L9-B04", type: "blank", prompt: "I have never (   ) it to the summit.", answer: "made", lesson: 9, hint: "たどり着く", note: "make it to 〜", priority: 1 },
  { id: "L9-B05", type: "blank", prompt: "I have (   ) a tour of the Colosseum in Rome.", answer: "taken", lesson: 9, hint: "take の過去分詞", note: "take - took - taken", priority: 1 },
  { id: "L9-B06", type: "blank", prompt: "I have (   ) the pyramids of Egypt.", answer: "seen", lesson: 9, hint: "see の過去分詞", note: "see - saw - seen", priority: 1 },
  { id: "L9-B07", type: "blank", prompt: "I have never walked (   ) it.", answer: "along", lesson: 9, hint: "〜に沿って", note: "around with ではない", priority: 1 },
  { id: "L9-B08", type: "blank", prompt: "(   ) it crowded when you visited?", answer: "Was", lesson: 9, hint: "疑問文の出だし", note: "過去の be 動詞", priority: 1 },
  { id: "L9-B09", type: "blank", prompt: "The view was (   ). It was so amazing.", answer: "overwhelming", lesson: 9, hint: "圧巻", note: "良い意味でも使える", priority: 1 },
  { id: "L9-B10", type: "blank", prompt: "What (   ) \"overwhelming\" mean?", answer: "does", lesson: 9, hint: "意味を聞く定型", note: "主語は三人称単数", priority: 1 },
  { id: "L9-B11", type: "blank", prompt: "Kobe is popular (   ) Japanese tourists.", answer: "with", lesson: 9, hint: "〜に人気", note: "among でも可", priority: 1 },
  { id: "L9-B12", type: "blank", prompt: "Kobe is between the sea and the (   ).", answer: "mountains", lesson: 9, hint: "複数形", note: "六甲山系なので複数", priority: 2 },
  { id: "L9-B13", type: "blank", prompt: "Tokyo Tower is (   ) popular than Skytree.", answer: "more", lesson: 9, hint: "比較級", note: "popular は more を付ける", priority: 2 },
  { id: "L9-B14", type: "blank", prompt: "I've never been to Tokyo Tower, (   ) though I used to live nearby.", answer: "even", lesson: 9, hint: "〜なのに", note: "even though", priority: 2 },
  { id: "L9-B15", type: "blank", prompt: "I'll be working (   ) the holidays.", answer: "during", lesson: 9, hint: "〜の間", note: "through でも可", priority: 1 },
  { id: "L9-B16", type: "blank", prompt: "I had a meeting (   ) my wife about the renovation.", answer: "with", lesson: 9, hint: "誰と", note: "with → about の順", priority: 2 },
  { id: "L9-B17", type: "blank", prompt: "No, I (   ). I have never climbed Mount Fuji.", answer: "haven't", lesson: 9, hint: "Have you 〜? への短い答え", note: "have の否定", priority: 1 },
  // Lesson 9: 誤文訂正
  { id: "L9-C01", type: "correct", prompt: "Almost today's task is finished.", answer: "I've almost finished today's work.", lesson: 9, hint: "語順", note: "almost は動詞の前。「ほぼ終えた」は現在完了", priority: 2 },
  { id: "L9-C02", type: "correct", prompt: "I had a meeting with we meeting about renovation.", answer: "I had a meeting with the renovation staff and my wife about renovating my house.", lesson: 9, hint: "with(誰と)→about(何を)", note: "打ち合わせの報告は a meeting with 〜 about 〜 の型", priority: 1 },
  { id: "L9-C03", type: "correct", prompt: "I forgot that things.", answer: "I forgot about that.", lesson: 9, hint: "forgot の後に前置詞", note: "forget about 〜。things は不要", priority: 1 },
  { id: "L9-C04", type: "correct", prompt: "My work is running holiday, too.", answer: "I'll be working during the holidays, too.", lesson: 9, hint: "主語を I に", note: "「連休も仕事」は I'll be working during/through the holidays", priority: 1 },
  { id: "L9-C05", type: "correct", prompt: "I have taking a tour of the Colosseum.", answer: "I have taken a tour of the Colosseum.", lesson: 9, hint: "have の後は？", note: "現在完了は have＋過去分詞。-ing にしない。今回最多の誤り", priority: 1 },
  { id: "L9-C06", type: "correct", prompt: "I have seeing the pyramids of Egypt.", answer: "I have seen the pyramids of Egypt.", lesson: 9, hint: "see の過去分詞", note: "see - saw - seen", priority: 1 },
  { id: "L9-C07", type: "correct", prompt: "I have climb to Mount Fuji.", answer: "I have climbed Mount Fuji.", lesson: 9, hint: "to が余計", note: "climb は他動詞。climb Mount Fuji", priority: 1 },
  { id: "L9-C08", type: "correct", prompt: "I have never going up to the top.", answer: "I have never gone up to the top.", lesson: 9, hint: "go の過去分詞", note: "go - went - gone。今日のキーフレーズ", priority: 1 },
  { id: "L9-C09", type: "correct", prompt: "I have never walked around with it.", answer: "I have never walked along it.", lesson: 9, hint: "「〜に沿って」", note: "walk along 〜。around with は「連れて歩く」に聞こえる", priority: 1 },
  { id: "L9-C10", type: "correct", prompt: "I have never go to the summit.", answer: "I have never made it to the summit.", lesson: 9, hint: "made it を使う", note: "make it to 〜＝たどり着く。gone to でも可", priority: 1 },
  { id: "L9-C11", type: "correct", prompt: "I have never practiced Mount Fuji.", answer: "I have never climbed Mount Fuji.", lesson: 9, hint: "動詞の選択", note: "practice は練習する。山は climb", priority: 1 },
  { id: "L9-C12", type: "correct", prompt: "What do you mean the word by overwhelming?", answer: "What does \"overwhelming\" mean?", lesson: 9, hint: "主語は単語", note: "意味を聞く定型は What does 〜 mean? 今回2回出た", priority: 1 },
  { id: "L9-C13", type: "correct", prompt: "Why use sentence by \"made it\"?", answer: "Why do we say \"made it to the summit\"?", lesson: 9, hint: "疑問文の形", note: "Why do we say 〜? で理由を聞く", priority: 2 },
  { id: "L9-C14", type: "correct", prompt: "I have entered the Empire State to be in US.", answer: "I have been to the Empire State Building in New York.", lesson: 9, hint: "建物名を最後まで", note: "Empire State Building。in the U.S. か都市名で", priority: 1 },
  { id: "L9-C15", type: "correct", prompt: "It was crowded when you visited.（質問として）", answer: "Was it crowded when you visited?", lesson: 9, hint: "疑問文は Was から", note: "講師の One more は「もう一回」の合図", priority: 1 },
  { id: "L9-C16", type: "correct", prompt: "What about Great Wall of China?", answer: "What about the Great Wall of China?", lesson: 9, hint: "冠詞", note: "固有の建造物には the", priority: 2 },
  { id: "L9-C17", type: "correct", prompt: "I have visited Sky Street in Japan.", answer: "I have been to Tokyo Skytree.", lesson: 9, hint: "名前が違う", note: "Tokyo Skytree。tree の語尾まで", priority: 1 },
  { id: "L9-C18", type: "correct", prompt: "Though I live near.", answer: "…even though I used to live nearby.", lesson: 9, hint: "今は住んでいない", note: "「〜なのに」は even though。過去の習慣は used to", priority: 2 },
  { id: "L9-C19", type: "correct", prompt: "More popular tower is Tokyo Tower.", answer: "Tokyo Tower is more popular.", lesson: 9, hint: "主語を先に", note: "比較級は 主語＋is more 〜", priority: 2 },
  { id: "L9-C20", type: "correct", prompt: "My town is between sea and mountain.", answer: "My city is between the sea and the mountains.", lesson: 9, hint: "冠詞と複数形", note: "the sea / the mountains", priority: 1 },
  { id: "L9-C21", type: "correct", prompt: "Kobe is not popular in foreign tourists.", answer: "Kobe is not so popular with foreign tourists.", lesson: 9, hint: "popular の後の前置詞", note: "popular with / among 〜", priority: 1 },
  { id: "L9-C22", type: "correct", prompt: "It's overwhelming because many many colorful inside.", answer: "It was overwhelming because the inside was so colorful.", lesson: 9, hint: "because の後は文", note: "because＋主語＋動詞。過去の話なので was", priority: 1 },
  { id: "L9-C23", type: "correct", prompt: "I don't say…", answer: "I don't know how to say it.", lesson: 9, hint: "「何と言えば」", note: "How can I put it… も可", priority: 1 },
  { id: "L9-C24", type: "correct", prompt: "Rate this.（言い直しの合図）", answer: "I mean, …", lesson: 9, hint: "言い直しの定型", note: "I mean, / Let me say it again.", priority: 2 },
  { id: "L9-C25", type: "correct", prompt: "I enjoy high praise.", answer: "I enjoy high places.", lesson: 9, hint: "発音で別の単語に", note: "places の pl をはっきり。praise は「称賛」", priority: 2 },
  // Lesson 9: 和文英訳
  { id: "L9-J01", type: "trans", prompt: "今日の仕事はほぼ終わりました。", answer: "I've almost finished today's work.", lesson: 9, hint: "現在完了＋almost", note: "almost は have と finished の間", priority: 2 },
  { id: "L9-J02", type: "trans", prompt: "業者と妻と、家のリフォームについて打ち合わせをしました。", answer: "I had a meeting with the contractor and my wife about renovating our house.", lesson: 9, hint: "with 〜 about 〜", note: "contractor＝工事業者", priority: 1 },
  { id: "L9-J03", type: "trans", prompt: "あ、それ忘れてました。", answer: "Oh, I forgot about that.", lesson: 9, hint: "forget about", note: "that だけで受ける", priority: 1 },
  { id: "L9-J04", type: "trans", prompt: "連休中もずっと仕事です。", answer: "I'll be working through the holidays.", lesson: 9, hint: "through＝〜の間ずっと", note: "during でも可", priority: 1 },
  { id: "L9-J05", type: "trans", prompt: "有名な観光地に行ったことはありますか？", answer: "Have you ever visited any famous tourist attractions?", lesson: 9, hint: "Have you ever 〜?", note: "tourist attraction＝観光地", priority: 1 },
  { id: "L9-J06", type: "trans", prompt: "パリのエッフェル塔に行ったことはありますが、頂上まで上がったことはありません。", answer: "I have visited the Eiffel Tower in Paris, but I have never gone up to the top.", lesson: 9, hint: "今日のキーフレーズ", note: "visited / gone の2つの過去分詞", priority: 1 },
  { id: "L9-J07", type: "trans", prompt: "万里の長城に行ったことがあります。", answer: "I have been to the Great Wall of China.", lesson: 9, hint: "have been to 〜", note: "「行ったことがある」は been to", priority: 1 },
  { id: "L9-J08", type: "trans", prompt: "行ったときは混んでいましたか？", answer: "Was it crowded when you visited?", lesson: 9, hint: "Was it 〜?", note: "crowded / busy", priority: 1 },
  { id: "L9-J09", type: "trans", prompt: "かなり混んでいましたが、塔はきれいでした。", answer: "It was quite busy, but the tower was beautiful.", lesson: 9, hint: "quite＝かなり", note: "busy＝crowded", priority: 2 },
  { id: "L9-J10", type: "trans", prompt: "富士山に登ったことはありますが、山頂までたどり着いたことはありません。", answer: "I have climbed Mount Fuji, but I have never made it to the summit.", lesson: 9, hint: "made it to", note: "summit＝山頂", priority: 1 },
  { id: "L9-J11", type: "trans", prompt: "ローマのコロッセオを見学したことがありますが、ライブを見たことはありません。", answer: "I have taken a tour of the Colosseum in Rome, but I have never seen a live performance there.", lesson: 9, hint: "taken / seen", note: "take a tour of 〜＝見学する", priority: 1 },
  { id: "L9-J12", type: "trans", prompt: "ヨーロッパには行ったことがありますが、スイスとポルトガルには行ったことがありません。", answer: "I have visited Europe, but I have never been to Switzerland or Portugal.", lesson: 9, hint: "否定文では or", note: "never 〜 A or B", priority: 2 },
  { id: "L9-J13", type: "trans", prompt: "「made it」はどういう意味ですか？", answer: "What does \"made it\" mean?", lesson: 9, hint: "What does 〜 mean?", note: "意味を聞く定型", priority: 1 },
  { id: "L9-J14", type: "trans", prompt: "いいえ、富士山に登ったことはありません。", answer: "No, I haven't. I have never climbed Mount Fuji.", lesson: 9, hint: "短い答え＋補足", note: "Have you 〜? には haven't で答える", priority: 1 },
  { id: "L9-J15", type: "trans", prompt: "その景色は圧巻でした。", answer: "The view was overwhelming.", lesson: 9, hint: "良い意味の overwhelming", note: "amazing でも可", priority: 1 },
  { id: "L9-J16", type: "trans", prompt: "最近仕事が多すぎて手に負えません。", answer: "My work is overwhelming these days.", lesson: 9, hint: "悪い意味の overwhelming", note: "too much のニュアンス", priority: 1 },
  { id: "L9-J17", type: "trans", prompt: "今日は患者さんの数がとても多かった。", answer: "The number of patients was overwhelming today.", lesson: 9, hint: "overwhelming の応用", note: "仕事で使える例", priority: 3 },
  { id: "L9-J18", type: "trans", prompt: "ニューヨークのエンパイア・ステート・ビルに行ったことがあります。", answer: "I have been to the Empire State Building in New York.", lesson: 9, hint: "建物名", note: "in New York で具体的に", priority: 1 },
  { id: "L9-J19", type: "trans", prompt: "展望台からの眺めは最高でした。", answer: "The view from the observation deck was amazing.", lesson: 9, hint: "observation deck", note: "展望台の定番語", priority: 2 },
  { id: "L9-J20", type: "trans", prompt: "アメリカのアンテロープ・キャニオンに行ったことがあります。", answer: "I have been to Antelope Canyon in the U.S.", lesson: 9, hint: "the U.S.", note: "冠詞 the を忘れない", priority: 2 },
  { id: "L9-J21", type: "trans", prompt: "東京スカイツリーには行ったことがありますが、東京タワーには行ったことがありません。", answer: "I've been to Tokyo Skytree, but I've never been to Tokyo Tower.", lesson: 9, hint: "been to の対比", note: "短縮形 I've で流れよく", priority: 1 },
  { id: "L9-J22", type: "trans", prompt: "高いところは好きです。景色がきれいだから。", answer: "I like high places because the view is beautiful.", lesson: 9, hint: "high places", note: "because で一文に", priority: 1 },
  { id: "L9-J23", type: "trans", prompt: "近くに住んでいたのに、行ったことがありません。", answer: "I've never been there, even though I used to live nearby.", lesson: 9, hint: "even though＋used to", note: "「〜なのに」", priority: 2 },
  { id: "L9-J24", type: "trans", prompt: "東京タワーのほうが有名ですが、スカイツリーのほうが新しくて高いです。", answer: "Tokyo Tower is more famous, but Skytree is newer and taller.", lesson: 9, hint: "比較級2種", note: "more famous / newer / taller", priority: 2 },
  { id: "L9-J25", type: "trans", prompt: "私の地域の有名なランドマークは神戸ポートタワーです。", answer: "A famous landmark in my area is Kobe Port Tower.", lesson: 9, hint: "地元の固有名詞を用意", note: "Mount Rokko / Meriken Park も", priority: 1 },
  { id: "L9-J26", type: "trans", prompt: "神戸は海と山の間にあります。", answer: "Kobe is located between the sea and the mountains.", lesson: 9, hint: "be located", note: "the を2つ、mountains は複数", priority: 1 },
  { id: "L9-J27", type: "trans", prompt: "神戸は外国人観光客にはあまり人気がありませんが、日本人観光客には人気です。", answer: "Kobe is not so popular with foreign tourists, but it's popular with Japanese tourists.", lesson: 9, hint: "popular with", note: "not so で柔らかく", priority: 1 },
  { id: "L9-J28", type: "trans", prompt: "バルセロナのあの有名な教会は何という名前でしたっけ？", answer: "What's that famous church in Barcelona called?", lesson: 9, hint: "What's 〜 called?", note: "国より都市と種類で聞くと通じやすい", priority: 2 },
  { id: "L9-J29", type: "trans", prompt: "サグラダ・ファミリアに行ったことはありますが、頂上まで上がったことはありません。", answer: "I have visited the Sagrada Familia, but I have never gone up to the top.", lesson: 9, hint: "今日の核", note: "gone up to the top", priority: 1 },
  { id: "L9-J30", type: "trans", prompt: "中がとてもカラフルで圧倒されました。", answer: "It was overwhelming because the inside was so colorful.", lesson: 9, hint: "because の後は文", note: "the colorful stained glass でも", priority: 1 },
  { id: "L9-J31", type: "trans", prompt: "何と言えばいいか分かりません。", answer: "I don't know how to say it.", lesson: 9, hint: "how to 〜", note: "How can I put it… も可", priority: 1 },
  { id: "L9-J32", type: "trans", prompt: "えっと、言い直します。", answer: "I mean, …", lesson: 9, hint: "言い直しの合図", note: "Let me say it again. も可", priority: 1 },
  { id: "L9-J33", type: "trans", prompt: "フィードバックありがとうございます。また次回。", answer: "Thank you for the feedback. See you next time!", lesson: 9, hint: "締めの一言", note: "Thank you だけで終わらせない", priority: 2 },
  // Lesson 9: 発音・聞き取り
  { id: "L9-P01", type: "qa", prompt: "Wall と Ball の違いは？", answer: "wall /wɔːl/ は唇を丸めて w から。ball /bɔːl/ は唇を閉じて破裂させる", lesson: 9, hint: "唇の形", note: "Great Wall が Great Ball に聞こえた", priority: 1 },
  { id: "L9-P02", type: "qa", prompt: "Egypt の発音は？", answer: "/ˈiːdʒɪpt/ イージプト。第1音節を伸ばす", lesson: 9, hint: "exit にならない", note: "カタカナの「エジプト」とずれる", priority: 1 },
  { id: "L9-P03", type: "qa", prompt: "places と praise の違いは？", answer: "places /ˈpleɪsɪz/ は l で舌先を歯茎に。praise /preɪz/ は r で舌をつけない", lesson: 9, hint: "l と r", note: "high places が high praise に聞こえた", priority: 1 },
  { id: "L9-P04", type: "qa", prompt: "busy の発音は？", answer: "/ˈbɪzi/ ビズィ。u だが「ビ」", lesson: 9, hint: "つづりに引きずられない", note: "business も同じ", priority: 1 },
  { id: "L9-P05", type: "qa", prompt: "sunny の発音は？", answer: "/ˈsʌni/ サニー。u は「ア」に近い", lesson: 9, hint: "短く「サ」", note: "sun / fun と同じ母音", priority: 2 },
  { id: "L9-P06", type: "qa", prompt: "Skytree の発音は？", answer: "/ˈskaɪtriː/ スカイトゥリー。tree の tr を続けて", lesson: 9, hint: "Street にならない", note: "tree と street は別の音", priority: 1 },

  { id: "L11-C04", type: "correct", prompt: "The coffee is too hot to drink.（過去の話）", answer: "The coffee was too hot to drink.", lesson: 11, hint: "時制", note: "is で言い始めた", tag: "too/enough", priority: 2 },

  { id: "L11-C14", type: "correct", prompt: "I leave that house since next year.", answer: "I'll move into the house next year.", lesson: 11, hint: "未来と since", note: "since は過去の起点。引っ越すのは move into", tag: "時制", priority: 1 },

  // Lesson 11: 和文英訳
  { id: "L11-J01", type: "trans", prompt: "アメリカへ移動中、飛行機の中でトップガン2を見ました。とてもワクワクしました。", answer: "I watched Top Gun 2 while I was on the plane to the US. It was very exciting.", lesson: 11, hint: "while I was on the plane", note: "瞬間チャレンジの文。I have watched と言った", tag: "映画の話", priority: 1 },

  { id: "L11-J12", type: "trans", prompt: "工事は来月初めに始まる見込みです。", answer: "Construction is expected to begin early next month.", lesson: 11, hint: "be expected to", note: "early を and in と言った", tag: "速読", priority: 1 },
  { id: "L11-J13", type: "trans", prompt: "交通の乱れを引き起こす可能性が高いです。", answer: "It will likely cause some traffic disruptions.", lesson: 11, hint: "will likely", note: "cause＝引き起こす。意味が取れなかった文", tag: "速読", priority: 1 },
