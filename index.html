  // Lesson EC1027: 穴埋め
  { id: "EC1027-24", type: "blank", prompt: "Starting (   ) 15, the Route 24 bus service will undergo significant changes.", answer: "August", lesson: "EC1027", hint: "月の名前", note: "「1月15日」と聞き取った（数字・日付の聞き取り）", tag: "速読リスニング", priority: 1 },
  { id: "EC1027-25", type: "blank", prompt: "We urge all passengers to review the updated schedule on our website to plan your trips (   ).", answer: "accordingly", lesson: "EC1027", hint: "それに合わせて", tag: "速読リスニング", priority: 1 },
  // Lesson EC1027: 誤文訂正
  { id: "EC1027-26", type: "correct", prompt: "These changes are part of our commitment to provide reliable transportation.", answer: "These changes are part of our commitment to providing reliable transportation.", lesson: "EC1027", hint: "commitment to の to は前置詞", note: "to の後に動詞の原形を入れてしまった", tag: "速読リスニング", priority: 1 },
  { id: "EC1027-27", type: "correct", prompt: "The changes will help us better service the community.", answer: "The changes will help us better serve the community.", lesson: "EC1027", hint: "動詞が必要", note: "service は名詞。serve＝役立つ・仕える", tag: "速読リスニング", priority: 1 },
  { id: "EC1027-28", type: "correct", prompt: "reliable and efficient transportation on our city", answer: "reliable and efficient transportation for our city", lesson: "EC1027", hint: "前置詞", note: "on と言った", tag: "速読リスニング", priority: 1 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-29", type: "trans", prompt: "あなたの公共交通の体験を改善するにあたり、ご理解に感謝します。", answer: "Thank you for your understanding as we improve your public transit experience.", lesson: "EC1027", hint: "as＝〜するにあたって", note: "as の訳で止まった", tag: "速読リスニング", priority: 1 },
  { id: "EC1027-30", type: "trans", prompt: "全ての乗客の皆さまに、ウェブサイトで最新の時刻表をご確認いただくようお願いします。", answer: "We urge all passengers to review the updated schedule on our website.", lesson: "EC1027", hint: "urge 人 to do", note: "review を「評価する」と訳した→ここは「確認する」", tag: "速読リスニング", priority: 1 },
  // Lesson EC1027: 穴埋め
  { id: "EC1027-31", type: "blank", prompt: "The new route will now include stops at Riverside Hospital, enhancing access to (   ) services.", answer: "essential", lesson: "EC1027", hint: "不可欠な", note: "educational / exceptional と言い間違えた", tag: "速読リスニング", priority: 1 },
  { id: "EC1027-32", type: "blank", prompt: "(   ) frequency during peak hours to reduce wait times.", answer: "Increased", lesson: "EC1027", hint: "過去分詞", note: "Increasing と言った", tag: "速読リスニング", priority: 2 },
  { id: "EC1027-33", type: "blank", prompt: "(   ) service hours on weekends.", answer: "Extended", lesson: "EC1027", hint: "過去分詞", note: "Extend と言った", tag: "速読リスニング", priority: 2 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-34", type: "trans", prompt: "年次戦略会議にご参加いただきたく、謹んでご案内申し上げます。", answer: "You are cordially invited to participate in our annual strategy meeting.", lesson: "EC1027", hint: "cordially＝心から", note: "calling in to invite / Turkey meeting と崩れた", tag: "シャドーイング", priority: 1 },
  // Lesson EC1027: 穴埋め
  { id: "EC1027-35", type: "blank", prompt: "(   ) and refreshments will be provided.", answer: "Lunch", lesson: "EC1027", hint: "食事", note: "Functional と崩れた", tag: "シャドーイング", priority: 2 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-36", type: "trans", prompt: "サラを担当にしようと考えていた。", answer: "I was thinking about putting Sarah in charge.", lesson: "EC1027", hint: "put 人 in charge", note: "including と言い換わった", tag: "シャドーイング", priority: 1 },
  { id: "EC1027-37", type: "trans", prompt: "彼女は今かなり忙しいので心配です。", answer: "I'm concerned because she is quite busy at the moment.", lesson: "EC1027", hint: "be concerned", note: "it's my leisure と崩れた", tag: "シャドーイング", priority: 1 },
  { id: "EC1027-38", type: "trans", prompt: "彼は最近のプロジェクトでよくやったし、今ならもっと仕事を引き受けられる。", answer: "He's done a great job on his recent projects and can take on more tasks now.", lesson: "EC1027", hint: "take on＝引き受ける", note: "a discrete research project と崩れた", tag: "シャドーイング", priority: 1 },
  { id: "EC1027-39", type: "trans", prompt: "彼にキャンペーンを率いてもらおう。", answer: "Let's assign him to lead the campaign.", lesson: "EC1027", hint: "assign 人 to do", note: "lead を read と言った", tag: "シャドーイング", priority: 2 },
  { id: "EC1027-40", type: "trans", prompt: "一番近い薬局はどこか教えてもらえますか？", answer: "Could you tell me where the nearest pharmacy is?", lesson: "EC1027", hint: "間接疑問", note: "Can you と言った", tag: "シャドーイング", priority: 2 },
  { id: "EC1027-41", type: "trans", prompt: "なぜこのキャリアを選んだのですか？", answer: "Why did you choose this career path?", lesson: "EC1027", hint: "career path", note: "聞き取れず別の文になった", tag: "シャドーイング", priority: 1 },
  // Lesson EC1027: 誤文訂正
  { id: "EC1027-42", type: "correct", prompt: "She give up.", answer: "She gave up.", lesson: "EC1027", hint: "過去形", note: "瞬間英作文で詰まった（持ち越し）", tag: "瞬間英作文", priority: 2 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-43", type: "trans", prompt: "空を見上げると、ボブはUFOを見た。", answer: "Looking up at the sky, Bob saw a UFO.", lesson: "EC1027", hint: "-ingで始める", tag: "分詞構文", priority: 2 },
  { id: "EC1027-44", type: "trans", prompt: "トムはサッカーをしていて脚をけがした。", answer: "Tom hurt his leg playing soccer.", lesson: "EC1027", hint: "hurt の過去形は hurt", note: "hurt を heard と発音", tag: "分詞構文", priority: 1 },
  { id: "EC1027-45", type: "trans", prompt: "気分が悪かったので、早く寝た。", answer: "Feeling sick, I went to bed early.", lesson: "EC1027", note: "went go と言った", tag: "分詞構文", priority: 2 },
  { id: "EC1027-46", type: "trans", prompt: "彼女は何もせずにそこに立っていた。", answer: "She was standing there, doing nothing.", lesson: "EC1027", hint: "付帯状況「〜しながら」", note: "「立っている時、何もしなかった」と訳した", tag: "分詞構文", priority: 2 },
  // Lesson EC1027: 誤文訂正
  { id: "EC1027-47", type: "correct", prompt: "I feel asleep reading a book.", answer: "I fell asleep reading a book.", lesson: "EC1027", hint: "fall の過去形", note: "何度も feel と言った", tag: "分詞構文", priority: 1 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-48", type: "trans", prompt: "彼は叫びながら部屋を飛び出した。", answer: "He ran out of the room, shouting.", lesson: "EC1027", note: "She / shall we と崩れた", tag: "分詞構文", priority: 2 },
  { id: "EC1027-49", type: "trans", prompt: "車を持っていないので、電車で通勤している。", answer: "Not having a car, I take the train to work.", lesson: "EC1027", hint: "否定は Not を先頭に", note: "現在の習慣（訳で過去形にした）", tag: "分詞構文", priority: 2 },
  // Lesson EC1027: 誤文訂正
  { id: "EC1027-50", type: "correct", prompt: "Seeing from the outside, this house looks nice.", answer: "Seen from the outside, this house looks nice.", lesson: "EC1027", hint: "家は「見られる」側", note: "受け身→過去分詞", tag: "分詞構文", priority: 1 },
  { id: "EC1027-51", type: "correct", prompt: "Reading in simple English, the book is easy to read.", answer: "Written in simple English, the book is easy to read.", lesson: "EC1027", hint: "本は「書かれる」側", note: "受け身→過去分詞", tag: "分詞構文", priority: 1 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-52", type: "trans", prompt: "外国人なので、彼女はビザが必要だ。", answer: "Being a foreigner, she needs a visa.", lesson: "EC1027", hint: "Being＋名詞", note: "foreigner を「旅行者」と訳した", tag: "分詞構文", priority: 1 },
  // Lesson EC1027: 誤文訂正
  { id: "EC1027-53", type: "correct", prompt: "Seeing the message, she made a call phone to her mother.", answer: "Seeing the message, she made a phone call to her mother.", lesson: "EC1027", hint: "語順", note: "call phone と言った", tag: "分詞構文", priority: 1 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-54", type: "trans", prompt: "とてもお腹が空いていたので、ハンバーガーを2つ食べた。", answer: "Being very hungry, I ate two hamburgers.", lesson: "EC1027", hint: "Being＋形容詞", tag: "分詞構文", priority: 3 },
  { id: "EC1027-55", type: "trans", prompt: "疲れていたので、早く寝た。", answer: "Feeling tired, I went to bed early.", lesson: "EC1027", tag: "分詞構文", priority: 3 },
  { id: "EC1027-56", type: "trans", prompt: "バッグの中にリンゴが2つある。", answer: "There are two apples in the bag.", lesson: "EC1027", hint: "複数→are", note: "bag を back / box と言った", tag: "There is/are", priority: 2 },
  { id: "EC1027-57", type: "trans", prompt: "新着メールが5件ある。", answer: "There are five new emails.", lesson: "EC1027", note: "mayonnaise / mimes と崩れた", tag: "There is/are", priority: 1 },
  // Lesson EC1027: 穴埋め
  { id: "EC1027-58", type: "blank", prompt: "There (   ) some milk in the glass.", answer: "is", lesson: "EC1027", hint: "milk は数えられない", note: "不可算名詞は is＋some", tag: "There is/are", priority: 2 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-59", type: "trans", prompt: "今日の午後、電話会議がある。", answer: "There is a conference call this afternoon.", lesson: "EC1027", hint: "conference call", note: "「会議」と訳しかけた。call＝電話", tag: "There is/are", priority: 1 },
  { id: "EC1027-60", type: "trans", prompt: "通りに数台の車が止まっている。", answer: "There are several cars parked on the street.", lesson: "EC1027", hint: "parked＝止められた", note: "parked を backed / could do と言った", tag: "There is/are", priority: 1 },
  { id: "EC1027-61", type: "trans", prompt: "計画にいくつか変更がある。", answer: "There are a few changes to the plan.", lesson: "EC1027", hint: "a few", note: "huge changes to the project と言った", tag: "There is/are", priority: 1 },
  // Lesson EC1027: 穴埋め
  { id: "EC1027-62", type: "blank", prompt: "There (   ) a problem with the printer.", answer: "is", lesson: "EC1027", tag: "There is/are", priority: 3 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-63", type: "trans", prompt: "デスクの上に書類がいくつかある。", answer: "There are some documents on your desk.", lesson: "EC1027", tag: "There is/are", priority: 3 },
  { id: "EC1027-64", type: "trans", prompt: "2階に会議室がある。", answer: "There is a meeting room on the second floor.", lesson: "EC1027", tag: "There is/are", priority: 3 },
  { id: "EC1027-65", type: "trans", prompt: "もしご迷惑でなければ、少し待っていただけますか？", answer: "If it's not too much trouble, could you wait a moment, please?", lesson: "EC1027", hint: "trouble", note: "trouble を travel と言った", tag: "依頼表現", priority: 1 },
  { id: "EC1027-66", type: "trans", prompt: "もう一度言っていただけますか？", answer: "Could you say that again?", lesson: "EC1027", tag: "依頼表現", priority: 3 },
  { id: "EC1027-67", type: "trans", prompt: "私は友人に誠実さを求める。", answer: "I look for honesty in a friend.", lesson: "EC1027", hint: "look for", tag: "スピーチ", priority: 3 },
  { id: "EC1027-68", type: "trans", prompt: "相手が誠実でなければ、信頼できない。", answer: "If the other person isn't honest, I can't trust them.", lesson: "EC1027", hint: "honest", note: "honest が出ずに止まった", tag: "スピーチ", priority: 1 },
  { id: "EC1027-69", type: "trans", prompt: "一緒にいて楽しい人を求める。", answer: "I look for someone I can have fun with.", lesson: "EC1027", hint: "have fun with", note: "enjoyable の繰り返しで止まった", tag: "スピーチ", priority: 1 },
  { id: "EC1027-70", type: "trans", prompt: "私たちは同じことに興味がある。", answer: "We share the same interests.", lesson: "EC1027", hint: "share / be interested in", note: "interest が出なかった（We're interested in the same things. も可）", tag: "スピーチ", priority: 1 },
  { id: "EC1027-71", type: "trans", prompt: "テニスをしているとボールだけに集中するので、他のことを忘れられる。", answer: "When I play tennis, I can forget about other things because I focus only on the ball.", lesson: "EC1027", hint: "forget about", tag: "スピーチ", priority: 2 },
  { id: "EC1027-72", type: "trans", prompt: "ボールを追いかけるのが楽しい。", answer: "I enjoy chasing the ball.", lesson: "EC1027", hint: "追いかける＝chase", note: "「追いかける」が出なかった", tag: "スピーチ", priority: 1 },
  // Lesson EC1027: 誤文訂正
  { id: "EC1027-73", type: "correct", prompt: "Playing tennis helps me physically healthy.", answer: "Playing tennis helps me stay physically healthy.", lesson: "EC1027", hint: "help＋人＋動詞の原形", note: "stay / keep が抜けた", tag: "スピーチ", priority: 1 },
  { id: "EC1027-74", type: "correct", prompt: "After playing tennis, we almost go to restaurant.", answer: "After playing tennis, we usually go to a restaurant.", lesson: "EC1027", hint: "「たいてい」", note: "almost は「ほぼ・もう少しで」。冠詞 a も必要", tag: "スピーチ", priority: 1 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-75", type: "trans", prompt: "テニスの後、たまに温泉に行く。", answer: "Sometimes we go to a hot spring after tennis.", lesson: "EC1027", hint: "温泉＝hot spring", note: "「温泉」が出なかった", tag: "スピーチ", priority: 1 },
  { id: "EC1027-76", type: "trans", prompt: "実は新しいiPhoneを買った。折りたためるけど、まだ使い方がよく分からない。", answer: "Actually, I bought a new iPhone. It can fold, but I don't know how to use it well yet.", lesson: "EC1027", hint: "fold / how to use", note: "「折りたためる」が出なかった", tag: "スピーチ", priority: 1 },
  { id: "EC1027-77", type: "trans", prompt: "今、古いiPhoneから新しいiPhoneにデータを移している。", answer: "I'm transferring data from my old iPhone to my new one.", lesson: "EC1027", hint: "transfer", note: "transit / activate と言った", tag: "スピーチ", priority: 1 },
  { id: "EC1027-78", type: "trans", prompt: "特にLINEのメッセージのバックアップに気をつけている。", answer: "I'm especially careful about backing up my LINE messages.", lesson: "EC1027", hint: "be careful about -ing", note: "I careful と be動詞が抜けた", tag: "スピーチ", priority: 1 },
  // Lesson EC1027: 誤文訂正
  { id: "EC1027-79", type: "correct", prompt: "I almost die.（作業がほぼ終わったと言いたい）", answer: "I'm almost done.", lesson: "EC1027", hint: "done", note: "die / down と崩れた", tag: "スピーチ", priority: 1 },
  // Lesson EC1027: 和文英訳
  { id: "EC1027-80", type: "trans", prompt: "残りの作業が2つある。", answer: "There are two remaining steps.", lesson: "EC1027", hint: "残りの＝remaining", note: "remaining が出なかった", tag: "スピーチ", priority: 1 },
  { id: "EC1027-81", type: "trans", prompt: "アプリによっては、それぞれのiPhoneで設定し直す必要がある。", answer: "Some apps need to be set up again on each iPhone.", lesson: "EC1027", hint: "set up again", tag: "スピーチ", priority: 2 },
  { id: "EC1027-82", type: "trans", prompt: "その後、新しいiPhoneで確認する。", answer: "After that, I'll check it on the new iPhone.", lesson: "EC1027", hint: "check ... on", note: "I confirm in new iPhone と言った", tag: "スピーチ", priority: 2 },
  // Lesson EC1027: カタカナ発音
  { id: "EC1027-K01", type: "kana", prompt: "You are cordially invited", answer: "ユーア コーディアリ インヴァイティッ", lesson: "EC1027", hint: "cordially＝コーディアリ", note: "calling in と聞こえた", tag: "カタカナ発音", priority: 1 },
  { id: "EC1027-K02", type: "kana", prompt: "our annual strategy meeting", answer: "アワ アニュアォ ストラテジ ミーディン", lesson: "EC1027", hint: "annual の l は「ォ」", note: "Turkey meeting と崩れた", tag: "カタカナ発音", priority: 1 },
  { id: "EC1027-K03", type: "kana", prompt: "will be held on July 20th", answer: "ウィォビ ヘォドン ジュライ トゥエンティエス", lesson: "EC1027", hint: "held on をつなぐ", note: "harder to drive と崩れた", tag: "カタカナ発音", priority: 1 },
  { id: "EC1027-K04", type: "kana", prompt: "from 9 a.m. to 4 p.m.", answer: "フラム ナイネイエム トゥ フォーピーエム", lesson: "EC1027", hint: "nine a.m. をつなぐ", note: "40 a.m. と崩れた", tag: "カタカナ発音", priority: 1 },
  { id: "EC1027-K05", type: "kana", prompt: "Lunch and refreshments", answer: "ランチャン リフレッシュメンツ", lesson: "EC1027", hint: "and は「アン」", note: "Functional と崩れた", tag: "カタカナ発音", priority: 2 },
  { id: "EC1027-K06", type: "kana", prompt: "putting Sarah in charge", answer: "プディン セアラ インチャージ", lesson: "EC1027", hint: "t が「ディ」に", tag: "カタカナ発音", priority: 1 },
  { id: "EC1027-K07", type: "kana", prompt: "take on more tasks", answer: "テイコン モア タスクス", lesson: "EC1027", hint: "take on →テイコン", tag: "カタカナ発音", priority: 1 },
  { id: "EC1027-K08", type: "kana", prompt: "will undergo significant changes", answer: "ウィォ アンダゴウ スィグニフィカン チェインジズ", lesson: "EC1027", hint: "will は「ウィォ」と弱い", note: "We undergo / update と崩れた", tag: "カタカナ発音", priority: 1 },
  { id: "EC1027-K09", type: "kana", prompt: "to better serve the community", answer: "トゥ ベラ サーヴ ザ カミュニティ", lesson: "EC1027", hint: "better の t が「ラ」", note: "service と言った", tag: "カタカナ発音", priority: 1 },
  { id: "EC1027-K10", type: "kana", prompt: "include stops at", answer: "インクルーッ スタプサッ", lesson: "EC1027", hint: "stops at をつなぐ", note: "slopes / topics と崩れた", tag: "カタカナ発音", priority: 1 },
  { id: "EC1027-K11", type: "kana", prompt: "We urge all passengers", answer: "ウィ アージ オーォ パッセンジャーズ", lesson: "EC1027", hint: "urge all をつなぐ", note: "We are the old と聞こえた", tag: "カタカナ発音", priority: 1 },

  { id: "EC1112-28", type: "trans", prompt: "どれくらい早くこれを解決できますか？", answer: "How quickly can you resolve this?", lesson: "EC1112", hint: "How＋副詞＋疑問文", note: "語順がしっくりこなかった", tag: "リスニング", priority: 2 },
  { id: "EC1112-29", type: "trans", prompt: "こういうことが起こるのは分かっています。", answer: "I understand that these things happen.", lesson: "EC1112", hint: "these things", note: "「that is things」と崩れた", tag: "リスニング", priority: 1 },
  // Lesson EC1112: カタカナ発音
  { id: "EC1112-30", type: "kana", prompt: "these things happen", answer: "ディーズ[スィ]ングズ[ハ]プン", lesson: "EC1112", hint: "th の連続", note: "「that is things」と聞こえた", tag: "リスニング", priority: 1 },
  { id: "EC1112-31", type: "kana", prompt: "There's been a delay", answer: "ゼアズビナ ディ[レ]イ", lesson: "EC1112", hint: "been a が連結", note: "「This been」「This have」と崩れた", tag: "リスニング", priority: 1 },
  { id: "EC1112-32", type: "kana", prompt: "due to unexpected", answer: "デュートゥ アネクス[ペ]クティッド", lesson: "EC1112", hint: "due の後すぐ to", note: "間が空いた", tag: "リスニング", priority: 2 },
  { id: "EC1112-33", type: "kana", prompt: "affecting our transport routes", answer: "ア[フェ]クティナ トランスポート[ル]ーツ", lesson: "EC1112", hint: "affecting our が連結", note: "「affections of」と崩れた", tag: "リスニング", priority: 1 },
  { id: "EC1112-34", type: "kana", prompt: "ensure it arrives", answer: "インシュアリッタ[ラ]イヴズ", lesson: "EC1112", hint: "3語がつながる", note: "arrives が出なかった", tag: "リスニング", priority: 1 },
  { id: "EC1112-35", type: "kana", prompt: "as soon as it is dispatched", answer: "アズ[スー]ナズイティズ ディス[パ]ッチト", lesson: "EC1112", hint: "soon as が連結", note: "「as soon as it's…」で止まった", tag: "リスニング", priority: 2 },
  // Lesson EC1112: 誤文訂正
  { id: "EC1112-36", type: "correct", prompt: "I need these materials for my upcoming construction project.（初出の話）", answer: "I need these materials for an upcoming construction project.", lesson: "EC1112", hint: "冠詞", note: "my／無冠詞になった", tag: "リスニング", priority: 2 },
  { id: "EC1112-37", type: "correct", prompt: "We are walking to clear the backlog.", answer: "We are working to clear the backlog.", lesson: "EC1112", hint: "work と walk", note: "音読でも walking と言った", tag: "リスニング", priority: 1 },
  // Lesson EC1112: カタカナ発音
  { id: "EC1112-38", type: "kana", prompt: "work / walk", answer: "work＝[ワ〜]ク（口は半開きでこもる）／walk＝[ウォー]ク（口を縦に開く・Lは読まない）", lesson: "EC1112", hint: "綴りと音が逆に感じる", note: "毎回逆に言ってしまう癖", tag: "発音", priority: 1 },
  // Lesson EC1112: 和文英訳
  { id: "EC1112-39", type: "trans", prompt: "遅延の原因は何ですか？―予期せぬ天候です。", answer: "The delay is due to unexpected weather conditions.", lesson: "EC1112", hint: "due to", note: "短く答えるなら Unexpected weather conditions. でもOK", tag: "Q&A", priority: 2 },
  { id: "EC1112-40", type: "trans", prompt: "彼女は遅くとも明日の朝までに注文が発送されると見込んでいる。", answer: "She expects the order to be dispatched by tomorrow morning at the latest.", lesson: "EC1112", hint: "expect O to be 過去分詞", note: "答えの形が作れなかった", tag: "Q&A", priority: 1 },
  { id: "EC1112-41", type: "trans", prompt: "彼は注文品の発送の遅れについて電話した。", answer: "He called about the delay in shipping his order.", lesson: "EC1112", hint: "call about ～／delay in ～ing", note: "「asked to see about his sipping」と崩れた。call about＝「〜の件で電話する」（asked to see about だと「確認を頼んだ」になる）。delay の後は in が定番（of にしない）。ship＝発送する。別の言い方：He called about the delayed shipment of his order. ／ He called because his order hadn't shipped yet.", tag: "リテル", priority: 1 },
  // Lesson EC1112: カタカナ発音
  { id: "EC1112-42", type: "kana", prompt: "shipping", answer: "[シ]ッピング", lesson: "EC1112", hint: "sh は唇を丸める", note: "sipping（すする）になっていた。sh は唇を少し突き出して「シュ」。s のままだと「スィッピング」で意味が変わる", tag: "リテル", priority: 1 },
  // Lesson EC1112: 誤文訂正
  { id: "EC1112-43", type: "correct", prompt: "He require to dispatch it quickly.", answer: "He asked them to dispatch it quickly.", lesson: "EC1112", hint: "ask O to do", note: "require は三単現の s と目的語が必要。迷ったら ask で", tag: "リテル", priority: 2 },
  // Lesson EC1112: 和文英訳
  { id: "EC1112-44", type: "trans", prompt: "他の国の人々と競い、彼らに勝つことを目指す。", answer: "They compete with people from other countries and aim to beat them.", lesson: "EC1112", hint: "compete with／beat", note: "「talk over them」と言った → beat", tag: "ゲーム", priority: 2 },
  { id: "EC1112-45", type: "trans", prompt: "表面にたくさんの種がついている。", answer: "There are many seeds on its surface.", lesson: "EC1112", note: "言えていた（確認用）", tag: "ゲーム", priority: 3 },
  // Lesson EC1112: 誤文訂正
  { id: "EC1112-46", type: "correct", prompt: "It's red and a little spicy.（いちごの説明）", answer: "It's red and a little sour.", lesson: "EC1112", hint: "酸っぱい", note: "spicy＝辛い。酸っぱいは sour／tart", tag: "ゲーム", priority: 1 },
  // Lesson EC1112: 和文英訳
  { id: "EC1112-47", type: "trans", prompt: "熟していないものは白っぽい緑色だ。", answer: "Unripe ones are whitish green.", lesson: "EC1112", hint: "unripe", note: "immature は人に使うことが多い", tag: "ゲーム", priority: 2 },
  { id: "EC1112-48", type: "trans", prompt: "ショートケーキによく使われる。", answer: "It's often used in shortcakes.", lesson: "EC1112", note: "言えていた（確認用）", tag: "ゲーム", priority: 3 },
  // Lesson EC1112: 誤文訂正
  { id: "EC1112-49", type: "correct", prompt: "I use of it while I working.", answer: "I use it while I'm working.", lesson: "EC1112", hint: "use は他動詞", note: "of 不要・while の後は I'm", tag: "ゲーム", priority: 1 },
  // Lesson EC1112: 和文英訳
  { id: "EC1112-50", type: "trans", prompt: "幅は約40センチで、デスクトップパソコンにつながっている。", answer: "It's about 40 centimeters wide, and it's connected to my desktop computer.", lesson: "EC1112", hint: "wide／connected to", tag: "ゲーム", priority: 2 },
  { id: "EC1112-51", type: "trans", prompt: "テンキーがついている。", answer: "It has a numeric keypad.", lesson: "EC1112", hint: "numeric", note: "「number display」と言った。テンキーは和製英語", tag: "ゲーム", priority: 1 },
  // Lesson EC1112: 誤文訂正
  { id: "EC1112-52", type: "correct", prompt: "I mistook every day.", answer: "I make mistakes every day.", lesson: "EC1112", hint: "make a mistake", note: "mistake を動詞にすると「取り違える」の意味になる", tag: "スピーチ", priority: 1 },
  // Lesson EC1112: 和文英訳
  { id: "EC1112-53", type: "trans", prompt: "短い休憩のときは、たいていコーヒーを飲む。", answer: "I usually drink coffee when I have a short break.", lesson: "EC1112", note: "「drinking while walking」と言ってお酒と誤解された", tag: "スピーチ", priority: 2 },
  { id: "EC1112-54", type: "trans", prompt: "リラックスする時間が十分になかった。", answer: "I didn't have enough time to relax.", lesson: "EC1112", tag: "スピーチ", priority: 3 },
  // Lesson EC1112: 穴埋め
  { id: "EC1112-55", type: "blank", prompt: "He called (   ) the delay (   ) shipping his order.", answer: "about / in", lesson: "EC1112", hint: "電話の用件は about、delay の後は in", note: "call about＝「〜の件で電話する」。「〜に電話する」なら call him のように相手を直接目的語に。delay in ～ が定番で of にしない", tag: "リテル", priority: 1 },
  // Lesson EC1112: カタカナ発音
  { id: "EC1112-56", type: "kana", prompt: "called about the delay in shipping", answer: "コールダ[バ]ウト / ザディ[レ]イ / イン[シ]ッピング", lesson: "EC1112", hint: "3つに区切る。about と delay の後に一瞬間を置く", note: "called about は d と about が連結して「コールダバウト」。3つに区切ると言いやすい", tag: "リテル", priority: 1 },
  // Lesson EC1112: 和文英訳
  { id: "EC1112-57", type: "trans", prompt: "彼は注文品がまだ発送されていなかったので電話した。", answer: "He called because his order hadn't shipped yet.", lesson: "EC1112", hint: "口語的な言い方", note: "EC1112-41 の別の言い方。ship は自動詞でも使える（商品が発送される）", tag: "リテル", priority: 2 },
  { id: "EC1112-58", type: "trans", prompt: "私は慌てん坊だからね。", answer: "I'm always in a rush, you know.", lesson: "EC1112", hint: "in a rush", note: "「落ち着きがなくうっかり」なら I'm a bit of a scatterbrain. 「急ぎがち」なら I tend to rush things.", tag: "スピーチ", priority: 1 },
  { id: "EC1112-59", type: "trans", prompt: "せっかちとも言える。", answer: "You could say I'm impatient.", lesson: "EC1112", hint: "You could say ～", note: "「〜とも言える」は You could say が定番。You could also call it being hasty. でもOK", tag: "スピーチ", priority: 1 },
  // Lesson EC1118: 和文英訳
  { id: "EC1118-01", type: "trans", prompt: "喜んで取り組みます。（仕事を引き受けるときの丁寧な定番）", answer: "I'd be happy to work on it.", lesson: "EC1118", hint: "I'd be happy to ～", note: "I'd＝I would。would が入ると「（頼まれたら）喜んで」と控えめで丁寧。I'm happy to でも通じるが would の形が大人っぽい", tag: "引き受け", priority: 1 },
  { id: "EC1118-02", type: "trans", prompt: "喜んで。（I'd be happy to とほぼ同じ意味・短く）", answer: "I'd be glad to.", lesson: "EC1118", hint: "glad", note: "I'd love to. ならもっと熱意が強くカジュアル", tag: "引き受け", priority: 2 },
  { id: "EC1118-03", type: "trans", prompt: "私がやっておきます。（実務的な言い方）", answer: "I'll take care of it.", lesson: "EC1118", hint: "take care of", note: "引き受けの実務的な定番", tag: "引き受け", priority: 2 },
  { id: "EC1118-04", type: "trans", prompt: "「〜に取り組む・〜を手がける」を英語で言うと？", answer: "work on", lesson: "EC1118", hint: "work on ～", note: "be happy to work on it の work on", tag: "引き受け", priority: 2 },
  // Lesson EC1118: 穴埋め
  { id: "EC1118-05", type: "blank", prompt: "I'd be happy to (   ) (   ) it.", answer: "work / on", lesson: "EC1118", hint: "取り組む", note: "work on ～＝〜に取り組む", tag: "引き受け", priority: 2 },
  { id: "EC1118-06", type: "blank", prompt: "(   ) be happy to work on it.", answer: "I'd", lesson: "EC1118", hint: "I would の短縮", note: "would で控えめ・丁寧に", tag: "引き受け", priority: 2 },
  // Lesson EC1118: カタカナ発音
  { id: "EC1118-07", type: "kana", prompt: "I'd be happy to work on it", answer: "アイビ [ハ]ピタ [ワー]コニッ", lesson: "EC1118", hint: "happy と work を強く", note: "I'd は d を軽く添えて be につなげ「アイビ」。happy to は to を弱く「ハピタ」。work on it は k が on に、n が it にくっついて「ワーコニッ」。最後の t はほぼ聞こえない", tag: "発音", priority: 1 },
  { id: "EC1118-08", type: "kana", prompt: "work on it", answer: "[ワー]コニッ", lesson: "EC1118", hint: "3語をつなげる", note: "work の k が on に、on の n が it にくっつく。オーバーラッピングでは I'd を言いそびれやすいので「アイビ」をひとかたまりで出す", tag: "発音", priority: 1 },
  // Lesson PC1105: 和文英訳
  { id: "PC1105-01", type: "trans", prompt: "すみません、今のお話は私宛てでしたか、それとも娘宛てでしたか？", answer: "Sorry, was that for me or for my daughter?", lesson: "PC1105", hint: "was that for ~ or ~", note: "誰宛てか分からないときの安全弁", tag: "聞き返し", priority: 1 },
  { id: "PC1105-02", type: "trans", prompt: "つまり、次回ワークブックの12ページをやってくればいいんですね？", answer: "So, you mean we should review page 12 for next time?", lesson: "PC1105", hint: "So, you mean we should ~?", note: "結論だけオウム返し", tag: "確認", priority: 1 },
  { id: "PC1105-03", type: "trans", prompt: "すみません、最後の一文をもう一度ゆっくり言っていただけますか？", answer: "Sorry, could you repeat the last part a little more slowly?", lesson: "PC1105", hint: "the last part", note: "範囲を絞って聞き返す", tag: "聞き返し", priority: 1 },
  { id: "PC1105-04", type: "trans", prompt: "教えてくれてありがとうございます。家で必ず練習させておきます。", answer: "Thank you for letting me know. I'll make sure she practices at home.", lesson: "PC1105", hint: "make sure she ~", note: "「必ず〜させます」。let me know＝教えて・知らせて（let＋人＋動詞の原形＝人に〜させる）。for の後なので letting（-ing形）", tag: "返答", priority: 2 },
  { id: "PC1105-05", type: "trans", prompt: "今日色鉛筆を忘れてしまいすみませんでした。次回は必ず持たせます。", answer: "Sorry about the colored pencils today. I'll make sure she brings them next week.", lesson: "PC1105", hint: "Sorry about＋名詞", note: "短く謝って約束へ", tag: "謝罪", priority: 2 },
  { id: "PC1105-06", type: "trans", prompt: "それを聞けて嬉しいです！家でもレッスンのことを楽しそうに話していました。", answer: "I'm glad to hear that! She was talking about today's lesson at home, too.", lesson: "PC1105", hint: "glad to hear", note: "褒めへの王道返し", tag: "褒め返し", priority: 2 },
  { id: "PC1105-07", type: "trans", prompt: "先生のおかげで、娘は前よりずっと英語が好きになったみたいです。", answer: "Thanks to you, she seems to enjoy English much more now.", lesson: "PC1105", hint: "Thanks to you", note: "関係が近くなる一言", tag: "褒め返し", priority: 3 },
  { id: "PC1105-08", type: "trans", prompt: "了解しました！オレンジ色のTシャツを探してみますね。宿題も確認しておきます。", answer: "Got it! I'll look for an orange T-shirt for her. And I'll check the workbook too.", lesson: "PC1105", hint: "Got it! / look for", note: "2文でテンポよく", tag: "返答", priority: 2 },
  // Lesson PC1105: 穴埋め
  { id: "PC1105-09", type: "blank", prompt: "I'll (   ) she brings them next week.（2語）", answer: "make sure", lesson: "PC1105", hint: "2語", note: "三単現のsに注意", tag: "返答", priority: 2 },
  { id: "PC1105-10", type: "blank", prompt: "(   ) you, she seems to enjoy English much more now.（2語）", answer: "Thanks to", lesson: "PC1105", hint: "2語", note: "for ではない。much more now＝今では（前より）ずっと", tag: "褒め返し", priority: 2 },
  { id: "PC1105-11", type: "blank", prompt: "Sorry, could you repeat the (   ) a little more slowly?（2語）", answer: "last part", lesson: "PC1105", hint: "2語", note: "範囲を絞る", tag: "聞き返し", priority: 1 },
  { id: "PC1105-12", type: "blank", prompt: "Thank you for (   ) me (   ).", answer: "letting / know", lesson: "PC1105", hint: "let＋人＋know", note: "for（前置詞）の後は動名詞 letting。let me know＝私に知らせて", tag: "返答", priority: 2 },
  { id: "PC1105-13", type: "blank", prompt: "And Mom, just a quick (   ) about the Halloween party next Saturday.", answer: "heads-up", lesson: "PC1105", hint: "ハイフン付き名詞", note: "講師の定番「事前連絡」", tag: "速音読", priority: 2 },
  { id: "PC1105-14", type: "blank", prompt: "Could you please (   ) her review page 12 of the workbook?", answer: "have", lesson: "PC1105", hint: "使役動詞", note: "親への宿題依頼のサイン", tag: "速音読", priority: 2 },
  { id: "PC1105-15", type: "blank", prompt: "She did such a (   ) job today with the animal names.", answer: "fantastic", lesson: "PC1105", hint: "f〜", note: "褒め→依頼の前置き", tag: "速音読", priority: 3 },
  // Lesson PC1105: 誤文訂正
  { id: "PC1105-16", type: "correct", prompt: "I'll make sure she practice at home.", answer: "I'll make sure she practices at home.", lesson: "PC1105", hint: "主語she", note: "三単現のs", tag: "返答", priority: 1 },
  { id: "PC1105-17", type: "correct", prompt: "Thanks for you, she seems to enjoy English much more now.", answer: "Thanks to you, she seems to enjoy English much more now.", lesson: "PC1105", hint: "前置詞", note: "「おかげで」はto", tag: "褒め返し", priority: 2 },
  { id: "PC1105-18", type: "correct", prompt: "So, you mean we should reviewing page 12 for next time?", answer: "So, you mean we should review page 12 for next time?", lesson: "PC1105", hint: "助動詞の後", note: "should＋原形", tag: "確認", priority: 2 },
  { id: "PC1105-19", type: "correct", prompt: "She doesn't need to wear full costume.", answer: "She doesn't need to wear a full costume.", lesson: "PC1105", hint: "冠詞", note: "costumeは可算", tag: "速音読", priority: 3 },
  // Lesson PC1105: カタカナ発音
  { id: "PC1105-20", type: "kana", prompt: "Was that for me or for my daughter?", answer: "ワズダッ フォミ オァ フォマイ [ドー]ター", lesson: "PC1105", hint: "tは飲み込む", note: "forは弱く", tag: "発音", priority: 1 },
  { id: "PC1105-21", type: "kana", prompt: "Thank you for letting me know.", answer: "サンキュフォ レリン ミ [ノウ]", lesson: "PC1105", hint: "tはラ行化", note: "knowを強く", tag: "発音", priority: 2 },
  { id: "PC1105-22", type: "kana", prompt: "I'll make sure she brings them.", answer: "アゥ メイッ [シュア] シ ブリングゼム", lesson: "PC1105", hint: "I'll≠アイル", note: "暗いL", tag: "発音", priority: 2 },
  { id: "PC1105-23", type: "kana", prompt: "Got it!", answer: "[ガ]リッ", lesson: "PC1105", hint: "tがラ行化", note: "ゴットイットではない", tag: "発音", priority: 2 },
  { id: "PC1105-24", type: "kana", prompt: "heads-up", answer: "ヘッ[ザ]ップ", lesson: "PC1105", hint: "dsとupが連結", note: "聞き取りのカギ", tag: "発音", priority: 2 },
  // Lesson PC1105: 和文英訳
  { id: "PC1105-25", type: "trans", prompt: "何かあったら知らせてください。", answer: "Please let me know if anything comes up.", lesson: "PC1105", hint: "let me know", note: "let＋人＋動詞の原形＝人に〜させる／〜するのを許す。know は原形のまま", tag: "let", priority: 1 },
  { id: "PC1105-26", type: "trans", prompt: "考えさせてください。", answer: "Let me think about it.", lesson: "PC1105", hint: "Let me＋原形", note: "「私に考えることを許して」→ 考えさせて", tag: "let", priority: 2 },
  { id: "PC1105-27", type: "trans", prompt: "私に手伝わせてください。", answer: "Let me help you.", lesson: "PC1105", hint: "Let me＋原形", note: "let の後の動詞は原形（to も -ing も付けない）", tag: "let", priority: 2 },
  // Lesson PC1105: 穴埋め
  { id: "PC1105-28", type: "blank", prompt: "Thank you for (   ) me know.", answer: "letting", lesson: "PC1105", hint: "for の後は -ing", note: "let me know を for（前置詞）の後に置くので letting", tag: "let", priority: 1 },
  // Lesson PC1105: 誤文訂正
  { id: "PC1105-29", type: "correct", prompt: "Thank you for let me know.", answer: "Thank you for letting me know.", lesson: "PC1105", hint: "前置詞の後", note: "for の後は動名詞 letting。know はそのまま原形", tag: "let", priority: 1 },
  { id: "PC1105-30", type: "correct", prompt: "Let me to know your schedule.", answer: "Let me know your schedule.", lesson: "PC1105", hint: "let＋人＋原形", note: "let の後に to は付けない", tag: "let", priority: 1 },
  // Lesson PC1105: 穴埋め
  { id: "PC1105-31", type: "blank", prompt: "Thanks to you, she seems to enjoy English (   ) (   ) now.", answer: "much / more", lesson: "PC1105", hint: "比較級を強める語＋比較級", note: "much more now＝今では（前より）ずっと。much が more を強める", tag: "比較級", priority: 1 },
  // Lesson PC1105: 誤文訂正

   覚えていない分を順に1周に入れる。ただし最新の段だけで埋めず、OLD_QUOTA 件は一つ前の段以降（少し古めの問題）から混ぜる。
   問題を追加したら RECENT を書き換える */
const RECENT_LESSONS = [["EC1118", "C1", "WG1117", "V1", "18", "DR1115", "17", "EC1112", "PH1", "unit:indirectq", "unit:reladv", "unit:relpro", "unit:prep", "unit:word", "unit:pp3", "unit:inf4"], ["16", "EC1110", "EC1110B"], "PC1105", ["EC1104", "EC1104B"], "EC1027"]; // "unit:〜" は英作文の単元 // 最近追加したレッスン（先頭ほど先に出す。配列は同じ段）
const RECENT_UNITS = ["cushion", "there", "partic", "talk"]; // 最近追加した英作文の単元（レッスンの次）
const PRIORITY_UNITS = ["can", "ableto", "must", "haveto"];
/* 1周のうち、最新の段（RECENT_LESSONS の先頭）以外から入れる数と、そのうち同じ段から入れる上限 */

const tagNote = (s) => [s.lesson ? "Lesson " + s.lesson : "", s.tag ? "文法: " + s.tag : "", s.note || ""].filter(Boolean).join(" · ");
/* 読み上げ用に、末尾の日本語の補足「（…）」「(…)」を外す */
const stripGloss = (t) => {
  t = (t || "").replace(/\s*[（(][^）)]*[぀-ヿ一-鿿][^）)]*[）)]\s*$/, "").replace(/\s+\/\s+/g, ", ").trim();   // 「A / B」の別解は区切って読む
  if (/[぀-ヿ一-鿿]/.test(t)) {                    // 「dominate ＝ 支配する」のように日本語が混じる答えは、先頭の英語だけ読む
    const m = /^[A-Za-z0-9][A-Za-z0-9 ,.'’"!?\-\/()]*/.exec(t);
    t = m ? m[0].trim() : "";
  }
  return t;
};
const KINDS = {
  compose: { mark: "英", answerLabel: "Answer", color: "#c9412f", sheet: "英文を見る",
             prompt: (s) => s.ja, answer: (s) => esc(s.en), note: () => "", speak: (s) => s.en.replace(/\s*(-ing\s*)?~/g, "") },   // 「~」は読まない
  trans:   { mark: "英", answerLabel: "Answer", color: "#c9412f", sheet: "英文を見る",

  pron:    { mark: "カナ", answerLabel: "カタカナ（● は強く）", color: "#2b64c8", sheet: "読み方を見る",

  qa:      { mark: "Q", answerLabel: "答え", color: "#1f8a8a", sheet: "答えを見る",

  transform: { mark: "変", answerLabel: "変形後", color: "#7b4fb8", sheet: "変形後の文を見る",

             promptHTML: (s) => { const [base, cue] = s.prompt.split(/\s*⇒\s*/); return esc(base) + (cue ? `<span class="cue">⇒ ${esc(cue)}</span>` : ""); } },
};

const ITEMS = [
  ...SENTENCES.map(s => ({ ...s, kind: "compose", id: s.unit + "|" + s.en })),
  ...PHRASES.map(s => ({ ...s, kind: "pron", id: s.unit + "|" + s.en })),
  ...QUESTIONS.map(s => ({ ...s, kind: s.type, unit: s.type, id: "q|" + s.id })),

/* ---- 重複の除去: 同じ英文・同じ誤文・同じ穴埋め・同じ発音フレーズは1つにまとめる。
   解説やヒントの多い方（レッスンの問題）を残し、外した id の記録は残した方に引き継ぐ ---- */
const ALIAS = {};   // 外した id → 残した id
(function dedupeItems() {
  const norm = (t) => String(t || "").toLowerCase().replace(/["'’‘“”.,!?。、（）()\s]/g, "");
  const key = (s) => {
    if (s.kind === "compose" || s.kind === "trans") return "je|" + norm(s.en ?? s.answer);
    if (s.kind === "correct") return "c|" + norm(s.prompt);
    if (s.kind === "blank") return "b|" + norm(s.prompt) + "|" + norm(s.answer);
    if (s.kind === "pron" || s.kind === "kana") return "k|" + norm(s.en ?? s.prompt);
    return "q|" + norm(s.prompt);
  };
  const score = (s) => (s.note ? 1 : 0) + (s.hint ? 1 : 0) + (s.tag ? 1 : 0);
  const lessonNo = (s) => { const n = parseInt(String(s.lesson ?? "").replace(/\D/g, ""), 10); return isNaN(n) ? -1 : n; };
  // 新しいレッスンの方を残す（今回の版に差し替える）。同じレッスンなら解説の多い方
  // 最近追加したレッスン（RECENT_LESSONS の並び順）の版を残す。どちらも最近でなければ番号の大きいレッスン、同じなら解説の多い方
  const RECENT_ORDER = RECENT_LESSONS.flatMap(g => Array.isArray(g) ? g : [g]);
  const recency = (s) => { const k = RECENT_ORDER.indexOf(String(s.lesson ?? "")); return k < 0 ? Infinity : k; };
  const better = (a, b) => recency(a) !== recency(b) ? recency(a) < recency(b)
                         : lessonNo(a) !== lessonNo(b) ? lessonNo(a) > lessonNo(b) : score(a) > score(b);
  const best = new Map();
  for (const s of ITEMS) {
    const k = key(s), cur = best.get(k);
    if (!cur) best.set(k, s);
    else if (better(s, cur)) { ALIAS[cur.id] = s.id; best.set(k, s); }
    else ALIAS[s.id] = cur.id;
  }
  const keep = new Set([...best.values()].map(s => s.id));
  for (let i = ITEMS.length - 1; i >= 0; i--) if (!keep.has(ITEMS[i].id)) ITEMS.splice(i, 1);
  const resolve = (id) => { let n = 0; while (ALIAS[id] && n++ < 10) id = ALIAS[id]; return id; };
  for (const k of Object.keys(ALIAS)) ALIAS[k] = resolve(ALIAS[k]);
})();

(function applySeed() {
  const seed = window.SEED_PROGRESS;
  if (!seed || store.get("streak", null)) return;
  for (const k of ["streak", "tries", "deck", "deckRule", "daily", "streakAt"]) if (seed[k] != null) store.set(k, seed[k]);
})();

  tries: store.get("tries", {}),     // id → これまでのトライ回数（○×どちらも）

  deck: store.get("deck", []),       // 今まわしている最大 ROUND_SIZE 件の id
  deckRule: store.get("deckRule", 0),
  daily: store.get("daily", { date: "", n: 0 }),   // 今日覚えた数（date はその日付。日が変わればリセット）
  added: [],        // この周で新しく補充された id
  queue: [],        // indices not yet shown this round
  current: null,
  revealed: false,
  ok: 0, ng: 0,
  roundTotal: 0,

  history: [],      // 直前の採点（下スワイプで戻る）
  cleared: [],      // indices that reached MASTER_AT this round
  timerId: null, tickId: null,
};

/* 古いキーを引き継ぐ: 「flap」単元 → 「weak」、レッスン番号なしの q|C01 → q|L7-C01 */
/* 古い id を今の id に読み替える（単元名の変更、レッスン7 の id、二重についた L12-L12- など） */
function renameId(k) {
  if (k.startsWith("flap|")) return "weak|" + k.slice(5);
  if (/^q\|[CJBP]\d+$/.test(k)) return "q|L7-" + k.slice(2);
  const m = /^q\|(L[A-Z0-9]+)-\1-(.+)$/.exec(k);
  if (m) return `q|${m[1]}-${m[2]}`;
  return null;
}
function migrateStreak(m, mode = "max") {
  let changed = false;
  for (const k of Object.keys(m)) {
    const nk = renameId(k);
    if (nk) { if (!(nk in m)) m[nk] = m[k]; delete m[k]; changed = true; }
  }
  // 重複でまとめた文の記録を、残した方に合流させる（クリア回数は大きい方、トライ回数は合計）
  for (const k of Object.keys(m)) {
    const nk = ALIAS[k];
    if (!nk) continue;
    m[nk] = mode === "sum" ? (m[nk] || 0) + m[k] : Math.max(m[nk] || 0, m[k]);
    delete m[k]; changed = true;
  }
  return changed;
}
if (migrateStreak(state.streak)) store.set("streak", state.streak);
if (migrateStreak(state.tries, "sum")) store.set("tries", state.tries);

const mastered = (i) => (state.streak[ITEMS[i].id] || 0) >= MASTER_AT;
const masteredCount = () => ITEMS.filter((_, i) => mastered(i)).length;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pool() {
  return ITEMS.map((s, i) => i).filter(i => !mastered(i));
}

/* 覚えた文を外し、足りない分を新しい文で補充して ROUND_SIZE 件にする。
   「文の変形」と優先単元の文をまず全部入れ、次に英作文（日本語→英語）を JE_QUOTA 件まで優先し、
   途中まで進んだ文（○1）を先に入れる */
const isJE = (i) => ITEMS[i].kind === "compose" || ITEMS[i].kind === "trans";
const isTF = (i) => ITEMS[i].kind === "transform";
/* 最優先で出す id。優先単元の文が重複でレッスン側にまとめられていれば、まとめ先の問題を優先する */
const PRIORITY_IDS = new Set(SENTENCES.filter(s => PRIORITY_UNITS.includes(s.unit))
                                      .map(s => { const id = s.unit + "|" + s.en; return ALIAS[id] || id; }));
/* 最近の問題の順位: RECENT_LESSONS の並び順 → RECENT_UNITS。該当しなければ -1 */
const recentRank = (i) => {
  const lesson = String(ITEMS[i].lesson ?? ""), unit = "unit:" + ITEMS[i].unit;
  const k = RECENT_LESSONS.findIndex(g => Array.isArray(g) ? (g.includes(lesson) || g.includes(unit)) : (g === lesson || g === unit));
  if (k >= 0) return k;
  return RECENT_UNITS.includes(ITEMS[i].unit) ? RECENT_LESSONS.length : -1;
};
const isRecent = (i) => recentRank(i) >= 0;
const isPri = (i) => isRecent(i) || isTF(i) || PRIORITY_IDS.has(ITEMS[i].id);
/* 補充・絞り込みの順位（小さいほど先）: 最近の問題 → 優先単元の文 → 文の変形 → 英作文 → その他 */
const RANK_PRI = RECENT_LESSONS.length + 1, RANK_TF = RANK_PRI + 1, RANK_JE = RANK_TF + 1, RANK_OTHER = RANK_JE + 1;
const rankOf = (i) => isRecent(i) ? recentRank(i) : PRIORITY_IDS.has(ITEMS[i].id) ? RANK_PRI : isTF(i) ? RANK_TF : isJE(i) ? RANK_JE : RANK_OTHER;
/* 同じ題材の問題（同じ英語の語句を扱う発音・穴埋め・英訳など）は1周に1問まで。
   英文から内容語（語尾の -ing / -ed / -s を落とす）を取り出し、片方が他方に含まれる、
   または3語以上・半分以上が共通なら「同じ題材」とみなす。
   ただし1語だけの問題（work の発音など）は、その語がよく出る語（COMMON_DF 件超の問題にある）なら同じ題材とみなさない */
const STOP = new Set(("the a an and or but if so to of in on at by for with from about as is are was were be been being am do does did done " +
  "have has had having not no it its this that these those i you he she we they me him her us them my your his our their what which who whom whose " +
  "when where why how can could will would shall should may might must there here then than too very just also only now some any all each every " +
  "more most much many one two get got going go like").split(" "));
const stem = (w) => w.replace(/(ing|ed|es|s)$/, "").replace(/([a-z])\1$/, "$1");
const sigOf = (s) => {
  const out = new Set();
  for (const w of [s.en, s.answer, s.prompt].filter(x => typeof x === "string").join(" ").toLowerCase().split(/[^a-z]+/)) {
    if (w.length >= 3 && !STOP.has(w)) out.add(stem(w));
  }
  return out;
};
const SIG = ITEMS.map(sigOf);
const COMMON_DF = 10;
const DF = new Map();                                      // 語 → その語を含む問題の数
for (const sig of SIG) for (const w of sig) DF.set(w, (DF.get(w) || 0) + 1);
const similar = (a, b) => {
  const A = SIG[a], B = SIG[b];
  if (!A.size || !B.size) return false;
  let n = 0, w1 = null;
  for (const w of A) if (B.has(w)) { n++; w1 = w; }
  if (n === 0) return false;
  if (Math.min(A.size, B.size) === 1) return DF.get(w1) <= COMMON_DF;   // 1語の問題は、珍しい語のときだけ
  return n >= Math.min(A.size, B.size) || n >= 3 || n * 2 >= A.size + B.size - n;
};
function buildDeck() {
  const byId = new Map(ITEMS.map((s, i) => [s.id, i]));
  let deck = [...new Set(state.deck.map(id => renameId(id) || id).map(id => ALIAS[id] || id))].filter(id => byId.has(id) && !mastered(byId.get(id)));
  if (state.deckRule !== DECK_RULE) {           // ルールが変わったら1周分を組み直す（○1 の文は補充で先に戻る）
    deck = [];
    state.deckRule = DECK_RULE;
    store.set("deckRule", DECK_RULE);
  }
  if (deck.length > ROUND_SIZE) {               // 1周の問題数を減らしたときは、優先度の高い順に残す
    const rank = (id) => rankOf(byId.get(id));
    deck = deck.map((id, n) => [id, n]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).slice(0, ROUND_SIZE).map(x => x[0]);
  }
  state.added = [];
  if (deck.length < ROUND_SIZE) {
    const inDeck = new Set(deck);
    const cand = pool().filter(i => !inDeck.has(ITEMS[i].id));
    // ○1 を先に。同じ中では CSV の priority が小さい（つまずいた）問題を先に、同じ priority は順不同
    const byPriority = (list) => shuffle(list).sort((a, b) => (ITEMS[a].priority ?? 3) - (ITEMS[b].priority ?? 3));
    const order = (list) => [
      ...byPriority(list.filter(i => (state.streak[ITEMS[i].id] || 0) > 0)),
      ...byPriority(list.filter(i => (state.streak[ITEMS[i].id] || 0) === 0)),
    ];
    const byRank = [];                                        // 順位ごとの候補（○1 → priority 順）
    for (let r = 0; r <= RANK_OTHER; r++) byRank.push(order(cand.filter(i => rankOf(i) === r)));
    const picks = [];
    const chosen = deck.map(id => byId.get(id));              // 同じ題材の判定は、今の周に残っている問題も含めて
    const take = (list, n, loose) => {                        // 同じ題材が既に入っていれば飛ばす（次の周以降に回る）
      for (let k = 0; n > 0 && k < list.length;) {
        const i = list[k];
        if (!loose && chosen.some(j => similar(i, j))) { k++; continue; }
        picks.push(i); chosen.push(i); list.splice(k, 1); n--;
      }
    };
    const room = () => ROUND_SIZE - deck.length - picks.length;
    // まず少し古めの問題（最新の段より後ろ）を OLD_QUOTA 件まで。同じ段からは OLD_CAP 件まで、足りなければ上限なしでもう一度
    const oldNow = deck.filter(id => rankOf(byId.get(id)) > 0).length;
    let oldNeed = Math.min(Math.max(0, OLD_QUOTA - oldNow), room());
    for (const cap of [OLD_CAP, Infinity]) {
      for (let r = 1; r <= RANK_OTHER && oldNeed > 0; r++) {
        const before = picks.length;
        take(byRank[r], Math.min(cap, oldNeed));
        oldNeed -= picks.length - before;
      }
    }
    const tf = [];                                            // 最近の問題（レッスン順）→ 優先単元の文 → 文の変形 の順
    for (let r = 0; r <= RANK_TF; r++) tf.push(...byRank[r]);
    const je = byRank[RANK_JE], other = byRank[RANK_OTHER];
    const jeNow = deck.concat(picks.map(i => ITEMS[i].id)).filter(id => isJE(byId.get(id))).length;
    take(tf, room());                                         // 優先単元と文の変形は残っている分を全部
    take(je, Math.min(Math.max(0, JE_QUOTA - jeNow), room())); // 次に英作文を枠まで
    take(other, room());                                      // 残りは他の形式
    take(je, room());                                         // 足りなければ英作文で埋める
    for (const list of [tf, je, other]) take(list, room(), true); // それでも足りなければ、同じ題材でも入れる
    state.added = picks.map(i => ITEMS[i].id);
    deck = deck.concat(state.added);
  }
  state.deck = deck;
  store.set("deck", state.deck);
  return deck.map(id => byId.get(id));
}

function startRound() {
  clearTimer();
  if (!primed || upcoming() == null) dropPrimed();
  state.queue = shuffle(buildDeck());
  state.ok = 0; state.ng = 0;
  state.missed = [];
  state.cleared = [];
  state.history = [];
  state.roundTotal = state.queue.length;
  el.summary.hidden = true;
  el.promptArea.hidden = false;
  el.answerArea.hidden = false;
  el.actions.hidden = false;
  el.hint.hidden = false;
  el.meta.hidden = false;
  next();
}

function next() {
  clearTimer();
  if (state.queue.length === 0) return showSummary();

  state.current = state.queue.shift();
  state.revealed = false;
  const s = ITEMS[state.current];
  const k = KINDS[s.kind];
  const u = UNITS[s.unit];

  el.card.classList.remove("revealed");
  el.card.style.setProperty("--k", k.color);
  el.answerLabel.textContent = k.answerLabel;
  el.sheetText.textContent = k.sheet;
  el.promptText.innerHTML = (k.mark ? `<span class="mark">${esc(k.mark)}</span>` : "") + (k.promptHTML ? k.promptHTML(s) : esc(k.prompt(s)));
  el.answerText.innerHTML = k.answer(s);
  el.answerNote.textContent = k.note(s);
  const canSpeak = !!(k.speak && k.speak(s)) && "speechSynthesis" in window;
  el.speakBtn.hidden = !canSpeak;
  el.speakBtn2.hidden = !(canSpeak && k.speakBefore);
  userPaused = false; renderPause();
  el.unitTag.textContent = u.label;
  el.unitTag.style.setProperty("--tag", u.color);
  renderBadges(s);
  setActions("hidden");
  render();
  fitPrompt();
  startTimer();
}

/* 広い画面では問題文・答えの欄の高さが決まっているので、収まらないときだけ文字を少し小さくする */
function fitBox(box, text, floor) {
  if (!box || !text) return;
  text.style.fontSize = "";
  let size = parseFloat(getComputedStyle(text).fontSize);
  for (let n = 0; n < 16 && box.scrollHeight > box.clientHeight + 1 && size > floor; n++) {
    size -= 1.5;
    text.style.fontSize = size + "px";
  }
  box.classList.toggle("overflow", box.scrollHeight > box.clientHeight + 1);   // それでも収まらなければ欄の中でスクロール
}
function fitPrompt() {
  fitBox(el.answerArea, el.answerText, 16);
  fitBox(el.promptArea, el.promptText, 16);
}
window.addEventListener("resize", fitPrompt);

function reveal(auto = false) {
  if (state.revealed) return;
  state.revealed = true;
  clearTimer();
  el.card.classList.add("revealed");
  setActions("revealed");
  fitPrompt();
  el.okBtn.focus({ preventScroll: true });
  if (auto && el.autoSpeak.checked) playPrimed();   // 時間切れで開いたときは答えを読み上げる
  else dropPrimed();
}

/* 直前の採点の履歴（下スワイプで戻る用）。周をまたいだら消す */
const HISTORY_MAX = 20;
function grade(ok) {
  if (!state.revealed) return;
  const i = state.current, id = ITEMS[i].id;
  if (Object.isFrozen(state.streak)) state.streak = { ...state.streak };
  if (Object.isFrozen(state.tries)) state.tries = { ...state.tries };
  const rec = { i, ok, streak: state.streak[id] || 0, tries: state.tries[id] || 0,
                cleared: false, missedAdded: false };
  state.tries[id] = rec.tries + 1;
  if (ok) {
    state.ok++;
    state.streak[id] = rec.streak + 1;
    if (mastered(i)) { state.cleared.push(i); rec.cleared = true; dailyBump(1); }
  } else {
    state.ng++;
    state.streak[id] = 0;
    if (!state.missed.includes(i)) { state.missed.push(i); rec.missedAdded = true; }
  }
  state.history.push(rec);
  if (state.history.length > HISTORY_MAX) state.history.shift();
  saveStreak();
  render();
  primeSpeech(upcoming());
  next();
}
/* 下スワイプ: 直前の問題に戻り、その採点を取り消してもう一度答える */
function undoLast() {
  const rec = state.history.pop();
  if (!rec) return false;
  clearTimer();
  dropPrimed();
  const id = ITEMS[rec.i].id;
  if (Object.isFrozen(state.streak)) state.streak = { ...state.streak };
  if (Object.isFrozen(state.tries)) state.tries = { ...state.tries };
  state.streak[id] = rec.streak;
  state.tries[id] = rec.tries;
  if (rec.ok) state.ok = Math.max(0, state.ok - 1); else state.ng = Math.max(0, state.ng - 1);
  if (rec.cleared) { const k = state.cleared.lastIndexOf(rec.i); if (k >= 0) state.cleared.splice(k, 1); dailyBump(-1); }
  if (rec.missedAdded) { const k = state.missed.indexOf(rec.i); if (k >= 0) state.missed.splice(k, 1); }
  if (state.current != null) state.queue.unshift(state.current);   // 今出ている問題は次に回す
  state.queue.unshift(rec.i);
  state.current = null;
  saveStreak();
  primeSpeech(ITEMS[rec.i]);   // 操作の中で音声を用意しておく
  next();
  return true;
}

/* ---- 今日の目標: 覚えた数を日付ごとに数え、残りをホーム画面のバッジに出す ---- */
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function dailyToday() {                       // 日が変わっていればリセットして返す
  if (state.daily.date !== todayKey()) state.daily = { date: todayKey(), n: 0 };
  return state.daily;
}
function dailyBump(delta) {
  const d = dailyToday();
  state.daily = { date: d.date, n: Math.max(0, d.n + delta) };
}
const dailyLeft = () => Math.max(0, DAILY_GOAL - dailyToday().n);
let lastBadge = null;
function updateBadge() {                      // ホーム画面に追加した Web アプリのアイコンに「今日 あと N」を出す（iOS 16.4+ など）
  if (!("setAppBadge" in navigator)) return;
  const n = dailyLeft();
  if (n === lastBadge) return;
  lastBadge = n;
  try { (n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => { lastBadge = null; }); } catch { lastBadge = null; }
}
/* バッジの状態: "none"＝この環境では使えない / "ask"＝通知の許可が要る / "denied" / "on" */
function badgeState() {
  if (!("setAppBadge" in navigator)) return "none";
  if (!("Notification" in window)) return "on";
  return Notification.permission === "granted" ? "on" : Notification.permission === "denied" ? "denied" : "ask";
}
function renderBadgeBtn() {                   // iOS ではバッジに通知の許可が要るので、ボタンから許可する
  const st = badgeState();
  el.badgeBtn.textContent = st === "on" ? "バッジ ON" : st === "ask" ? "バッジを許可" : "バッジ";
  el.badgeBtn.classList.toggle("dim", st === "none");
}
const SITE_URL = "https://naoya-ujita.github.io/instant-english-drill/";   // 単独 URL 版（バッジはこちらで）
const BADGE_HELP = "この画面ではアイコンのバッジを使えません。\n\n" +
  "claude.ai の枠の中では iOS がバッジを許可しないため、単独 URL 版を Safari で開き、共有メニューの「ホーム画面に追加」で作ったアイコンから起動してください（iOS 16.4 以降）。\n" +
  SITE_URL + "\n\n画面上部の「今日 あと N」は、どの環境でも表示されます。";

/* ---- 記録の保存: この端末（localStorage）＋ Claude の保存領域（あれば） ---- */
let cloudDoc = null, cloudBusy = null, cloudDirty = false;
function saveStreak() {
  if (Object.isFrozen(state.streak)) state.streak = { ...state.streak };
  if (Object.isFrozen(state.tries)) state.tries = { ...state.tries };
  state.streakAt = Date.now();
  store.set("streak", state.streak);
  store.set("tries", state.tries);
  store.set("deck", state.deck);
  store.set("deckRule", state.deckRule);
  store.set("streakAt", state.streakAt);
  store.set("daily", state.daily);
  cloudDirty = true;
  pushCloud();
}
async function pushCloud() {
  if (!cloudDoc || cloudBusy) return;
  cloudDirty = false;
  cloudBusy = cloudDoc.set({ streak: state.streak, tries: state.tries, deck: state.deck, deckRule: state.deckRule, daily: state.daily, updatedAt: state.streakAt })
    .then(() => { el.sync.textContent = "記録を同期済み"; })
    .catch(() => { el.sync.textContent = "同期できず（この端末には記憶）"; })
    .finally(() => { cloudBusy = null; if (cloudDirty) pushCloud(); });
}
async function initCloud() {
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user && await user.id();
    if (!db || !uid) return;
    cloudDoc = db.doc("data/users/" + uid + "/progress");
    const snap = await cloudDoc.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.updatedAt || 0) > (state.streakAt || 0)) {
      state.streak = { ...(remote.streak || {}) };   // 受け取ったデータは frozen なので必ずコピーする
      state.tries = { ...(remote.tries || {}) };
      state.deck = [...(remote.deck || [])];
      state.deckRule = remote.deckRule || 0;
      store.set("deckRule", state.deckRule);
      if (remote.daily && remote.daily.date === todayKey() && (remote.daily.n || 0) > (dailyToday().n || 0)) {
        state.daily = { date: remote.daily.date, n: remote.daily.n };   // 別の端末で今日覚えた分
        store.set("daily", state.daily);
      }
      state.streakAt = remote.updatedAt || 0;
      migrateStreak(state.streak);
      migrateStreak(state.tries, "sum");
      store.set("streak", state.streak);
      store.set("tries", state.tries);
      store.set("deck", state.deck);
      store.set("streakAt", state.streakAt);
      el.sync.textContent = "記録を同期済み";
      startRound();               // 別の端末の記録を反映して出し直す
    } else if (!remote || (remote.updatedAt || 0) < (state.streakAt || 0)) {
      cloudDirty = true; pushCloud();
    } else {
      el.sync.textContent = "記録を同期済み";
    }
  } catch { /* 保存領域が使えないときはこの端末だけに記憶 */ }
}

function setActions(m) {
  el.actions.dataset.state = m;
  el.revealBtn.hidden = m !== "hidden";
  el.okBtn.hidden = m !== "revealed";
  el.againBtn.hidden = m !== "revealed";
}

function render() {
  const done = state.ok + state.ng;
  const left = state.queue.length;
  el.counter.innerHTML = state.current == null
    ? `<b>${done}</b> / ${state.roundTotal} 問`
    : `<b>${done + 1}</b> 問目 <span style="color:var(--ink-3)">· 残り ${left}</span>`;
  el.score.innerHTML = `<span class="ok-n">○ ${state.ok}</span><span class="ng-n">× ${state.ng}</span>`;
  renderStatus();
  if (!el.progress.hidden) renderProgress();
}

/* ---- カードのバッジ: 何回目のトライか・クリア済みか ---- */
function renderBadges(s) {
  const tries = state.tries[s.id] || 0;
  const streak = state.streak[s.id] || 0;
  const hard = tries + 1 >= HARD_AT;
  el.tryBadge.className = "badge" + (tries === 0 ? " first" : hard ? " hard" : "");
  el.tryBadge.innerHTML = tries === 0 ? "はじめての文" : `<b>${tries + 1}</b>回目のトライ${hard ? " · 苦手" : ""}`;
  el.card.classList.toggle("hard", hard);
  el.hardTag.hidden = !hard;
  const pips = Array.from({ length: MASTER_AT }, (_, i) => `<i class="pip${i < streak ? " on" : ""}"></i>`).join("");
  if (streak > 0) {
    el.clearBadge.className = "badge half";
    el.clearBadge.innerHTML = `<span class="pips">${pips}</span><b>${streak}</b>回クリア済み · これで${streak + 1}回目`;
  } else {
    el.clearBadge.className = "badge zero";
    el.clearBadge.innerHTML = `<span class="pips">${pips}</span>まだクリアなし`;
  }
}

/* ---- 覚えた / あと1回 / まだ ---- */
function renderStatus() {
  // バー: この周の進み
  const answered = state.ok + state.ng;
  const total = state.roundTotal || ROUND_SIZE;
  el.roundPos.textContent = answered;
  el.roundTotal.textContent = total;
  el.barDone.style.width = (answered / total * 100) + "%";
  el.barHalf.style.width = (state.current != null ? 1 / total * 100 : 0) + "%";   // いま解いている1問
  // 数字: 全体の覚えた / あと1回 / まだ
  const n = (s) => state.streak[s.id] || 0;
  const done = ITEMS.filter(s => n(s) >= MASTER_AT).length;
  const half = ITEMS.filter(s => n(s) > 0 && n(s) < MASTER_AT).length;
  el.nDone.textContent = done; el.nHalf.textContent = half; el.nTodo.textContent = ITEMS.length - done - half;
  // 今日の目標
  el.nToday.textContent = dailyToday().n; el.nGoal.textContent = DAILY_GOAL; el.nLeft.textContent = dailyLeft();
  updateBadge();
}

/* ---- 一覧: 全文の進み具合 ---- */
function renderProgress() {
  const n = (s) => state.streak[s.id] || 0;
  const done = ITEMS.filter(s => n(s) >= MASTER_AT).length;
  const half = ITEMS.filter(s => n(s) > 0 && n(s) < MASTER_AT).length;
  const hardN = ITEMS.filter(s => n(s) < MASTER_AT && (state.tries[s.id] || 0) >= HARD_AT).length;
  const groups = Object.entries(UNITS).map(([k, u]) => {
    const rows = ITEMS.filter(s => s.unit === k).map(s => {
      const c = n(s);
      const t = state.tries[s.id] || 0;
      const hard = c < MASTER_AT && t >= HARD_AT;
      const cls = c >= MASTER_AT ? "done" : hard ? "hard" : c > 0 ? "half" : "";
      const label = c >= MASTER_AT ? "✓ クリア" : hard ? `苦手 ${t}回 · ○ ${c} / ${MASTER_AT}` : `○ ${c} / ${MASTER_AT}`;
      const sub = subHTML(s);
      return `<li class="${cls}"><span class="main">${esc(mainText(s))}</span><span class="pill ${cls}">${label}</span><span class="sub">${sub}</span></li>`;
    }).join("");
    return `<h3 style="--tag:${u.color}">${esc(u.label)}</h3><ul>${rows}</ul>`;
  }).join("");
  el.progress.innerHTML = `
    <div class="progress-head">
      <h2>進み具合</h2>
      <span class="sum mono"><span style="color:var(--ok)">✓ ${done}</span><span style="color:var(--shu-deep)">○1 ${half}</span><span style="color:var(--shu)">苦手 ${hardN}</span><span>未 ${ITEMS.length - done - half}</span></span>
    </div>
    ${groups}`;
}
/* 全体の進み（覚えた / あと1回 / まだ）は常に表示 */

el.progressBtn.addEventListener("click", () => {
  el.progress.hidden = !el.progress.hidden;
  el.progressBtn.textContent = el.progress.hidden ? "一覧" : "一覧を閉じる";
  document.querySelector(".app").classList.toggle("listing", !el.progress.hidden);
  if (!el.progress.hidden) { renderProgress(); el.progress.scrollTop = 0; }
  else fitPrompt();
});

function showSummary() {
  clearTimer();
  state.current = null;
  // 周が終わったらまとめは出さず、そのまま次の周へ（覚えた文を外し、補充して組み直す）
  if (state.roundTotal > 0 && pool().length > 0) return startRound();
  el.promptArea.hidden = true;
  el.answerArea.hidden = true;
  el.actions.hidden = true;
  el.hint.hidden = true;
  el.meta.hidden = true;
  el.summary.hidden = false;
  el.summary.innerHTML = `
    <h2>全部クリア済み</h2>
    <p>すべての文を ${MASTER_AT} 回続けて言えています。</p>
    <button class="btn primary" id="restoreRound" type="button" style="align-self:flex-start">クリア済みを戻してもう1周</button>
  `;
  $("restoreRound").addEventListener("click", restore);
  $("restoreRound").focus({ preventScroll: true });
  render();
}

function restore() {
  state.streak = {};
  state.deck = [];
  saveStreak();
  startRound();
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
/* "コン[フュー]ズ" → 強勢部分を <span class="acc"> で囲む */
function kanaHTML(kana) {
  // 「・」かスペースの位置でだけ折り返す。先に区切ってから強勢マークを付ける（タグ内の空白を壊さない）
  return String(kana).split(/([・ 　]+)/).map((c, i) => {
    if (i % 2) return esc(c) + "<wbr>";
    const marked = esc(c).replace(/\[([^\]]+)\]/g, '<span class="acc">$1</span>');
    return `<span class="chunk">${marked}</span>`;
  }).join("");
}

/* ---- timer (optional) ---- */
function startTimer() {
  const sec = Number(el.timeLimit.value);
  if (!sec) { el.timer.hidden = true; el.gauge.hidden = true; return; }
  el.timer.hidden = false;
  el.gauge.hidden = false;
  el.timerBar.classList.remove("run");
  el.timerBar.style.transitionDuration = "0s";
  el.timerBar.style.transform = "";
  void el.timerBar.offsetWidth; // restart the transition
  el.timerBar.style.transitionDuration = sec + "s";
  el.timerBar.classList.add("run");
  const end = Date.now() + sec * 1000;
  const tick = () => { el.timerText.textContent = Math.max(0, (end - Date.now()) / 1000).toFixed(1); };
  tick();
  state.tickId = setInterval(tick, 100);
  state.timerId = setTimeout(() => reveal(true), sec * 1000);
}
function clearTimer() {
  if (el.timerBar.classList.contains("run")) {
    const w = getComputedStyle(el.timerBar).transform;   // freeze at the current width
    el.timerBar.classList.remove("run");
    el.timerBar.style.transitionDuration = "0s";
    el.timerBar.style.transform = w === "none" ? "" : w;
  }
  clearTimeout(state.timerId); clearInterval(state.tickId);
  state.timerId = state.tickId = null;
}

/* ---- speech (browser built-in) ---- */
let currentUtterance = null;        // iPhone は参照を持っていないと途中で止まることがある
let voicesReady = false;
if ("speechSynthesis" in window) {
  const loadVoices = () => { voicesReady = speechSynthesis.getVoices().length > 0; };
  loadVoices();
  speechSynthesis.addEventListener?.("voiceschanged", loadVoices);
}
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /^en[-_]US/i.test(v.lang) && /Samantha|Google US|Microsoft/i.test(v.name))
      || vs.find(v => /^en[-_]US/i.test(v.lang))
      || vs.find(v => /^en/i.test(v.lang))
      || null;
}
function makeUtterance(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.95;
  u.volume = 1;
  const v = pickVoice();
  if (v) u.voice = v;
  u.onstart = () => { renderPause(); };
  u.onend = u.onerror = () => { if (currentUtterance === u) { currentUtterance = null; userPaused = false; } renderPause(); };
  return u;
}
function speakText(text) {
  const go = () => {
    if (speechSynthesis.paused) speechSynthesis.resume();
    userPaused = false;
    lastSpoken = text;
    currentUtterance = makeUtterance(text);
    speechSynthesis.speak(currentUtterance);
  };
  // iPhone は cancel() の直後に speak() すると鳴らないことがあるので、少し待ってから
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(go, 120);
  } else {
    go();
  }
}
function speak() {
  if (!("speechSynthesis" in window) || state.current == null) return;
  const item = ITEMS[state.current];
  const text = KINDS[item.kind].speak?.(item);
  if (text) speakText(text);
}

/* 読み上げボタンは、鳴っている間は ⏸（一時停止）、止めている間は ▶（再開）になる */
let userPaused = false, lastSpoken = "";
function renderPause() {
  if (!("speechSynthesis" in window)) return;
  const playing = !!currentUtterance && speechSynthesis.speaking && !speechSynthesis.paused && !userPaused;
  for (const b of [el.speakBtn, el.speakBtn2]) {
    b.classList.toggle("playing", playing);
    b.classList.toggle("paused", userPaused);
    b.title = userPaused ? "再開" : playing ? "一時停止" : "読み上げ";
    b.setAttribute("aria-label", b.title);
  }
}
/* ボタンを押したとき: 止めていれば再開、鳴っていれば一時停止、それ以外は読み上げ */
function speakOrPause() {
  if (!("speechSynthesis" in window)) return;
  if (userPaused || (currentUtterance && speechSynthesis.speaking && !speechSynthesis.paused)) togglePause();
  else speak();
}
function togglePause() {
  if (!("speechSynthesis" in window)) return;
  if (userPaused) {                                           // 再開
    userPaused = false;
    const u = currentUtterance, text = lastSpoken;
    let resumed = false;
    if (u) { u.onresume = () => { resumed = true; }; u.onboundary = () => { resumed = true; }; }
    try { speechSynthesis.resume(); } catch {}
    // iPhone では resume() が効かないことがあるので、少し待っても進まなければ最初から読み直す
    setTimeout(() => { if (!resumed && !userPaused && text && currentUtterance === u && (speechSynthesis.paused || !speechSynthesis.speaking)) speakText(text); }, 1200);
  } else if (currentUtterance && speechSynthesis.speaking && !speechSynthesis.paused) {   // 一時停止
    try { speechSynthesis.pause(); userPaused = true; } catch {}
  }
  renderPause();
}

/* iPhone の Safari はタップの中で始めた音声しか鳴らさない。
   そこで「言えた / もう一度」を押した瞬間に、無音の短い発話 → 次の答え の順でキューに入れ、
   無音の発話が実際に始まったところで pause() する（始まる前の pause は iPhone では無視される）。
   時間切れになったら resume() して答えを鳴らす */
let primed = null, primedText = "", primedStarted = false, primedHeld = false, lastCancelAt = 0;
function cancelSpeech() {
  try { speechSynthesis.cancel(); if (speechSynthesis.paused) speechSynthesis.resume(); } catch {}
  lastCancelAt = Date.now();
  userPaused = false; currentUtterance = null;
  renderPause();
}
function primeSpeech(item) {
  if (!("speechSynthesis" in window) || !el.autoSpeak.checked || !item) return;
  const text = KINDS[item.kind].speak?.(item);
  if (!text) return;
  if (primed && primedText === text) return;   // すでに同じ答えを用意済み
  try {
    // 前の答えがまだ鳴っている最中（答えが鳴ってすぐ「言えた」を押した）に cancel() 直後の speak() をすると、
    // iPhone では無音の発話が飛ばされて次の答えがそのまま鳴ってしまう。止めてから少し待って用意する
    const busy = speechSynthesis.speaking || speechSynthesis.pending || speechSynthesis.paused || Date.now() - lastCancelAt < 250;
    cancelSpeech();
    const silent = new SpeechSynthesisUtterance("a a a");
    silent.volume = 0; silent.lang = "en-US"; silent.rate = 0.8;
    const u = makeUtterance(text);
    const mine = [silent, u];
    primed = mine; primedText = text; primedStarted = false; primedHeld = false;
    silent.onstart = () => {           // 実際に話し始めてから止める
      if (primed !== mine) return;
      try { speechSynthesis.pause(); primedHeld = true; } catch {}
    };
    u.onstart = () => {
      primedStarted = true;
      // この答えの問題が開いているとき以外に鳴り始めたら止める（保険）
      const shown = state.revealed && state.current != null && ITEMS[state.current] === item;
      if (primed === mine && !shown) {
        cancelSpeech();
        primed = null;
      } else { currentUtterance = u; lastSpoken = text; userPaused = false; renderPause(); }   // 一時停止ボタンの対象にする
    };
    const start = () => { if (primed !== mine) return; speechSynthesis.speak(silent); speechSynthesis.speak(u); };
    if (busy) setTimeout(start, 160); else start();
  } catch { primed = null; }
}
let playToken = 0;
function playPrimed() {
  if (!("speechSynthesis" in window)) return;
  const text = primedText;
  const token = ++playToken, cur = state.current;
  if (primed) {
    primed = null;
    primedStarted = false;
    try { speechSynthesis.resume(); } catch {}
    // 再開しても始まらなかったら（パソコンなど、または止め損ねた場合）ふつうに読み上げる。
    // ただしその間に次の問題へ進んでいたら何もしない
    setTimeout(() => { if (!primedStarted && playToken === token && state.current === cur && state.revealed) speakText(text); }, 700);
  } else if (text && state.current != null && KINDS[ITEMS[state.current].kind].speak?.(ITEMS[state.current]) === text) {
    speakText(text);    // 早く鳴りかけて止めた場合はここで鳴らしてみる
  } else {
    speak();
  }
}
function dropPrimed() {
  if (!primed) return;
  primed = null;
  cancelSpeech();
}
/* 次に出る問題（周の切れ目では未定） */
const upcoming = () => state.queue.length ? ITEMS[state.queue[0]] : null;
if (!("speechSynthesis" in window)) { el.speakBtn.hidden = true; el.speakBtn2.hidden = true; }
// iPhone などは一度ユーザー操作の中で speak() を呼ばないと、タイマーからの読み上げが鳴らない
let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked || !("speechSynthesis" in window)) return;
  speechUnlocked = true;
  try {
    speechSynthesis.getVoices();
    const u = new SpeechSynthesisUtterance("");
    u.lang = "en-US";
    speechSynthesis.speak(u);
  } catch {}
}
document.addEventListener("pointerdown", unlockSpeech, { once: true, capture: true });
document.addEventListener("touchstart", unlockSpeech, { once: true, capture: true, passive: true });
document.addEventListener("keydown", unlockSpeech, { once: true, capture: true });

/* ---- swipe up on the card = もう一度 ---- */
(() => {
  const card = el.card;
  let startX = 0, startY = 0, startT = 0, active = false, dragging = false, swallowClick = false;
  let onBtn = false, lastTapT = 0, lastTapX = 0, lastTapY = 0, flying = false, firedAt = 0;   // ダブルタップ判定用
  const THRESH = 70, TAP_MS = 400, DOUBLE_MS = 450, DOUBLE_PX = 60;
  const isBtn = (t) => !!(t && t.closest && t.closest("button, a, select, label, input"));
  /* ダブルタップ／ダブルクリック ＝ 言えた（答えを見る前でもよい） */
  const sayOk = () => {
    if (state.current == null || flying) return;
    flying = true; firedAt = Date.now(); lastTapT = 0;
    primeSpeech(upcoming());                                   // タップ操作の中で次の答えの音声を用意しておく
    card.classList.add("stamped");
    setTimeout(() => { card.classList.add("fly"); }, 260);
    setTimeout(() => {
      if (!state.revealed) { state.revealed = true; el.card.classList.add("revealed"); }
      grade(true);
      card.classList.remove("stamped", "fly");
      flying = false;
    }, 460);
  };
  card.addEventListener("dblclick", (e) => {                   // ブラウザ標準のダブルクリックでも
    if (isBtn(e.target)) return;
    e.preventDefault();
    if (Date.now() - firedAt < 800) return;                    // タップ判定の側で処理済み
    sayOk();
  });
  // a drag that started on a button must not also fire that button
  card.addEventListener("click", (e) => {
    if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; }
  }, true);
  card.addEventListener("pointerdown", (e) => {
    if (state.current == null || e.button !== 0 || flying) return;
    active = true; dragging = false; swallowClick = false;
    onBtn = isBtn(e.target);                                   // ボタンの連打は対象外
    startX = e.clientX; startY = e.clientY; startT = Date.now();
  });
  card.addEventListener("pointermove", (e) => {
    if (!active) return;
    const dy = e.clientY - startY, dx = e.clientX - startX;
    if (!dragging && Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) {
      dragging = true; swallowClick = true; card.classList.add("dragging");
      try { card.setPointerCapture(e.pointerId); } catch {}
    }
    if (!dragging) return;
    const canBack = state.history.length > 0;
    const y = canBack ? Math.max(-400, Math.min(dy, 160)) : Math.min(0, dy);   // 下へは履歴があるときだけ動く
    card.style.transform = `translateY(${y}px)`;
    card.style.opacity = String(Math.max(.35, 1 - Math.abs(y) / 300));
  });
  const end = (e) => {
    if (!active) return;
    active = false;
    const dy = e.clientY - startY;
    const fast = Date.now() - startT < 250 && dy < -30;
    const fastDown = Date.now() - startT < 250 && dy > 30;
    card.classList.remove("dragging");
    if (dragging && (dy > THRESH || fastDown) && state.history.length) {   // 下スワイプ ＝ 前の問題に戻る
      card.classList.add("settle");
      card.style.transform = ""; card.style.opacity = "";
      setTimeout(() => card.classList.remove("settle"), 200);
      undoLast();
    } else if (dragging && (dy < -THRESH || fast)) {
      card.style.transform = ""; card.style.opacity = "";
      primeSpeech(upcoming());   // タップ操作の中で次の答えの音声を用意しておく
      card.classList.add("fly");
      setTimeout(() => {
        if (!state.revealed) { state.revealed = true; el.card.classList.add("revealed"); }
        grade(false);
        card.classList.remove("fly");
      }, 200);
    } else if (dragging) {
      card.classList.add("settle");
      card.style.transform = ""; card.style.opacity = "";
      setTimeout(() => card.classList.remove("settle"), 200);
    } else {                                                   // タップ。短い間隔で同じ場所を2回なら「言えた」
      const now = Date.now();
      const tap = now - startT < TAP_MS && !onBtn && Math.abs(dy) < 10;
      if (tap && now - lastTapT < DOUBLE_MS && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < DOUBLE_PX) {
        sayOk();
      } else {
        lastTapT = tap ? now : 0; lastTapX = e.clientX; lastTapY = e.clientY;
      }
    }
    dragging = false;
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
})();

/* ---- wiring ---- */
el.revealBtn.addEventListener("click", () => reveal());
el.sheetBtn.addEventListener("click", () => reveal());
el.okBtn.addEventListener("click", () => grade(true));
el.againBtn.addEventListener("click", () => grade(false));
el.speakBtn.addEventListener("click", speakOrPause);
el.speakBtn2.addEventListener("click", speakOrPause);
el.resetBtn.addEventListener("click", startRound);
el.restoreBtn.addEventListener("click", () => {
  if (masteredCount() === 0) return;
  if (confirm("クリア済みの文をすべて出題に戻しますか？")) restore();
});
/* バッジの診断: ボタンを押したときに状況を表示する（実機でうまくいかないときの手がかり） */
async function badgeDiag(extra) {
  const lines = [];
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  lines.push("ホーム画面アプリとして起動: " + (standalone ? "はい" : "いいえ"));
  lines.push("枠（iframe）の中: " + (window.self !== window.top ? "はい" : "いいえ"));
  lines.push("バッジAPI: " + ("setAppBadge" in navigator ? "あり" : "なし"));
  lines.push("通知の許可: " + ("Notification" in window ? Notification.permission : "機能なし"));
  lines.push("アプリの版: " + APP_VER);
  if (extra) lines.push(extra);
  if ("setAppBadge" in navigator) {
    try { await navigator.setAppBadge(dailyLeft()); lines.push("バッジ設定: 成功（あと " + dailyLeft() + "）"); }
    catch (e) { lines.push("バッジ設定: 失敗 " + (e && e.name ? e.name + ": " + e.message : String(e))); }
  }
  return lines.join("\n");
}
function showNotice(text) { el.noticeText.textContent = text; el.notice.hidden = false; }
el.noticeClose.addEventListener("click", () => { el.notice.hidden = true; });
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r("（応答なし）"), ms))]);
el.badgeBtn.addEventListener("click", async () => {
  const st = window.self !== window.top ? "none" : badgeState();   // 枠の中では iOS がバッジを拒否する
  showNotice("確認中…");
  let extra = "";
  if (st === "ask") {
    try { extra = "許可の結果: " + await withTimeout(Promise.resolve(Notification.requestPermission()), 4000); }
    catch (e) { extra = "許可の要求でエラー: " + (e && e.name ? e.name + ": " + e.message : String(e)); }
  }
  renderBadgeBtn(); lastBadge = null; updateBadge();
  const diag = await withTimeout(badgeDiag(extra), 4000);
  if (st === "none") showNotice(BADGE_HELP + "\n\n[診断]\n" + diag);
  else if (st === "denied") showNotice("通知が許可されていないのでバッジを出せません。iPhone の「設定」→ 通知 → このアプリ で許可してください。\n\n[診断]\n" + diag);
  else showNotice("[診断]\n" + diag + "\n\nこの内容を Claude に送ると原因を調べられます。");
});
renderBadgeBtn();
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });   // 日付が変わっていれば表示とバッジを更新
el.timeLimit.value = String(store.get("timeLimit", 3));
el.autoSpeak.checked = store.get("autoSpeak", true);
el.autoSpeak.addEventListener("change", () => store.set("autoSpeak", el.autoSpeak.checked));
el.timeLimit.addEventListener("change", () => {
  store.set("timeLimit", Number(el.timeLimit.value));
  if (state.current != null && !state.revealed) { clearTimer(); startTimer(); }
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space" || e.key === "Enter") {
    e.preventDefault();
    if (state.current == null) { $("restoreRound")?.click(); return; }
    if (!state.revealed) reveal(); else grade(true);
  } else if (e.key === "1" && state.revealed) { grade(true); }
  else if (e.key === "2" && state.revealed) { grade(false); }
  else if (e.key === "s") { speak(); }
  else if (e.key === "p") { togglePause(); }
  else if (e.key === "Backspace" || e.key === "ArrowDown") { e.preventDefault(); undoLast(); }
});

startRound();
initCloud();
