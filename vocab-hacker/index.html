<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vocab Hacker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#12100c">
<style>
  :root {
    --bg: #12100c;
    --panel: #1b1812;
    --edge: #2e2921;
    --ink: #ede3d0;
    --dim: #8a7d66;
    --amber: #f0a548;
    --amber-deep: #b97722;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --jp: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    gap: 14px;
  }

  /* ---- top bar ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .menu-btn {
    background: none;
    border: 1px solid var(--edge);
    border-radius: 6px;
    color: var(--amber);
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1;
    padding: 8px 11px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .menu-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .titles { flex: 1; min-width: 0; }
  .wordmark {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--amber);
    text-transform: uppercase;
  }
  .wordmark::before { content: "> "; color: var(--dim); }
  .deck-name {
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .counter {
    font-size: 12px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
  }
  .counter b { color: var(--ink); font-weight: 600; }
  .counter { text-align: right; flex: none; }
  /* learned words out of the words in the current range: always in view */
  .learned-total { margin-top: 3px; color: var(--amber-deep); white-space: nowrap; }
  .learned-total b { color: var(--amber); }
  .daily-goal { margin-top: 3px; color: var(--dim); white-space: nowrap; }
  .daily-goal b { color: var(--ink); }
  .daily-goal.done { color: #7fcf8a; }
  .daily-goal.done b { color: #7fcf8a; }

  .progress {
    height: 3px;
    background: var(--edge);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress span {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--amber);
    transition: width 0.25s ease;
  }

  /* ---- card ---- */
  .card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 12px;
    /* the card stops growing on tall screens so the buttons stay within thumb
       reach (about 70% down the screen); tighter spacing keeps the revealed
       content inside without scrolling */
    max-height: max(56dvh, 440px);
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 22px 22px 18px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    position: relative;
    overflow-y: auto;
    touch-action: pan-y;
    transition: transform 0.16s ease, opacity 0.16s ease;
  }
  .card.swipe-in { animation: card-in 0.18s ease-out; }
  .card.swipe-back { animation: card-back 0.18s ease-out; }
  .card.swipe-right { animation: card-right 0.2s ease-out; }
  @keyframes card-right {
    from { transform: translateX(-28px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @keyframes card-back {
    from { transform: translateY(-24px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @keyframes card-in {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
  .card:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }
  .card::after {
    /* faint scanline texture, terminal flavor */
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent 0 3px,
      rgba(0, 0, 0, 0.14) 3px 4px
    );
  }

  .num {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 1;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  .fav-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1;
    background: none;
    border: 1px solid var(--edge);
    border-radius: 6px;
    color: var(--dim);
    font-size: 18px;
    line-height: 1;
    padding: 8px 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .fav-btn.active { color: var(--amber); border-color: var(--amber-deep); }
  .fav-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .phon {
    font-family: var(--mono);
    font-size: 17px;
    color: var(--dim);
    letter-spacing: 0.04em;
    margin-top: -8px;
  }
  .phon .spoken {
    display: block;
    font-family: var(--jp);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--dim);
    margin-top: 4px;
  }
  .phon .stress {
    color: var(--amber);
    font-weight: 600;
    text-decoration: underline;
    text-decoration-color: var(--amber-deep);
    text-underline-offset: 4px;
  }

  .streak {
    font-family: var(--jp);
    font-size: 11px;
    color: var(--amber);
    letter-spacing: 0.08em;
    border: 1px solid var(--amber-deep);
    border-radius: 3px;
    padding: 3px 9px;
    max-width: 100%;
    text-align: center;
    line-height: 1.5;
  }

  .speak-btn {
    background: none;
    border: 1px solid var(--edge);
    border-radius: 50%;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--amber);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex: none;
  }
  .speak-btn:active { background: rgba(240, 165, 72, 0.12); }
  .speak-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .speak-btn svg { width: 24px; height: 24px; fill: currentColor; }

  .pos {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--dim);
    text-transform: uppercase;
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 4px 10px;
  }

  /* a word that has come up 10+ times: warning-red count, amber frame, pulsing word */
  .card.stubborn {
    border-color: var(--amber-deep);
    box-shadow: inset 0 0 0 1px rgba(240, 165, 72, 0.35), 0 0 28px rgba(240, 165, 72, 0.16);
  }
  .card.stubborn .num {
    color: #e0684f;
    font-weight: 600;
    background: rgba(224, 104, 79, 0.12);
    border: 1px solid rgba(224, 104, 79, 0.45);
    border-radius: 4px;
    padding: 4px 8px;
    top: 12px;
    left: 12px;
  }
  .card.stubborn .word {
    color: var(--amber);
    text-shadow: 0 0 30px rgba(240, 165, 72, 0.45);
    animation: stubborn-pulse 1.6s ease-in-out infinite;
  }
  @keyframes stubborn-pulse {
    0%, 100% { text-shadow: 0 0 18px rgba(240, 165, 72, 0.3); }
    50% { text-shadow: 0 0 36px rgba(240, 165, 72, 0.7); }
  }
  @media (prefers-reduced-motion: reduce) { .card.stubborn .word { animation: none; } }

  .word.masked { color: var(--dim); letter-spacing: 0.1em; text-shadow: none; }
  .word {
    font-size: clamp(34px, 9vw, 46px);
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink);
    line-height: 1.15;
    overflow-wrap: anywhere;
    text-shadow: 0 0 24px rgba(240, 165, 72, 0.18);
    margin: 0;
  }

  /* one-second recall gauge: drains after the word appears, freezes on reveal */
  .gauge {
    width: min(100%, 240px);
    height: 6px;
    background: var(--edge);
    border-radius: 3px;
    position: relative;
    margin-top: -4px;
    margin-bottom: 6px;
  }
  .gauge-fill {
    display: block;
    height: 100%;
    width: 100%;
    background: var(--amber);
    border-radius: 3px;
  }
  .gauge-label {
    position: absolute;
    right: 0;
    top: 9px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .gauge.over .gauge-fill { background: #b8453a; }
  .gauge.over .gauge-label { color: #d9695c; }
  .gauge.hit .gauge-fill { background: #5fb36a; }
  .gauge.hit .gauge-label { color: #7fcf8a; }

  .meaning {
    font-family: var(--jp);
    font-size: 19px;
    line-height: 1.6;
    min-height: 3.2em;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 30ch;
  }
  .meaning.hidden-state { color: var(--dim); font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; }
  .meaning.revealed { color: var(--amber); }
  .meaning.empty-state { color: var(--dim); font-size: 15px; }

  .hint {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.1em;
  }

  .tip {
    font-family: var(--jp);
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    max-width: 34ch;
    text-align: left;
    border-top: 1px dashed var(--edge);
    padding-top: 10px;
  }
  .tip-label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  /* ---- controls ---- */
  .controls { display: flex; flex-direction: column; gap: 12px; }

  .btn-row { display: flex; gap: 10px; }

  /* wide screens (iPad, landscape, a widened viewer): a second pair of tall
     buttons stands in a column to the right of the card; the row under the
     card stays exactly as on a phone */
  .side-controls { display: none; }
  @media (min-width: 540px) {
    .app {
      max-width: 820px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(140px, 24vw, 200px);
      grid-template-rows: auto auto auto auto;
      grid-template-areas: "header header" "progress progress" "card side" "controls side";
      align-content: start;
      column-gap: 16px;
    }
    /* the card keeps its phone height so the row under it stays where it was */
    .card { min-height: max(56dvh, 440px); }
    header { grid-area: header; }
    .progress { grid-area: progress; }
    .card { grid-area: card; }
    .controls { grid-area: controls; }
    .side-controls { grid-area: side; display: flex; flex-direction: column; gap: 14px; }
    .side-controls button { flex: 1; min-height: 120px; font-size: 18px; padding: 16px 8px; }
  }

  .learned-btn {
    flex: 1.3;
    font-family: var(--jp);
    font-size: 17px;
    font-weight: 600;
    background: rgba(240, 165, 72, 0.08);
    color: var(--amber);
    border: 1.5px solid var(--amber-deep);
    border-radius: 10px;
    padding: 22px 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .learned-btn:active { background: rgba(240, 165, 72, 0.25); }
  .learned-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .next-btn {
    flex: 1;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: var(--amber);
    color: #191307;
    border: none;
    border-radius: 10px;
    padding: 22px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .next-btn:active { background: var(--amber-deep); }
  .next-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* settings live in the menu drawer so the answer buttons sit right under the card */
  .toggle-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 20px 6px;
    font-size: 13px;
    color: var(--ink);
  }
  .toggle-row label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: var(--jp); }
  .toggle-row input { accent-color: var(--amber); width: 18px; height: 18px; flex: none; }

  /* ---- drawer menu ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 10;
  }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(300px, 82vw);
    background: var(--panel);
    border-right: 1px solid var(--edge);
    z-index: 11;
    padding: calc(20px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto;
    transform: translateX(-105%);
    transition: transform 0.22s ease;
  }
  .drawer.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    .drawer { transition: none; }
    .progress span { transition: none; }
  }
  .drawer-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--amber);
    text-transform: uppercase;
    padding: 0 20px 14px;
    border-bottom: 1px solid var(--edge);
  }
  .drawer-title::before { content: "> "; color: var(--dim); }
  .drawer-section {
    font-family: var(--jp);
    font-size: 12px;
    color: var(--dim);
    padding: 18px 20px 6px;
    letter-spacing: 0.08em;
  }
  .deck-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    text-align: left;
    padding: 13px 20px 13px 17px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .deck-btn .cnt { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .deck-btn.active { border-left-color: var(--amber); color: var(--amber); background: rgba(240, 165, 72, 0.07); }
  .deck-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .deck-btn .star { color: var(--amber); }

  .range-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 20px 4px;
    flex-wrap: wrap;
  }
  .range-row input {
    width: 76px;
    font-family: var(--mono);
    font-size: 16px; /* iOS Safari auto-zooms the page on inputs smaller than 16px */
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 8px 6px;
    text-align: center;
  }
  .range-row input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .range-row .tilde { color: var(--dim); }
  .range-btn {
    font-family: var(--jp);
    font-size: 12px;
    background: none;
    color: var(--amber);
    border: 1px solid var(--amber-deep);
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .range-btn.quiet { color: var(--dim); border-color: var(--edge); }
  .range-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .range-note {
    font-family: var(--jp);
    font-size: 11px;
    color: var(--dim);
    padding: 0 20px 12px;
    line-height: 1.5;
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+JP:wght@400;500&amp;display=swap">

<div class="app">
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="単語帳メニューを開く" aria-expanded="false">≡</button>
    <div class="titles">
      <div class="wordmark">Vocab_Hacker</div>
      <div class="deck-name" id="deckName">LV.4 UPPER-INTERMEDIATE</div>
    </div>
    <div class="counter">
      <div><b id="seen">001</b>/<span id="total">000</span></div>
      <div class="learned-total" id="learnedTotal" title="覚えた数 / 範囲内の単語数">✓ <b>0</b>/0</div>
      <div class="daily-goal" id="dailyGoal" title="今日覚えた数 / 1日の目標">今日 <b>0</b>/100</div>
    </div>
  </header>

  <div class="progress"><span id="bar"></span></div>

  <div class="card" id="card" role="button" tabindex="0" aria-label="カードをタップして意味を表示">
    <div class="num" id="numEl" hidden></div>
    <button class="fav-btn" id="favBtn" aria-label="お気に入りに追加" aria-pressed="false">☆</button>
    <div class="pos" id="pos">noun</div>
    <div class="streak" id="streakEl" hidden>✓ 1/2</div>
    <h1 class="word" id="word">loading</h1>
    <div class="phon" id="phonEl" hidden aria-label="発音記号。強調部分が第1アクセント"></div>
    <button class="speak-btn" id="speakBtn" aria-label="発音を再生">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.47 4.47 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    </button>
    <div class="gauge" id="gaugeEl" hidden aria-label="意味を思い出すまでの1秒ゲージ"><span class="gauge-fill" id="gaugeFill"></span><span class="gauge-label" id="gaugeLabel">1.0s</span></div>
    <div class="meaning hidden-state" id="meaning">[ TAP TO DECODE ]</div>
    <div class="tip" id="tipEl" hidden><span class="tip-label">&gt; hint</span><span id="tipText"></span></div>
    <div class="hint" id="hint">タップで意味を表示</div>
  </div>

  <div class="controls">
    <div class="btn-row">
      <button class="learned-btn" id="learnedBtn">✓ 覚えた</button>
      <button class="next-btn" id="next">Next ▸</button>
    </div>
  </div>
  <div class="side-controls" aria-label="右側の操作ボタン">
    <button class="learned-btn" id="learnedBtnSide">✓ 覚えた</button>
    <button class="next-btn" id="nextBtnSide">Next ▸</button>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<nav class="drawer" id="drawer" aria-label="単語帳選択">
  <div class="drawer-title">Menu</div>
  <div class="drawer-section">単語帳選択</div>
  <div id="deckList"></div>
  <div id="rangeBox">
    <div class="drawer-section">出題範囲（単語帳の番号）</div>
    <div class="range-row">
      <input type="number" id="rangeFrom" min="1" inputmode="numeric" aria-label="開始番号">
      <span class="tilde">〜</span>
      <input type="number" id="rangeTo" min="1" inputmode="numeric" aria-label="終了番号">
      <button class="range-btn" id="rangeApply">適用</button>
      <button class="range-btn quiet" id="rangeClear">全範囲</button>
    </div>
    <div class="range-note" id="rangeNote"></div>
    <div class="range-row">
      <button class="range-btn quiet" id="resetLearnedBtn">このレベルの「覚えた」をリセット（回数は保持）</button>
    </div>
  </div>
  <div class="drawer-section">表示・音声の設定</div>
  <div class="toggle-row">
    <label><input type="checkbox" id="autoReveal"> 意味をすぐ表示</label>
    <label><input type="checkbox" id="autoSpeak"> 意味表示で自動発音</label>
    <label><input type="checkbox" id="autoTimeout"> 1秒たったら自動で意味表示</label>
    <label><input type="checkbox" id="earphone"> イヤホンのボタンで操作（1回押し：覚えた ／ 2回：次へ ／ 3回：前へ）</label>
    <div class="range-note" id="earphoneNote" hidden>オンの間はこのアプリが「再生中」扱いになり、音楽やポッドキャストは止まります。</div>
  </div>
  <div class="drawer-section">1日の目標</div>
  <div class="range-row">
    <input type="number" id="goalInput" min="1" max="1000" inputmode="numeric" aria-label="1日に覚える目標数">
    <span class="tilde">語/日</span>
    <button class="range-btn" id="goalApply">適用</button>
  </div>
  <div class="range-note" id="goalNote"></div>
  <div class="range-row" id="badgeRow" hidden>
    <button class="range-btn" id="badgeBtn">ホーム画面のアイコンに「今日の残り」をバッジ表示</button>
  </div>

    delete plain.review;
    const at = index + 2 + Math.floor(Math.random() * Math.max(1, deck.length - index - 1));
    deck.splice(Math.min(at, deck.length), 0, plain);
    saveJSON("vh-learned", Array.from(learned));
    saveJSON("vh-unlearned", Array.from(unlearned));
    saveJSON("vh-streaks", streaks);
    saveJSON("vh-reviews", reviews);
    saveJSON("vh-pools", pools);
  }

  function cycleLabel(id) {
    if (id === LEARNED_DECK_ID) return "";
    return " · " + (cycles[id] || 1) + "周目";
  }

  function deckLabel(id) {
    if (id === LEARNED_DECK_ID) {
      const lv = levelById(lastLevelId);
      return "✓ LEARNED" + (lv ? " · " + lv.name.toUpperCase() + rangeLabel(lv.id) : "");
    }
    if (id === FAV_DECK_ID) return "★ FAVORITES";
    const lv = LEVELS.find((l) => l.id === id);
    return lv ? lv.name.toUpperCase() : "";
  }

  function current() { return index >= 0 && index < deck.length ? deck[index] : null; }

  // ---- drawer ----
  function renderDeckList() {
    deckListEl.innerHTML = "";
    LEVELS.forEach((lv) => {
      const remaining = deckWords(lv.id).length;
      const total = lv.words.filter((x) => inRange(lv.id, x)).length;
      const btn = document.createElement("button");
      btn.className = "deck-btn" + (deckId === lv.id ? " active" : "");
      btn.innerHTML = "<span>" + lv.name + (ranges[lv.id] ? "<span class='cnt'>" + rangeLabel(lv.id) + "</span>" : "") +

      btn.addEventListener("click", () => selectDeck(lv.id));
      deckListEl.appendChild(btn);
    });
    // range editor applies to the level currently being studied
    const curLv = levelById(deckId);
    rangeBox.hidden = !curLv;
    if (curLv) {
      const max = maxNum(curLv);
      const r = ranges[deckId] || [1, max];
      rangeFrom.value = r[0]; rangeTo.value = r[1];
      rangeFrom.max = max; rangeTo.max = max;
      rangeNote.textContent = curLv.name + " の番号 1〜" + max + " から出題範囲を指定。範囲を変えると学習セットは組み直されますが、「覚えた」の記録はそのまま保持されます。";
    }

    favDeckBtn.className = "deck-btn" + (deckId === FAV_DECK_ID ? " active" : "");
    favDeckBtn.innerHTML = "<span><span class='star'>★</span> お気に入り</span><span class='cnt'>残り" + favCount + "</span>";
    favDeckBtn.style.fontFamily = "var(--jp)";
    favDeckBtn.addEventListener("click", () => selectDeck(FAV_DECK_ID));
    deckListEl.appendChild(favDeckBtn);
    const learnedCount = learnedInScope().length;
    const learnedDeckBtn = document.createElement("button");
    learnedDeckBtn.className = "deck-btn" + (deckId === LEARNED_DECK_ID ? " active" : "");
    const reviewCount = reviewPool(levelById(deckId) ? deckId : lastLevelId).length;
    learnedDeckBtn.innerHTML = "<span><span class='star'>✓</span> 覚えた単語</span><span class='cnt'>範囲内 " + learnedCount + " / 全体 " + learned.size +

  function openDrawer() {

  function closeDrawer() {

  function selectDeck(id) {
    deckId = id;
    saveJSON("vh-deck", deckId);
    if (levelById(id)) { lastLevelId = id; saveJSON("vh-last-level", lastLevelId); }
    closeDrawer();
    resetDeck();
  }

  // ---- card rendering ----
  function hideMeaning() {
    revealed = false;
    meaningEl.textContent = "[ TAP TO DECODE ]";
    meaningEl.className = "meaning hidden-state";
    hintEl.textContent = "タップで意味 · ↑次へ ↓前へ · 2回タップで覚えた";
    tipEl.hidden = true;
    phonEl.hidden = true;
  }

  function showTip(item) {
    if (!item || !item.t) { tipEl.hidden = true; return; }
    tipText.textContent = item.t;
    tipEl.hidden = false;
  }

  // phonetics carry U+0301 (acute) after the primary-stress vowel; highlight
  // that vowel (plus any glide, length mark or r-coloring that belongs to it)
  function showPhon(item) {
    if (!item || !item.ph) { phonEl.hidden = true; return; }
    const safe = item.ph.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    phonEl.innerHTML = "/ " + safe.replace(/(.́[ɪʊː]*r?)/g, '<span class="stress">$1</span>') + " /";
    // when the voice reads the word inside a frame, say so next to the phonetics
    const spoken = spokenForm(item);
    const bare = item.w.replace(/\s*\[[^\]]*\]/g, "").replace(/[~〜]/g, "").replace(/\s+/g, " ").trim();
    if (spoken !== bare) phonEl.innerHTML += '<span class="spoken">🔊 ' + spoken.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>";
    phonEl.hidden = false;
  }

  // ---- one-second recall gauge ----
  // the bar drains for one second after a word appears; tapping to reveal
  // freezes it (green when in time), running out turns it red
  const GAUGE_MS = 1000;
  let gaugeRaf = 0;
  let gaugeStart = 0;
  let gaugeDone = false;
  let gaugeAfterSpeech = null;
  function nowMs() { return typeof performance !== "undefined" && performance.now ? performance.now() : Date.now(); }
  function raf(fn) { return window.requestAnimationFrame ? window.requestAnimationFrame(fn) : setTimeout(fn, 16); }
  function caf(h) { if (window.cancelAnimationFrame) window.cancelAnimationFrame(h); else clearTimeout(h); }
  function hideGauge() { caf(gaugeRaf); gaugeEl.hidden = true; }
  function startGauge() {
    caf(gaugeRaf);
    if (autoReveal) { gaugeEl.hidden = true; return; }
    gaugeEl.hidden = false;
    gaugeEl.className = "gauge";
    gaugeFill.style.width = "100%";
    gaugeLabel.textContent = "1.0s";
    gaugeDone = false;
    gaugeStart = nowMs();
    const owner = current();
    const tick = () => {
      if (current() !== owner) return; // the card changed under this gauge
      const left = Math.max(0, GAUGE_MS - (nowMs() - gaugeStart));
      gaugeFill.style.width = (left / GAUGE_MS) * 100 + "%";
      gaugeLabel.textContent = (left / 1000).toFixed(1) + "s";
      if (left > 0) { gaugeRaf = raf(tick); return; }
      gaugeDone = true;
      gaugeEl.classList.add("over");
      gaugeLabel.textContent = "TIME OVER";
      if (autoTimeout && !revealed && current()) reveal();
    };
    gaugeRaf = raf(tick);
  }
  function stopGauge() {
    if (gaugeEl.hidden || gaugeDone) return;
    caf(gaugeRaf);
    gaugeDone = true;
    const used = Math.min(GAUGE_MS, nowMs() - gaugeStart);
    gaugeFill.style.width = ((GAUGE_MS - used) / GAUGE_MS) * 100 + "%";
    gaugeEl.classList.add("hit");
    gaugeLabel.textContent = (used / 1000).toFixed(1) + "s ✓";
  }

  function updateFavBtn() {
    const item = current();
    const active = !!item && favorites.has(item.w);
    favBtn.textContent = active ? "★" : "☆";
    favBtn.className = "fav-btn" + (active ? " active" : "");
    favBtn.setAttribute("aria-pressed", active ? "true" : "false");
    favBtn.setAttribute("aria-label", active ? "お気に入りから外す" : "お気に入りに追加");
    favBtn.hidden = !item;
  }

  // brief character-scramble before the meaning settles — the "decode" moment
  function reveal() {
    const item = current();
    if (revealed || !item) return;
    revealed = true;
    stopGauge();
    clearTimeout(gaugeAfterSpeech);
    if (wordMasked) {
      wordMasked = false;
      wordEl.textContent = item.w;
      wordEl.classList.remove("masked");
      posEl.textContent = posLabel(item.p);
    }
    // every deck pronounces the word again as its meaning comes up (in a
    // listening deck that is the second hearing, now with the spelling)
    if (autoSpeak && userInteracted) speak();
    const target = posLabel(item.p).split(" ")[1] + "：" + item.m;
    meaningEl.className = "meaning revealed";
    hintEl.textContent = "↑次へ · ↓前へ · 2回タップで覚えた";
    if (reduceMotion) {
      meaningEl.textContent = target;
      showPhon(item);
      showTip(item);
      return;
    }
    const glyphs = "アイウエオカキクケコサシスセソ0123456789#$%&";
    let tick = 0;
    const total = 8;
    clearInterval(scrambleTimer);
    scrambleTimer = setInterval(() => {
      tick++;
      if (tick >= total) {
        clearInterval(scrambleTimer);
        meaningEl.textContent = target;
        showPhon(item);
        showTip(item);
        return;
      }
      const settled = Math.floor((tick / total) * target.length);
      let out = target.slice(0, settled);
      for (let i = settled; i < target.length; i++) {
        out += glyphs[Math.floor(Math.random() * glyphs.length)];
      }
      meaningEl.textContent = out;
    }, 40);
  }

  function showEmpty() {
    clearInterval(scrambleTimer);
    revealed = false;
    cardEl.classList.remove("stubborn");
    let word = "NO_DATA";
    let msg;
    if (deckId === LEARNED_DECK_ID) {
      msg = "この範囲で覚えた単語はまだありません。「✓ 覚えた」を2回連続で押した単語がここに入り、出題されなくなります。";
    } else if (deckId === FAV_DECK_ID) {
      if (allWords().some((x) => favorites.has(x.w))) {
        word = "ALL_CLEAR";
        msg = "お気に入りは全部覚えました！メニューの「✓ 覚えた単語」から戻せます。";
      } else {
        msg = "お気に入りがまだありません。カード右上の☆をタップすると登録できます。";
      }
    } else {
      word = "ALL_CLEAR";
      msg = "このレベルは全部覚えました！メニューの「✓ 覚えた単語」から戻せます。";
    }
    wordEl.textContent = word;
    posEl.textContent = word === "ALL_CLEAR" ? "complete" : "empty";
    meaningEl.className = "meaning empty-state";
    meaningEl.textContent = msg;
    hintEl.textContent = "";
    seenEl.textContent = pad(0);
    totalEl.textContent = pad(0);
    barEl.style.width = "0%";
    speakBtn.hidden = true;
    streakEl.hidden = true;
    tipEl.hidden = true;
    phonEl.hidden = true;
    numEl.hidden = true;
    hideGauge();
    updateFavBtn();
  }

  function show() {
    const item = current();
    if (!item) { showEmpty(); return; }
    cardEl.scrollTop = 0;
    clearTimeout(gaugeAfterSpeech);
    caf(gaugeRaf);
    gaugeDone = true;
    gaugeEl.hidden = true;
    const listening = speaksOnShow() && !autoReveal;
    // Lv.3 is studied by ear: the word is spoken the instant the card changes;
    // the gauge then waits for the voice (speak() starts it when done)
    revealed = false;
    let waitingForVoice = false;
    if (speaksOnShow() && autoSpeak && userInteracted && speechOK) { speak(); waitingForVoice = listening; }
    wordMasked = listening;
    wordEl.textContent = listening ? MASK : item.w;
    wordEl.classList.toggle("masked", listening);
    posEl.textContent = listening ? "listen" : posLabel(item.p);
    seenEl.textContent = pad(index + 1);
    totalEl.textContent = pad(deck.length);
    barEl.style.width = ((index + 1) / deck.length) * 100 + "%";
    clearInterval(scrambleTimer);
    updateDeckName(deck.filter((x) => !x.review).length);
    speakBtn.hidden = !speechOK;
    const t = triesOf(item.w);
    let numText = item.n ? "#" + String(item.n).padStart(4, "0") : "";
    // a word seen MANY_TRIES times or more is flagged: red count, amber card frame
    const stubborn = (item.review || deckId === LEARNED_DECK_ID ? t : t + 1) >= MANY_TRIES;
    if (item.review || deckId === LEARNED_DECK_ID) {
      numText += (numText ? " · " : "") + (t ? "習得まで" + t + "回" : "回数記録なし");
      if (deckId === LEARNED_DECK_ID && reviewable(item.w)) numText += " · 復習対象";
    } else if (t) {
      numText += (numText ? " · " : "") + (t + 1) + "回目";
    }
    if (stubborn) numText = "⚠ " + numText + " · 要注意";
    cardEl.classList.toggle("stubborn", stubborn);
    numEl.hidden = !numText;
    numEl.textContent = numText;
    answeredThisCard = false;
    const s = deckId === LEARNED_DECK_ID ? 0 : streaks[item.w] || 0;
    streakEl.hidden = !s && !item.review;
    if (item.review) streakEl.textContent = "↻ 復習 · 覚えていれば ✓ · 忘れていたら Next";
    else if (s) streakEl.textContent = "✓ " + s + "/" + LEARN_STREAK + " あと" + (LEARN_STREAK - s) + "回で習得";
    updateFavBtn();
    if (!waitingForVoice) startGauge();
    if (autoReveal) {
      revealed = false;
      reveal();
    } else {
      hideMeaning();
      if (listening) {
        hintEl.textContent = (autoSpeak && userInteracted ? "音声を聞いて意味を思い出す" : "🔊 をタップして音声を再生") + " · タップで単語と意味";
        meaningEl.textContent = "[ LISTEN & DECODE ]";
      }
    }
  }

  function resetDeck() {
    revisiting = false;
    learnedBtn.textContent = learnedBtnSide.textContent = deckId === LEARNED_DECK_ID ? "↺ 覚え直す" : "✓ 覚えた";
    const pool = studySet(deckId, true);
    updateDeckName(pool.length);
    if (pool.length === 0) {
      deck = [];
      index = -1;
      showEmpty();
      return;
    }
    deck = buildDeck(deckId, pool);
    index = 0;
    show();
  }

  // ---- daily goal & home-screen badge ----
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dailyCount() { return daily && daily.date === todayKey() ? (daily.count || 0) : 0; }
  function bumpDaily() {
    const key = todayKey();
    if (!daily || daily.date !== key) daily = { date: key, count: 0 };
    daily.count = (daily.count || 0) + 1;
    saveJSON("vh-daily", daily);
    updateDaily();
  }
  const badgeOK = typeof navigator !== "undefined" && typeof navigator.setAppBadge === "function";
  // the icon badge shows how many words are still to be learned today; it can
  // only change while the app is open (no web app runs in the background)
  function updateBadge() {
    if (!badgeOK) return;
    const left = Math.max(0, dailyGoal - dailyCount());
    try {
      const p = left > 0 ? navigator.setAppBadge(left) : navigator.clearAppBadge();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function updateDaily() {
    const n = dailyCount();
    const left = Math.max(0, dailyGoal - n);
    dailyGoalEl.innerHTML = "今日 <b>" + n + "</b>/" + dailyGoal + (left ? " · あと" + left : " ✓ 達成");
    dailyGoalEl.className = "daily-goal" + (left ? "" : " done");
    updateBadge();
  }

  // learned / total for what is being studied: the level's range, or the favorites
  function updateLearnedTotal() {
    let done = 0, total = 0;
    if (deckId === FAV_DECK_ID) {
      const favs = allWords().filter((x) => favorites.has(x.w));
      total = favs.length;
      done = favs.filter((x) => learned.has(x.w)).length;
    } else {
      const lv = levelById(deckId) || levelById(lastLevelId);
      if (lv) {
        const words = lv.words.filter((x) => inRange(lv.id, x));
        total = words.length;
        done = words.filter((x) => learned.has(x.w)).length;
      }
    }
    learnedTotalEl.innerHTML = "✓ <b>" + done + "</b>/" + total;
  }

  function updateDeckName(setSize) {
    updateLearnedTotal();
    updateDaily();
    updateMediaMetadata();
    const remaining = deckWords(deckId).length;
    const lv = levelById(deckId);
    const learnedHere = lv ? lv.words.filter((x) => learned.has(x.w) && inRange(lv.id, x)).length : 0;
    const reviewing = deck.filter((x) => x.review && stillInDeck(x)).length;
    deckNameEl.textContent = deckLabel(deckId) + (lv ? rangeLabel(deckId) : "") +
      (deckId !== LEARNED_DECK_ID && remaining > setSize ? " · SET " + setSize + " / 残り" + remaining : "") +
      (lv ? " / 覚えた" + learnedHere : "") +
      (reviewing ? " / 復習" + reviewing : "") +
      cycleLabel(deckId);
  }

  function stillInDeck(item) {
    if (deckId === LEARNED_DECK_ID) return learned.has(item.w);
    if (deckId === FAV_DECK_ID && !favorites.has(item.w)) return false;
    if (levelById(deckId) && !inRange(deckId, item)) return false;
    // a review card is only valid while the word is still mastered
    return item.review ? learned.has(item.w) : !learned.has(item.w);
  }

  // swipe down: back to the previous card of this cycle. Looking again is not
  // an answer, so nothing is counted or reset on the way back.
  function prev() {
    if (index <= 0) return false;
    let i = index - 1;
    while (i >= 0 && !stillInDeck(deck[i])) i--;
    if (i < 0) return false;
    index = i;
    show();
    revisiting = true;
    return true;
  }

  function next() {
    const prev = current();
    const wasRevisit = revisiting;
    revisiting = false;
    if (prev && deckId !== LEARNED_DECK_ID) {
      if (prev.review) {
        if (!answeredThisCard && !wasRevisit) forgot(prev);
      } else {
        // every answer counts toward "how many times it took"; leaving a card
        // without pressing 覚えた also breaks that word's streak. A card seen
        // again after a swipe back only counts if 覚えた was pressed on it.
        if (answeredThisCard || !wasRevisit) {
          tries[prev.w] = triesOf(prev.w) + 1;
          saveJSON("vh-tries", tries);
        }
        if (!answeredThisCard && !wasRevisit && streaks[prev.w]) {
          delete streaks[prev.w];
          saveJSON("vh-streaks", streaks);
        }
      }
    }
    do { index++; } while (index < deck.length && !stillInDeck(deck[index]));
    if (index >= deck.length) {
      // a full pass is done: top the set back up with fresh words for the
      // ones learned this cycle, count the cycle, and reshuffle
      const pool = studySet(deckId, true);
      if (pool.length === 0) { deck = []; index = -1; updateDeckName(0); showEmpty(); return; }
      if (deckId !== LEARNED_DECK_ID && deck.length > 0) {
        cycles[deckId] = (cycles[deckId] || 1) + 1;
        saveJSON("vh-cycles", cycles);
      }
      deck = buildDeck(deckId, pool);
      index = 0;
      updateDeckName(pool.length);
    }
    show();
  }

  // pronounce the current word with the device's built-in English voice
  const speechOK = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
  let voice = null;
  // prefer the higher-quality (louder, clearer) system voices when installed
  function pickVoice() {
    if (!speechOK) return;
    const voices = window.speechSynthesis.getVoices();
    const en = voices.filter((v) => v.lang === "en-US");
    const enAny = voices.filter((v) => v.lang && v.lang.indexOf("en") === 0);
    const quality = /enhanced|premium|natural|neural/i;
    voice =
      en.find((v) => quality.test(v.name)) ||
      en.find((v) => /samantha|ava|allison|nicky|siri/i.test(v.name)) ||
      en[0] || enAny.find((v) => quality.test(v.name)) || enAny[0] || null;
  }
  if (speechOK && typeof window.speechSynthesis.addEventListener === "function") {
    window.speechSynthesis.addEventListener("voiceschanged", pickVoice);
  }

  // iOS routes speech through the quiet ringer channel until the page has
  // played media once; a short silent clip on the first tap switches it to
  // the media-volume channel so speech comes out at full volume.
  let audioUnlocked = false;
  const SILENT_WAV = "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
  // ---- earphone buttons ----
  // A page only receives the headset's play/pause, next and previous buttons
  // while it counts as playing media, so a silent loop is kept playing and the
  // Media Session handlers map: play/pause -> 覚えた, next -> 次へ, previous -> 前へ.
  const SILENT_LOOP = "data:audio/wav;base64,UklGRqQ+AABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YYA+AACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC   const mediaOK = typeof navigator !== "undefined" && !!navigator.mediaSession && typeof Audio !== "undefined";
  let keepAlive = null;
  function earphoneAction(fn) {
    return () => {
      fn();
      // the browser would otherwise treat the press as a real pause/stop
      if (keepAlive) { const p = keepAlive.play(); if (p && p.catch) p.catch(() => {}); }
      try { navigator.mediaSession.playbackState = "playing"; } catch (e) {}
    };
  }
  function updateMediaMetadata() {
    if (!mediaOK || !earphone || typeof MediaMetadata === "undefined") return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "Vocab Hacker", artist: deckLabel(deckId) + (levelById(deckId) ? rangeLabel(deckId) : ""), album: "イヤホン操作中 · 1回:覚えた 2回:次へ 3回:前へ" });
    } catch (e) {}
  }
  function startEarphone() {
    if (!mediaOK || !earphone) return;
    if (!keepAlive) {
      keepAlive = new Audio(SILENT_LOOP);
      keepAlive.loop = true;
      keepAlive.setAttribute("playsinline", "");
    }
    const p = keepAlive.play();
    const armed = () => {
      try {
        navigator.mediaSession.setActionHandler("play", earphoneAction(() => { if (current()) toggleLearned(); }));
        navigator.mediaSession.setActionHandler("pause", earphoneAction(() => { if (current()) toggleLearned(); }));
        navigator.mediaSession.setActionHandler("nexttrack", earphoneAction(() => { if (current()) next(); }));
        navigator.mediaSession.setActionHandler("previoustrack", earphoneAction(() => { prev(); }));
        navigator.mediaSession.setActionHandler("stop", earphoneAction(() => {}));
        navigator.mediaSession.playbackState = "playing";
      } catch (e) {}
      updateMediaMetadata();
      setSyncNote("イヤホン操作：有効（1回押し＝覚えた、2回＝次へ、3回＝前へ）");
    };
    if (p && p.then) p.then(armed).catch(() => setSyncNote("イヤホン操作：画面を一度タップすると有効になります。")); else armed();
  }
  function stopEarphone() {
    if (keepAlive) { try { keepAlive.pause(); } catch (e) {} }
    if (mediaOK) {
      ["play", "pause", "nexttrack", "previoustrack", "stop"].forEach((a) => { try { navigator.mediaSession.setActionHandler(a, null); } catch (e) {} });
      try { navigator.mediaSession.playbackState = "none"; navigator.mediaSession.metadata = null; } catch (e) {}
    }
  }

  function unlockAudio() {
    if (audioUnlocked || typeof Audio === "undefined") return;
    try {
      const a = new Audio(SILENT_WAV);
      a.volume = 1;
      const p = a.play();
      if (p && typeof p.then === "function") {
        p.then(() => { audioUnlocked = true; }).catch(() => {});
      } else {
        audioUnlocked = true;
      }
    } catch (e) {}
  }

  // words whose stress (or -ate ending) depends on the part of speech: read
  // alone, the voice picks its default reading, which often disagrees with the
  // phonetics shown. A tiny frame ("to object" / "the record" / "very content")
  // makes the voice choose the reading the card means.
  const HETERONYMS = new Set(("abstract address adult advocate affiliate ally alternate appropriate associate combine compact complex compound " +
    "concert concrete conduct conflict construct content contest contract contrast convert convict coordinate correlate decrease defect " +
    "delegate desert detail dictate discharge discount duplicate elaborate escort estimate excess exploit extract finance graduate impact " +
    "import increase insert intimate minute moderate nominate object offset overflow perfect permit present produce progress project " +
    "protest rebel recall recess record refund refuse reject research segment separate simulate sophisticate subject subordinate " +
    "supplement survey suspect torment transfer transform transport update upgrade upset").split(" "));
  function spokenForm(item) {
    // phrases carry notation like "give [lend] A a hand" or "How come ~?": read the plain form
    const plain = item.w.replace(/\s*\[[^\]]*\]/g, "").replace(/[~〜]/g, "").replace(/\s+/g, " ").trim() || item.w;
    if (!HETERONYMS.has(plain.toLowerCase())) return plain;
    if (item.p === "verb") return "to " + plain;
    if (item.p === "noun") return "the " + plain;
    if (item.p === "adj") return "very " + plain;
    return plain;
  }

  // listening decks: the word is hidden and only spoken when the card shows;
  // the spelling comes up together with the meaning on reveal
  const LISTEN_LEVELS = ["3", "4"];
  function speaksOnShow() { return LISTEN_LEVELS.indexOf(deckId) !== -1; }
  const MASK = "● ● ● ●";
  let wordMasked = false;

  function speak() {
    const item = current();
    if (!speechOK || !item) return;
    unlockAudio();
    if (!voice) pickVoice();
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
    const u = new window.SpeechSynthesisUtterance(spokenForm(item));
    u.lang = "en-US";
    if (voice) u.voice = voice;
    u.volume = 1;
    u.rate = 0.9;
    u.pitch = 1;
    // in a listening deck the one-second gauge only starts once the word has
    // been heard (a safety timer covers voices that never report the end)
    if (speaksOnShow() && !revealed && !autoReveal) {
      gaugeEl.hidden = true;
      clearTimeout(gaugeAfterSpeech);
      const begin = () => { clearTimeout(gaugeAfterSpeech); if (!revealed && current() === item) startGauge(); };
      u.onend = begin;
      u.onerror = begin;
      gaugeAfterSpeech = setTimeout(begin, 2500);
    }
    window.speechSynthesis.speak(u);
  }

  // 覚えた = one correct answer; LEARN_STREAK correct answers in a row master
  // the word (it leaves the study set). Skipping a word with Next resets its
  // streak — see next(). In the learned deck the button restores the word.
  function toggleLearned() {
    const item = current();
    if (!item) return;
    if (deckId === LEARNED_DECK_ID) {
      learned.delete(item.w);
      unlearned.add(item.w);
      delete streaks[item.w];
      delete reviews[item.w];
      delete mastered[item.w];
      saveJSON("vh-mastered", mastered);
      saveJSON("vh-learned", Array.from(learned));
      saveJSON("vh-unlearned", Array.from(unlearned));
      saveJSON("vh-streaks", streaks);
      saveJSON("vh-reviews", reviews);
      answeredThisCard = true;
      next();
      return;
    }
    if (item.review) {
      // still known: one more review pass, and it rests longer before the next
      const r = reviews[item.w] || { ok: 0, last: 0 };
      reviews[item.w] = { ok: (r.ok || 0) + 1, last: cycles[deckId] || 1 };
      saveJSON("vh-reviews", reviews);
      answeredThisCard = true;
      next();
      return;
    }
    const s = (streaks[item.w] || 0) + 1;
    if (s >= LEARN_STREAK) {
      delete streaks[item.w];
      learned.add(item.w);
      unlearned.delete(item.w);
      mastered[item.w] = cycles[deckId] || 1;
      bumpDaily();
      saveJSON("vh-unlearned", Array.from(unlearned));
      saveJSON("vh-mastered", mastered);
      // drop it from every study set; studySet() refills the gap on next()
      Object.keys(pools).forEach((k) => {
        if (Array.isArray(pools[k])) pools[k] = pools[k].filter((w) => w !== item.w);
      });
      saveJSON("vh-pools", pools);
      saveJSON("vh-learned", Array.from(learned));
    } else {
      streaks[item.w] = s;
    }
    saveJSON("vh-streaks", streaks);
    answeredThisCard = true;
    next();
  }

  function toggleFavorite() {
    const item = current();
    if (!item) return;
    if (favorites.has(item.w)) favorites.delete(item.w);
    else favorites.add(item.w);
    saveJSON("vh-favorites", Array.from(favorites));
    updateFavBtn();
  }

  // ---- events ----
  // swipe up on the card = Next. Only one case is left to native scrolling: a

  // the bottom. A flick (under 0.6 s) or a long swipe (120px+) always advances.
  let touchStartX = 0, touchStartY = 0, touchStartAt = 0, touchStartAtBottom = true, touchStartAtTop = true, swipedAt = 0;
  function advanceBySwipe() {
    swipedAt = Date.now();
    // the next card (and its audio in a listening deck) starts the moment the
    // swipe ends; the slide is applied to the incoming card, not waited for
    next();
    if (reduceMotion) return;
    cardEl.classList.remove("swipe-in");
    void cardEl.offsetWidth;
    cardEl.classList.add("swipe-in");
    setTimeout(() => cardEl.classList.remove("swipe-in"), 200);
  }
  function learnedBySwipe() {
    swipedAt = Date.now();
    if (reduceMotion) { toggleLearned(); return; }
    cardEl.classList.remove("swipe-in", "swipe-back", "swipe-right");
    void cardEl.offsetWidth;
    cardEl.classList.add("swipe-right");
    toggleLearned();
    setTimeout(() => cardEl.classList.remove("swipe-right"), 220);
  }
  function backBySwipe() {
    swipedAt = Date.now();
    if (!prev()) return;
    if (reduceMotion) return;
    cardEl.classList.remove("swipe-in", "swipe-back");
    void cardEl.offsetWidth;
    cardEl.classList.add("swipe-back");
    setTimeout(() => cardEl.classList.remove("swipe-back"), 200);
  }
  let touchLastX = 0, touchLastY = 0, touchActive = false;
  cardEl.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStartX = touchLastX = t.clientX;
    touchStartY = touchLastY = t.clientY;
    touchStartAt = Date.now();
    touchActive = true;
    touchStartAtBottom = cardEl.scrollHeight - cardEl.scrollTop - cardEl.clientHeight < 4;
    touchStartAtTop = cardEl.scrollTop < 4;
  }, { passive: true });
  cardEl.addEventListener("touchmove", (e) => {
    const t = e.changedTouches[0];
    touchLastX = t.clientX;
    touchLastY = t.clientY;
  }, { passive: true });
  function endSwipe(x, y) {
    if (!touchActive) return;
    touchActive = false;
    const dx = x - touchStartX;
    const dy = y - touchStartY;
    const flick = Date.now() - touchStartAt < 700;
    const longSwipe = Math.abs(dy) > 100;
    if (!current()) return;
    // whichever axis the finger moved more along decides; no dead zone for
    // slanted swipes (a thumb rarely moves perfectly straight). Sideways
    // swipes do nothing.
    if (Math.abs(dx) > Math.abs(dy)) return;
    if (dy < -45 && (touchStartAtBottom || flick || longSwipe)) {
      advanceBySwipe();
    } else if (dy > 45 && (touchStartAtTop || flick || longSwipe)) {
      backBySwipe();
    }
  }
  cardEl.addEventListener("touchend", (e) => {
    const t = e.changedTouches[0];
    endSwipe(t ? t.clientX : touchLastX, t ? t.clientY : touchLastY);
  }, { passive: true });
  // once the card starts scrolling the browser may cancel the touch instead of
  // ending it; judge the gesture from the last position seen
  cardEl.addEventListener("touchcancel", () => endSwipe(touchLastX, touchLastY), { passive: true });
  let lastTapAt = 0;
  cardEl.addEventListener("click", () => {
    if (Date.now() - swipedAt < 400) return;
    const now = Date.now();
    if (now - lastTapAt < 320) {
      // second tap in quick succession: 覚えた
      lastTapAt = 0;
      if (current()) toggleLearned();
      return;
    }
    lastTapAt = now;
    reveal();
  });
  cardEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); }
  });
  favBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleFavorite();
  });
  speakBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    speak();
  });
  nextBtn.addEventListener("click", next);
  learnedBtn.addEventListener("click", toggleLearned);
  nextBtnSide.addEventListener("click", next);
  learnedBtnSide.addEventListener("click", toggleLearned);
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); prev(); }
    if (e.key === "Escape") closeDrawer();
  });
  menuBtn.addEventListener("click", openDrawer);
  overlayEl.addEventListener("click", closeDrawer);

  function applyRange(from, to) {
    const lv = levelById(deckId);
    if (!lv) return;
    const max = maxNum(lv);
    let a = Math.max(1, Math.min(max, parseInt(from, 10) || 1));
    let b = Math.max(1, Math.min(max, parseInt(to, 10) || max));
    if (a > b) { const t = a; a = b; b = t; }
    if (a === 1 && b === max) delete ranges[deckId];
    else ranges[deckId] = [a, b];
    saveJSON("vh-ranges", ranges);
    if (typeof rangeFrom.blur === "function") { rangeFrom.blur(); rangeTo.blur(); }
    closeDrawer();
    resetDeck();
  }
  rangeApply.addEventListener("click", () => applyRange(rangeFrom.value, rangeTo.value));
  rangeClear.addEventListener("click", () => {
    const lv = levelById(deckId);
    if (lv) applyRange(1, maxNum(lv));
  });
  resetLearnedBtn.addEventListener("click", () => {
    const lv = levelById(deckId);
    if (!lv) return;
    const count = lv.words.filter((x) => learned.has(x.w)).length;
    if (!count) { window.alert(lv.name + " に覚えた単語はありません。"); return; }
    if (!window.confirm(lv.name + " の覚えた " + count + " 語を未習得に戻します。各単語の回数（N回目）はそのまま残ります。よろしいですか？")) return;
    const n = resetLearnedLevel(deckId);
    closeDrawer();
    resetDeck();
    setSyncNote(lv.name + " の " + n + " 語を未習得に戻しました。");
  });

  autoRevealEl.addEventListener("change", () => {
    autoReveal = autoRevealEl.checked;
    saveJSON("vh-auto-reveal", autoReveal);
    if (autoReveal) hideGauge();
    if (autoReveal && !revealed && current()) reveal();
  });
  autoSpeakEl.addEventListener("change", () => {
    autoSpeak = autoSpeakEl.checked;
    saveJSON("vh-auto-speak", autoSpeak);
  });
  autoTimeoutEl.addEventListener("change", () => {
    autoTimeout = autoTimeoutEl.checked;
    saveJSON("vh-auto-timeout", autoTimeout);
  });
  earphoneEl.addEventListener("change", () => {
    earphone = earphoneEl.checked;
    saveJSON("vh-earphone", earphone);
    earphoneNote.hidden = !earphone;
    if (earphone) startEarphone(); else { stopEarphone(); setSyncNote("イヤホン操作：オフ"); }
  });
  if (!mediaOK) { earphoneEl.disabled = true; if (earphoneEl.parentNode && earphoneEl.parentNode.style) earphoneEl.parentNode.style.opacity = "0.5"; }
  // the silent loop can only start from a user gesture: pick it up on the first tap
  goalInput.value = dailyGoal;
  goalNote.textContent = "1日に覚える語数の目標。ヘッダー右上に「今日 N/目標」として表示し、日付が変わると0から数え直します。";
  goalApply.addEventListener("click", () => {
    const v = parseInt(goalInput.value, 10);
    if (!(v > 0)) return;
    dailyGoal = Math.min(1000, v);
    goalInput.value = dailyGoal;
    goalInput.blur();
    saveJSON("vh-daily-goal", dailyGoal);
    updateDaily();
    closeDrawer();
  });
  if (badgeOK) {
    badgeRow.hidden = false;
    badgeNote.hidden = false;
    badgeNote.textContent = "ホーム画面に追加した独立アプリとして開いているときだけ使えます。通知の許可を求められたら「許可」を選ぶと、アイコンに今日の残り数が出ます（数字はアプリを開いている間に更新されます）。";
    badgeBtn.addEventListener("click", () => {
      const done = () => { updateBadge(); setSyncNote("バッジ：有効。アイコンに今日の残り " + Math.max(0, dailyGoal - dailyCount()) + " 語を表示しています。"); };
      if (typeof Notification !== "undefined" && Notification.permission !== "granted" && Notification.requestPermission) {
        Notification.requestPermission().then((r) => { if (r === "granted") done(); else setSyncNote("バッジ：通知が許可されなかったため表示できません。設定アプリ → Vocab Hacker → 通知 で許可できます。"); });
      } else done();
    });
  }
  // records can be carried to another copy of the app (e.g. the home-screen build)
  exportBtn.addEventListener("click", () => {
    const text = JSON.stringify(snapshotState());
    const fallback = () => window.prompt("この内容をコピーして、もう一方のアプリの「記録を読み込む」に貼り付けてください。", text);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => setSyncNote("記録をコピーしました（" + learned.size + " 語の覚えた記録など）。もう一方のアプリで「記録を読み込む」に貼り付けてください。")).catch(fallback);
    } else fallback();
  });
  importBtn.addEventListener("click", () => {
    const text = window.prompt("書き出した記録を貼り付けてください（いまの記録と統合します）。");
    if (!text) return;
    try {
      const incoming = JSON.parse(text);
      if (!incoming || !Array.isArray(incoming.learned)) throw new Error("bad");
      const merged = mergeStates(snapshotState(), incoming);
      applyState(merged);
      closeDrawer();
      resetDeck();
      setSyncNote("記録を読み込んで統合しました（覚えた単語 " + learned.size + " 語）。");
    } catch (e) {
      window.alert("読み込めませんでした。書き出した文字列をそのまま貼り付けてください。");
    }
  });
  // the installable build registers a tiny service worker (not inside the artifact frame)
  if ("serviceWorker" in navigator && window.top === window && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  const markInteracted = () => { userInteracted = true; if (earphone && keepAlive === null) startEarphone(); };
  document.addEventListener("pointerdown", markInteracted, { passive: true });
  document.addEventListener("keydown", markInteracted);

  // ---- cloud sync ----
  // Browser storage inside the claude.ai viewer can be wiped by Safari or
  // lost across republishes, so the full study record is mirrored to the
  // artifact's server-side store and merged back on every load.
  const PROGRESS_DOC = "progress/main";
  let cloudDb = null;
  let syncTimer = null;
  let applyingRemote = false;
  let lastPullAt = 0;

  function snapshotState() {
    return {
      learned: Array.from(learned),
      unlearned: Array.from(unlearned),
      favorites: Array.from(favorites),
      streaks: streaks,
      tries: tries,
      reviews: reviews,
      mastered: mastered,
      daily: daily,
      dailyGoal: dailyGoal,
      pools: pools,
      ranges: ranges,
      cycles: cycles,
      deck: deckId,
      autoReveal: !!autoReveal,
      autoSpeak: !!autoSpeak,
      autoTimeout: !!autoTimeout,
      updatedAt: loadJSON("vh-updated-at", 0)
    };
  }

  function union(a, b) {
    const s = new Set(Array.isArray(a) ? a : []);
    (Array.isArray(b) ? b : []).forEach((x) => s.add(x));
    return Array.from(s);
  }

  // learned words and favorites are never dropped by a merge; everything
  // else follows whichever side was written more recently
  function mergeStates(local, remote) {
    const remoteNewer = (remote.updatedAt || 0) > (local.updatedAt || 0);
    const base = remoteNewer ? remote : local;
    const other = remoteNewer ? local : remote;
    const out = {};
    ["pools", "ranges", "deck", "autoReveal", "autoSpeak", "autoTimeout", "dailyGoal"].forEach((k) => {
      out[k] = base[k] !== undefined && base[k] !== null ? base[k] : other[k];
    });
    // tries: the larger count
    const tr = {};
    [local.tries || {}, remote.tries || {}].forEach((src) => {
      Object.keys(src).forEach((w) => { tr[w] = Math.max(tr[w] || 0, src[w] || 0); });
    });
    out.tries = tr;
    // a word only counts as mastered once its answers were counted; words
    // mastered before that go back to being unlearned. A word the newer side
    // deliberately took out of "learned" stays out.
    const gone = new Set(Array.isArray(base.unlearned) ? base.unlearned : []);
    const baseLearned = new Set(Array.isArray(base.learned) ? base.learned : []);
    out.learned = union(local.learned, remote.learned).filter((w) => tr[w] > 0 && (baseLearned.has(w) || !gone.has(w)));
    out.unlearned = Array.from(gone).filter((w) => !baseLearned.has(w));
    out.favorites = union(local.favorites, remote.favorites);
    // a study set may not carry words the other side has already learned
    const done = new Set(out.learned);
    const pl = {};
    Object.keys(out.pools || {}).forEach((k) => {
      if (Array.isArray(out.pools[k])) pl[k] = out.pools[k].filter((w) => typeof w === "string" && !done.has(w));
    });
    out.pools = pl;
    out.ranges = clone(out.ranges) || {};
    // streaks and review records are transient: the newer side has them right
    // (taking the larger of both would resurrect checks the user already reset)
    const st = {};
    Object.keys(base.streaks || {}).forEach((w) => { if (base.streaks[w] > 0 && !done.has(w)) st[w] = base.streaks[w]; });
    out.streaks = st;
    const rv = {};
    Object.keys(base.reviews || {}).forEach((w) => {
      const r = base.reviews[w];
      if (r && typeof r === "object" && done.has(w)) rv[w] = { ok: r.ok || 0, last: r.last || 0 };
    });
    out.reviews = rv;
    // mastered-at cycle: the larger (later) value, only for words still mastered
    const ma = {};
    [local.mastered || {}, remote.mastered || {}].forEach((src) => {
      Object.keys(src).forEach((w) => { if (done.has(w)) ma[w] = Math.max(ma[w] || 0, src[w] || 0); });
    });
    out.mastered = ma;
    // today's tally: the later day wins, the same day keeps the larger count
    const dl = local.daily || { date: "", count: 0 }, dr = remote.daily || { date: "", count: 0 };
    if ((dl.date || "") === (dr.date || "")) out.daily = { date: dl.date || "", count: Math.max(dl.count || 0, dr.count || 0) };
    else out.daily = (dl.date || "") > (dr.date || "") ? { date: dl.date, count: dl.count || 0 } : { date: dr.date, count: dr.count || 0 };
    const cy = {};
    [local.cycles || {}, remote.cycles || {}].forEach((src) => {
      Object.keys(src).forEach((k) => { cy[k] = Math.max(cy[k] || 0, src[k] || 0); });
    });
    out.cycles = cy;
    out.updatedAt = Math.max(local.updatedAt || 0, remote.updatedAt || 0);
    return out;
  }

  // key order must not count as a difference, or every resume would look like a change
  function stable(x) {
    if (Array.isArray(x)) return x.map(stable);
    if (x && typeof x === "object") {
      const o = {};
      Object.keys(x).sort().forEach((k) => { o[k] = stable(x[k]); });
      return o;
    }
    return x;
  }
  function stateKey(s) {
    return JSON.stringify(stable([(s.learned || []).slice().sort(), (s.unlearned || []).slice().sort(), (s.favorites || []).slice().sort(), s.streaks || {}, s.tries || {}, s.reviews || {}, s.mastered || {}, s.daily || {}, s.dailyGoal || 100, s.pools || {}, s.ranges || {}, s.cycles || {}, s.deck, !!s.autoReveal, !!s.autoSpeak, s.autoTimeout !== false]));
  }

  function applyState(s) {
    applyingRemote = true;
    try {
      // always copy: the merged state may still point into a frozen cloud snapshot
      learned = new Set(s.learned || []);
      unlearned = new Set(s.unlearned || []);
      favorites = new Set(s.favorites || []);
      streaks = clone(s.streaks) || {};
      tries = clone(s.tries) || {};
      reviews = clone(s.reviews) || {};
      mastered = clone(s.mastered) || {};
      saveJSON("vh-mastered", mastered);
      daily = clone(s.daily) || { date: "", count: 0 };
      saveJSON("vh-daily", daily);
      if (s.dailyGoal > 0) { dailyGoal = s.dailyGoal; saveJSON("vh-daily-goal", dailyGoal); }
      pools = cleanPools(clone(s.pools) || {});
      ranges = clone(s.ranges) || {};
      cycles = clone(s.cycles) || {};
      if (s.deck) deckId = s.deck;
      if (levelById(deckId)) { lastLevelId = deckId; saveJSON("vh-last-level", lastLevelId); }
      autoReveal = !!s.autoReveal;
      autoSpeak = !!s.autoSpeak;
      autoTimeout = s.autoTimeout !== false;
      saveJSON("vh-learned", Array.from(learned));
      saveJSON("vh-unlearned", Array.from(unlearned));
      saveJSON("vh-favorites", Array.from(favorites));
      saveJSON("vh-streaks", streaks);
      saveJSON("vh-tries", tries);
      saveJSON("vh-reviews", reviews);
      saveJSON("vh-pools", pools);
      saveJSON("vh-ranges", ranges);
      saveJSON("vh-cycles", cycles);
      saveJSON("vh-deck", deckId);
      saveJSON("vh-auto-reveal", autoReveal);
      saveJSON("vh-auto-speak", autoSpeak);
      saveJSON("vh-auto-timeout", autoTimeout);
      saveJSON("vh-updated-at", s.updatedAt || Date.now());
      autoRevealEl.checked = autoReveal;
      autoSpeakEl.checked = autoSpeak;
      autoTimeoutEl.checked = autoTimeout;
    } finally {
      applyingRemote = false;
    }
  }

  function setSyncNote(text) { syncNote.textContent = text; }
  function timeLabel(ts) {
    const d = new Date(ts);
    return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function scheduleSync() {
    if (!cloudDb || applyingRemote) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { syncTimer = null; pushNow(); }, 1500);
  }

  function pushNow(retry) {
    if (!cloudDb) return Promise.resolve();
    const state = snapshotState();
    return cloudDb.doc(PROGRESS_DOC).set(state).then(() => {
      saveJSON("vh-synced-at", state.updatedAt);
      setSyncNote("クラウドに保存済み（覚えた単語 全体 " + state.learned.length + " 語 / 最終保存 " + timeLabel(Date.now()) + "）。端末を替えても記録は引き継がれます。");
    }).catch((e) => {
      if (e && e.code === "unavailable" && !retry) {
        return new Promise((r) => setTimeout(r, 800 + Math.random() * 800)).then(() => pushNow(true));
      }
      setSyncNote("クラウド保存に失敗しました（" + ((e && e.code) || "error") + "）。端末内には保存されています。");
    });
  }

  function pullAndMerge() {
    if (!cloudDb) return Promise.resolve();
    lastPullAt = Date.now();
    return cloudDb.doc(PROGRESS_DOC).get().then((snap) => {
      const local = snapshotState();
      if (!snap.exists) return pushNow();
      // snapshot data is frozen; work on a mutable copy
      const remote = clone(snap.data()) || {};
      const merged = mergeStates(local, remote);
      const changedLocally = stateKey(merged) !== stateKey(local);
      if (changedLocally) {
        const beforeDeck = deckId;
        const beforeRange = JSON.stringify(ranges[deckId] || null);
        const beforePool = new Set(Array.isArray(pools[deckId]) ? pools[deckId] : []);
        applyState(merged);
        const afterPool = Array.isArray(pools[deckId]) ? pools[deckId] : [];
        const sameDeck = deckId === beforeDeck && JSON.stringify(ranges[deckId] || null) === beforeRange &&
          afterPool.every((w) => beforePool.has(w));
        if (!sameDeck || deck.length === 0) {
          // the deck itself changed (other device, range, wiped storage): rebuild it
          resetDeck();
        } else {
          // only records changed: keep the cycle where it is, drop cards that
          // are no longer valid, refresh the header
          updateDeckName(deck.filter((x) => !x.review).length);
          const cur = current();
          if (cur && !stillInDeck(cur)) next();
        }
      }
      if (stateKey(merged) !== stateKey(Object.assign({ learned: [], favorites: [], streaks: {} }, remote))) return pushNow();
      saveJSON("vh-synced-at", merged.updatedAt);
      setSyncNote("クラウドに保存済み（覚えた単語 全体 " + merged.learned.length + " 語）。端末を替えても記録は引き継がれます。");
    }).catch((e) => {
      setSyncNote("クラウドの記録を読めませんでした（" + ((e && e.code) || "error") + "）。端末内の記録で続行します。");
    });
  }

  if (typeof window.claude !== "undefined" && window.claude && typeof window.claude.use === "function") {
    setSyncNote("クラウド保存に接続中…");
    window.claude.use("db").then((db) => {
      if (!db) { setSyncNote("この端末内に保存しています（クラウド保存は利用できません）。"); return; }
      cloudDb = db;
      pullAndMerge();
    }).catch(() => setSyncNote("この端末内に保存しています（クラウド保存は利用できません）。"));
    // a save still waiting on its timer would be lost if the page is put away
    // (iOS suspends background pages) and the cloud copy would go stale
    const flushSync = () => {
      updateBadge();
      if (cloudDb && syncTimer) { clearTimeout(syncTimer); syncTimer = null; pushNow(); }
    };
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") { flushSync(); return; }
      if (document.visibilityState === "visible" && cloudDb && Date.now() - lastPullAt > 60000) pullAndMerge();
    });
    window.addEventListener("pagehide", flushSync);
  }

  // ---- init ----
  if (deckId !== FAV_DECK_ID && deckId !== LEARNED_DECK_ID && !LEVELS.some((l) => l.id === deckId)) deckId = "4";
  if (levelById(deckId)) lastLevelId = deckId;
  if (!levelById(lastLevelId)) lastLevelId = "4";
  autoRevealEl.checked = !!autoReveal;
  autoSpeakEl.checked = !!autoSpeak;
  autoTimeoutEl.checked = !!autoTimeout;
  earphoneEl.checked = !!earphone && mediaOK;
  earphoneNote.hidden = !earphone;
  // the stand-alone (home-screen) build ships the records as they were when it
  // was built, in seed.js; a device with no record of its own starts from them
  if (typeof window.VH_SEED === "object" && window.VH_SEED && Array.isArray(window.VH_SEED.learned) && !localStorage.getItem("vh-learned")) {
    try { applyState(mergeStates(snapshotState(), window.VH_SEED)); } catch (e) {}
  }
  dropUncounted();
  resetDeck();
</script>
</html>
